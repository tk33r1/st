    <style>
        /* ------------------------------------------------------------------
           CSV ↔ JSON — Dual-pane. The Instrument shell comes from
           data/tools-ui.css; this block holds the two facing editors, the
           swap column between them and the per-pane chrome.
           ------------------------------------------------------------------ */

        :root {
            --accent: #0D9488;
            --accent-ink: #FFFFFF;
            --accent-soft: #E3F5F2;
        }
        @media (prefers-color-scheme: dark) {
            :root.st-theme:not([data-theme="light"]) {
                --accent: #2DD4BF;
                --accent-ink: #06241F;
                --accent-soft: #102723;
            }
        }
        :root.st-theme[data-theme="dark"] {
            --accent: #2DD4BF;
            --accent-ink: #06241F;
            --accent-soft: #102723;
        }

        /* A facing-page editor wants the whole window, not a reading column. */
        .st-theme { --shell: 1440px; }
        .st-theme main {
            max-width: 1440px;
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* ===== dual pane ===== */
        .dual {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            gap: 12px;
            min-height: 0;
        }
        @media (max-width: 900px) {
            .dual {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(300px, 1fr) auto minmax(300px, 1fr);
            }
        }

        .pane {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            border: 1px solid var(--rule);
            border-radius: var(--r-1);
            background: var(--panel);
            overflow: hidden;
            transition: border-color 160ms ease;
        }
        .pane.drag-over { border-color: var(--accent); }
        /* The pane that just received a conversion gets one beat of accent, so
           you can see where the result landed without hunting for it. */
        .pane.landed { animation: pane-land calc(60s / var(--bpm)) ease-out; }
        @keyframes pane-land {
            0%   { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
            100% { border-color: var(--rule); box-shadow: none; }
        }

        .pane-head {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 9px;
            background: var(--panel-2);
            border-bottom: 1px solid var(--rule);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .pane-head::-webkit-scrollbar { display: none; }
        .pane-name {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: var(--ink);
            padding: 0 4px;
            white-space: nowrap;
        }
        .pane-head .spacer { flex: 1; min-width: 8px; }

        .pane-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 9px;
            border: 1px solid var(--rule);
            border-radius: var(--r-1);
            background: var(--panel);
            color: var(--ink-2);
            cursor: pointer;
            white-space: nowrap;
            transition: border-color 120ms ease, color 120ms ease, transform 60ms ease;
        }
        .pane-btn:hover { border-color: var(--accent); color: var(--accent); }
        .pane-btn:active { transform: translateY(2px); }
        .pane-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .pane-btn.icon { padding: 4px 6px; }
        .pane-btn.icon.danger:hover { border-color: var(--err); color: var(--err); }

        .pane-body { position: relative; flex: 1; min-height: 0; }
        .pane-body textarea {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            padding: 14px;
            border: 0;
            outline: none;
            resize: none;
            background: transparent;
            color: var(--ink);
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 1.75;
            white-space: pre;
            tab-size: 2;
            z-index: 2;
            transition: opacity 200ms ease;
        }
        .pane-body textarea::placeholder { color: var(--ink-3); }

        /* Watermark behind an empty pane, doubling as the drop target hint. */
        .pane-ghost {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            pointer-events: none;
            opacity: 0;
            color: var(--ink-3);
            transition: opacity 200ms ease, color 200ms ease;
            z-index: 1;
        }
        .pane-ghost span {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.22em;
        }
        .pane-body textarea:placeholder-shown ~ .pane-ghost { opacity: 0.4; }
        .pane.drag-over .pane-ghost { opacity: 1; color: var(--accent); }
        .pane.drag-over .pane-body textarea { opacity: 0.2; }

        .pane-foot {
            padding: 5px 10px;
            border-top: 1px solid var(--rule);
            background: var(--panel-2);
        }
        .pane-foot span {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-size: 10.5px;
            color: var(--ink-3);
        }

        /* ===== swap column ===== */
        .swap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        @media (max-width: 900px) { .swap { flex-direction: row; } }

        .swap-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-width: 92px;
            padding: 10px 14px;
            border: 1px solid var(--accent);
            border-radius: var(--r-1);
            background: var(--accent);
            color: var(--accent-ink);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: filter 120ms ease, transform 60ms ease;
        }
        .swap-btn:hover { filter: brightness(1.08); }
        .swap-btn:active { transform: translateY(2px); }
        .swap-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .swap-btn.quiet {
            background: var(--panel);
            color: var(--ink-2);
            border-color: var(--rule);
        }
        .swap-btn.quiet:hover { border-color: var(--accent); color: var(--accent); filter: none; }

        /* ===== toast (this tool predates the shared helper) ===== */
        #toast {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: calc(100vw - 40px);
            padding: 10px 16px;
            border: 1px solid var(--canvas-rule);
            border-radius: var(--r-1);
            background: var(--canvas);
            color: var(--canvas-ink);
            font-size: 13px;
            box-shadow: var(--shadow-1);
            z-index: 120;
            pointer-events: none;
            transition: opacity 220ms ease, transform 220ms ease;
        }
        #toast.hide { transform: translate(-50%, 80px); opacity: 0; }
        #toast .t-ok { color: var(--accent); }
        #toast .t-err { color: #F87171; }
    </style>
</head>

    <script>
        /* Theme: system by default, explicit choice remembered. */
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const root = document.documentElement;
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const current = root.getAttribute('data-theme') || (systemDark ? 'dark' : 'light');
            const next = current === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('st-theme', next); } catch (e) { }
        });

        /* The swap column turns horizontal on a narrow screen, so the arrows
           have to turn with it. */
        (function () {
            const mq = window.matchMedia('(max-width: 900px)');
            const sync = () => {
                document.querySelectorAll('.swap-h').forEach(el => el.classList.toggle('hidden', mq.matches));
                document.querySelectorAll('.swap-v').forEach(el => el.classList.toggle('hidden', !mq.matches));
            };
            mq.addEventListener('change', sync);
            sync();
        })();
      /* The mark beside the trail is this page's own favicon, read from
         the <link>, so the bar and the browser tab cannot drift apart. */
      (function () {
        var icon = document.querySelector('link[rel="icon"]');
        var mark = document.querySelector('.crumb-mark');
        if (icon && mark) mark.style.backgroundImage = 'url("' + icon.href + '")';
      })();
    /* The way back up follows the reader: it appears only once there is
       something to scroll back over. */
    (function () {
      var btn = document.getElementById('scroll-top-btn');
      if (!btn) return;
      window.addEventListener('scroll', function () {
        btn.classList.toggle('visible', window.scrollY > 300);
      }, { passive: true });
      btn.addEventListener('click', function () {
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
      });
    })();
    </script>

        <script>
        lucide.createIcons();

        // DOM要素の取得
        const csvTextarea    = document.getElementById('csvTextarea');
        const jsonTextarea   = document.getElementById('jsonTextarea');
        const toJsonBtn      = document.getElementById('toJsonBtn');
        const toCsvBtn       = document.getElementById('toCsvBtn');
        const csvClearBtn    = document.getElementById('csvClearBtn');
        const csvCopyBtn     = document.getElementById('csvCopyBtn');
        const csvDownloadBtn = document.getElementById('csvDownloadBtn');
        const csvFileInput   = document.getElementById('csvFileInput');
        const csvUploadBtn   = document.getElementById('csvUploadBtn');
        const csvEncoding    = document.getElementById('csvEncoding');
        const csvStats       = document.getElementById('csvStats');
        const csvPanel       = document.getElementById('csvPanel');
        const jsonClearBtn   = document.getElementById('jsonClearBtn');
        const jsonCopyBtn    = document.getElementById('jsonCopyBtn');
        const jsonDownloadBtn = document.getElementById('jsonDownloadBtn');
        const jsonFileInput  = document.getElementById('jsonFileInput');
        const jsonUploadBtn  = document.getElementById('jsonUploadBtn');
        const jsonStats      = document.getElementById('jsonStats');
        const jsonPanel      = document.getElementById('jsonPanel');
        const hasHeaderCheck = document.getElementById('hasHeaderCheck');
        const toast            = document.getElementById('toast');
        const toastMessage     = document.getElementById('toastMessage');
        const toastIconSuccess = document.getElementById('toastIconSuccess');
        const toastIconError   = document.getElementById('toastIconError');

        // トースト通知を表示する関数
        let toastTimeout;
        function showToast(message, type = 'success') {
            const isSuccess = type === 'success';
            toastMessage.textContent = message;
            toast.classList.remove('hide');
            toastIconSuccess.classList.toggle('hidden', !isSuccess);
            toastIconError.classList.toggle('hidden', isSuccess);
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.add('hide'), 3000);
        }

        // ---- status bar ------------------------------------------------
        const statusLed = document.getElementById('status-led');
        const statusText = document.getElementById('status-text');
        // state: '' (working, pulsing), 'idle', 'err'
        function setStatus(text, state) {
            statusText.textContent = text;
            statusLed.className = 'st-led' + (state ? ' ' + state : '');
        }

        // One beat of accent on the pane that just received a conversion, so
        // the result is easy to find on a two-column screen.
        function markLanded(panel) {
            panel.classList.remove('landed');
            void panel.offsetWidth;
            panel.classList.add('landed');
        }

        // Line splitting has to cope with CRLF, LF and lone CR alike.
        const NEWLINE_RE = /\r\n|\r|\n/;

        // JSON.parse reports a character offset; a line number is what the
        // person editing the left-hand pane can actually act on.
        function jsonErrorWithLine(err, text) {
            const msg = err && err.message ? err.message : String(err);
            const m = /position (\d+)/.exec(msg);
            if (!m) return msg;
            const pos = Math.min(parseInt(m[1], 10), text.length);
            const line = text.slice(0, pos).split(NEWLINE_RE).length;
            return `${line} 行目付近で JSON を解析できませんでした`;
        }

        // ステータスバー更新
        function updateCsvStats() {
            const text = csvTextarea.value;
            if (!text.trim()) { csvStats.textContent = ''; return; }
            const lines = text.trim().split(/\r?\n/);
            
            // ヘッダーの有無に応じてデータ件数を正確に計算
            const dataRows = hasHeaderCheck.checked ? Math.max(0, lines.length - 1) : lines.length;
            
            csvStats.textContent = `${text.length.toLocaleString()} 文字 · ${lines.length} 行 · データ ${dataRows} 件`;
        }

        function updateJsonStats() {
            const text = jsonTextarea.value;
            if (!text.trim()) { jsonStats.textContent = ''; return; }
            const lines = text.trim().split(/\r?\n/).length;
            let extra = '';
            try {
                const parsed = JSON.parse(text);
                if (Array.isArray(parsed)) extra = ` · ${parsed.length} 件`;
            } catch {}
            jsonStats.textContent = `${text.length.toLocaleString()} 文字 · ${lines} 行${extra}`;
        }

        csvTextarea.addEventListener('input', updateCsvStats);
        jsonTextarea.addEventListener('input', updateJsonStats);
        
        // ヘッダー有無の変更時にCSVの件数表示を更新
        hasHeaderCheck.addEventListener('change', updateCsvStats);

        // テキストをバイト列にエンコード
        function encodeToBytes(text, encoding) {
            if (encoding === 'shift-jis') {
                if (typeof Encoding === 'undefined') throw new Error('Shift-JIS ライブラリが読み込めませんでした。');
                const codes = Encoding.convert(Encoding.stringToCode(text), { to: 'SJIS', from: 'UNICODE' });
                return new Uint8Array(codes);
            }
            if (encoding === 'utf-8-bom') {
                const encoded = new TextEncoder().encode(text);
                const result = new Uint8Array(3 + encoded.length);
                result[0] = 0xEF; result[1] = 0xBB; result[2] = 0xBF;
                result.set(encoded, 3);
                return result;
            }
            return new TextEncoder().encode(text);
        }

        // --- 変換ロジック ---

        function parseCSV(csvStr, delimiter = ',') {
            const rows = [];
            const s = csvStr.trim();
            const n = s.length;
            let i = 0;
            while (i < n) {
                const row = [];
                while (i < n) {
                    let field = '';
                    if (s[i] === '"') {
                        i++;
                        while (i < n) {
                            if (s[i] === '"' && s[i + 1] === '"') { field += '"'; i += 2; }
                            else if (s[i] === '"') { i++; break; }
                            else { field += s[i++]; }
                        }
                    } else {
                        while (i < n && s[i] !== delimiter && s[i] !== '\r' && s[i] !== '\n') {
                            field += s[i++];
                        }
                    }
                    row.push(field);
                    if (i < n && s[i] === delimiter) { i++; continue; }
                    break;
                }
                if (i < n && s[i] === '\r') i++;
                if (i < n && s[i] === '\n') i++;
                if (row.length > 0) rows.push(row);
            }
            return rows;
        }

        function csvToJson(csv, hasHeader = true) {
            if (!csv.trim()) throw new Error("CSVデータが空か不正です。");
            const rows = parseCSV(csv);
            if (rows.length === 0) throw new Error("CSVデータが空か不正です。");
            
            const result = [];
            let headers = [];
            let startIndex = 0;

            if (hasHeader) {
                headers = rows[0];
                startIndex = 1;
            } else {
                let maxCols = 0;
                for (const row of rows) {
                    if (row.length > maxCols) maxCols = row.length;
                }
                for (let i = 0; i < maxCols; i++) {
                    headers.push(`Column${i + 1}`);
                }
            }

            for (let i = startIndex; i < rows.length; i++) {
                const row = rows[i];
                if (row.length === 0 || (row.length === 1 && row[0] === '')) continue;
                const obj = {};
                for (let j = 0; j < headers.length; j++) {
                    obj[headers[j]] = row[j] !== undefined ? row[j] : '';
                }
                result.push(obj);
            }
            return result;
        }

        function quoteField(val, delimiter = ',') {
            if (val.includes(delimiter) || val.includes('\n') || val.includes('\r') || val.includes('"')) {
                return '"' + val.replace(/"/g, '""') + '"';
            }
            return val;
        }

        function jsonToCsv(jsonStr, hasHeader = true) {
            const data = JSON.parse(jsonStr);
            if (!Array.isArray(data) || data.length === 0) {
                throw new Error("有効なJSON配列ではありません。");
            }
            
            const stringifyValue = (val) => {
                if (val === null || val === undefined) return '';
                if (typeof val === 'object') return JSON.stringify(val);
                return String(val);
            };

            // JSONが二次元配列の場合の処理
            if (Array.isArray(data[0])) {
                const csvRows = [];
                for (const row of data) {
                    const values = row.map(val => quoteField(stringifyValue(val)));
                    csvRows.push(values.join(','));
                }
                return csvRows.join('\n');
            }

            const headers = Array.from(new Set(data.flatMap(Object.keys)));
            const csvRows = [];

            if (hasHeader) {
                csvRows.push(headers.map(h => quoteField(h)).join(','));
            }

            for (const row of data) {
                const values = headers.map(header => quoteField(stringifyValue(row[header])));
                csvRows.push(values.join(','));
            }
            return csvRows.join('\n');
        }

        // --- イベントリスナー ---

        // CSVテキストエリアへのペースト（エクセルからのTSV対応）
        csvTextarea.addEventListener('paste', (e) => {
            // レガシーな window.clipboardData を削除しスッキリ記述
            const pasteData = e.clipboardData.getData('text');
            const isEmptyBeforePaste = csvTextarea.value.trim() === '';
            
            // タブが含まれている場合はTSVとみなしてCSVに変換
            if (pasteData.includes('\t')) {
                e.preventDefault(); // デフォルトのペーストをキャンセル
                try {
                    const rows = parseCSV(pasteData, '\t');
                    const csvRows = rows.map(row => row.map(val => quoteField(val)).join(','));
                    const csvString = csvRows.join('\n');
                    
                    // 変換したCSV文字列をテキストエリアのカーソル位置に挿入
                    csvTextarea.setRangeText(csvString, csvTextarea.selectionStart, csvTextarea.selectionEnd, 'end');
                    updateCsvStats();
                    
                    // ペースト前が空だった場合は自動でJSON変換も実行
                    if (isEmptyBeforePaste) {
                        try {
                            const jsonObj = csvToJson(csvTextarea.value, hasHeaderCheck.checked);
                            jsonTextarea.value = JSON.stringify(jsonObj, null, 2);
                            updateJsonStats();
                            showToast('エクセルデータをペーストし、自動でJSONに変換しました！');
                        } catch (err) {
                            showToast('エクセルからペーストされたデータをCSV形式に変換しました。');
                        }
                    } else {
                        showToast('エクセルからペーストされたデータをCSV形式に変換しました。');
                    }
                    return; // 処理完了
                } catch (error) {
                    // パース失敗時は通常のペースト処理へフォールバック
                }
            }
            
            // TSV以外の通常ペースト時も、空の状態へのペーストなら自動変換を試みる
            if (isEmptyBeforePaste && pasteData) {
                e.preventDefault();
                csvTextarea.setRangeText(pasteData, csvTextarea.selectionStart, csvTextarea.selectionEnd, 'end');
                updateCsvStats();
                try {
                    const jsonObj = csvToJson(csvTextarea.value, hasHeaderCheck.checked);
                    jsonTextarea.value = JSON.stringify(jsonObj, null, 2);
                    updateJsonStats();
                    showToast('データをペーストし、自動でJSONに変換しました！');
                } catch (err) {
                    // パース失敗時（CSVフォーマットでない等）は通知しない
                }
            }
        });

        // CSVからJSONへ手動変換
        toJsonBtn.addEventListener('click', () => {
            if (!csvTextarea.value.trim()) { showToast('CSVデータを入力してください。', 'error'); return; }
            try {
                const jsonObj = csvToJson(csvTextarea.value, hasHeaderCheck.checked);
                jsonTextarea.value = JSON.stringify(jsonObj, null, 2);
                updateJsonStats();
                markLanded(jsonPanel);
                setStatus(`csv → json  ${Array.isArray(jsonObj) ? jsonObj.length : 1} 件`, 'idle');
                showToast('JSON形式に変換しました！');
            } catch (error) {
                setStatus('csv → json 失敗', 'err');
                showToast(error.message || 'CSVの変換に失敗しました。', 'error');
            }
        });

        // JSONからCSVへ手動変換
        toCsvBtn.addEventListener('click', () => {
            if (!jsonTextarea.value.trim()) { showToast('JSONデータを入力してください。', 'error'); return; }
            try {
                const csvStr = jsonToCsv(jsonTextarea.value, hasHeaderCheck.checked);
                csvTextarea.value = csvStr;
                updateCsvStats();
                markLanded(csvPanel);
                setStatus(`json → csv  ${csvStr.split(NEWLINE_RE).length} 行`, 'idle');
                showToast('CSV形式に変換しました！');
            } catch (error) {
                // The offending line lives in the pane the reader is editing,
                // so name it there rather than reporting a raw character offset.
                const msg = jsonErrorWithLine(error, jsonTextarea.value);
                setStatus('json → csv 失敗', 'err');
                showToast(msg, 'error');
            }
        });

        const clearArea = (textarea, isCsv) => { 
            textarea.value = ''; 
            textarea.focus(); 
            if (isCsv) updateCsvStats(); else updateJsonStats();
        };

        const copyArea = async (textarea) => {
            if (!textarea.value) { showToast('コピーするデータがありません。', 'error'); return; }
            try {
                await navigator.clipboard.writeText(textarea.value);
                showToast('クリップボードにコピーしました！');
            } catch (err) {
                showToast('コピーに失敗しました。', 'error');
            }
        };

        const downloadFile = async (textarea, filename, mimeType, encoding = 'utf-8') => {
            if (!textarea.value) { showToast('ダウンロードするデータがありません。', 'error'); return; }
            let data;
            try {
                data = encodeToBytes(textarea.value, encoding);
            } catch (err) {
                showToast(err.message || '保存に失敗しました。', 'error'); return;
            }
            
            // 従来のダウンロード方式（フォールバック）
            const useFallbackDownload = () => {
                const blob = new Blob([data], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast(filename + ' をダウンロードしました。');
            };

            if ('showSaveFilePicker' in window) {
                try {
                    const ext = filename.split('.').pop();
                    const fileHandle = await window.showSaveFilePicker({
                        suggestedName: filename,
                        types: [{ description: ext.toUpperCase() + ' ファイル', accept: { [mimeType]: ['.' + ext] } }]
                    });
                    const writable = await fileHandle.createWritable();
                    await writable.write(data);
                    await writable.close();
                    showToast(fileHandle.name + ' を保存しました。');
                } catch (err) {
                    if (err.name === 'AbortError') {
                        // ユーザーがキャンセルした場合は何もしない
                        return;
                    }
                    // iframe内などの制限で失敗した場合はフォールバックを実行
                    console.warn('File picker failed, using fallback:', err);
                    useFallbackDownload();
                }
            } else {
                useFallbackDownload();
            }
        };

        csvClearBtn.addEventListener('click', () => clearArea(csvTextarea, true));
        jsonClearBtn.addEventListener('click', () => clearArea(jsonTextarea, false));
        csvCopyBtn.addEventListener('click', () => copyArea(csvTextarea));
        jsonCopyBtn.addEventListener('click', () => copyArea(jsonTextarea));

        csvDownloadBtn.addEventListener('click', () => {
            downloadFile(csvTextarea, 'data.csv', 'text/csv', csvEncoding.value);
        });
        jsonDownloadBtn.addEventListener('click', () => {
            downloadFile(jsonTextarea, 'data.json', 'application/json');
        });

        // ファイル読み込み ＆ 【自動変換】
        function readFileToTextarea(file, textarea, typeLabel) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const buffer = e.target.result;
                let text;
                try {
                    text = new TextDecoder('utf-8', { fatal: true }).decode(buffer);
                    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                } catch {
                    text = new TextDecoder('shift-jis').decode(buffer);
                }
                textarea.value = text;
                
                // 読み込み直後に自動変換を実行
                if (textarea === csvTextarea) {
                    updateCsvStats();
                    try {
                        const jsonObj = csvToJson(text, hasHeaderCheck.checked);
                        jsonTextarea.value = JSON.stringify(jsonObj, null, 2);
                        updateJsonStats();
                        showToast(`${file.name} を読み込み、自動でJSONに変換しました！`);
                    } catch (err) {
                        showToast(`${file.name} を読み込みましたが、自動変換できませんでした。`, 'error');
                    }
                } else {
                    updateJsonStats();
                    try {
                        const csvStr = jsonToCsv(text, hasHeaderCheck.checked);
                        csvTextarea.value = csvStr;
                        updateCsvStats();
                        showToast(`${file.name} を読み込み、自動でCSVに変換しました！`);
                    } catch (err) {
                        showToast(`${file.name} を読み込みましたが、自動変換できませんでした。`, 'error');
                    }
                }
            };
            reader.onerror = () => {
                showToast(`${typeLabel}ファイルの読み込みに失敗しました。`, 'error');
            };
            reader.readAsArrayBuffer(file);
        }

        const setupFileUpload = (uploadBtn, fileInput, textarea, typeLabel) => {
            uploadBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;
                readFileToTextarea(file, textarea, typeLabel);
                fileInput.value = '';
            });
        };

        setupFileUpload(csvUploadBtn, csvFileInput, csvTextarea, 'CSV');
        setupFileUpload(jsonUploadBtn, jsonFileInput, jsonTextarea, 'JSON');

        function setupDragDrop(panel, textarea, typeLabel, acceptedExts) {
            panel.addEventListener('dragover', (e) => {
                e.preventDefault();
                panel.classList.add('drag-over');
            });
            panel.addEventListener('dragleave', (e) => {
                if (!panel.contains(e.relatedTarget)) {
                    panel.classList.remove('drag-over');
                }
            });
            panel.addEventListener('drop', (e) => {
                e.preventDefault();
                panel.classList.remove('drag-over');
                const file = e.dataTransfer.files[0];
                if (!file) return;
                const ext = file.name.split('.').pop().toLowerCase();
                if (!acceptedExts.includes(ext)) {
                    showToast(`${acceptedExts.join(' / ')} ファイルをドロップしてください。`, 'error');
                    return;
                }
                readFileToTextarea(file, textarea, typeLabel);
            });
        }

        setupDragDrop(csvPanel, csvTextarea, 'CSV', ['csv']);
        setupDragDrop(jsonPanel, jsonTextarea, 'JSON', ['json']);

        // 初期ステータス表示
        updateCsvStats();
        updateJsonStats();

        // 現在の年をフッターに設定
        document.getElementById('currentYear').textContent = new Date().getFullYear();

    </script>

      <i data-lucide="arrow-up"></i>
    </button>
