  <script>
    /* Theme: system by default, explicit choice remembered. The stamp on
       <html> is what data/tools-ui.css keys its dark tokens off. */
    (function () {
      const KEY = 'st-theme';
      const root = document.documentElement;
      let saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) { /* site data blocked */ }
      if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);

      document.getElementById('theme-toggle').addEventListener('click', () => {
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const current = root.getAttribute('data-theme') || (systemDark ? 'dark' : 'light');
        const next = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem(KEY, next); } catch (e) { /* site data blocked */ }
      });
    })();
    /* The mark beside the trail is this page's own favicon, read from
       the <link>, so the bar and the browser tab cannot drift apart. */
    (function () {
      var icon = document.querySelector('link[rel="icon"]');
      var mark = document.querySelector('.crumb-mark');
      if (icon && mark) mark.style.backgroundImage = 'url("' + icon.href + '")';
    })();
  /* The way back up follows the reader: it appears only once there is
     something to scroll back over. */
  (function () {
    var btn = document.getElementById('scroll-top-btn');
    if (!btn) return;
    window.addEventListener('scroll', function () {
      btn.classList.toggle('visible', window.scrollY > 300);
    }, { passive: true });
    btn.addEventListener('click', function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    });
  })();
  </script>

  <script>
    const { formatBytes, showToast, switchView, isPrivateHost, setupDropzone, setupInlineCompare } = window.STCommon;

    lucide.createIcons();
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    // ---- Console -------------------------------------------------------
    // The processing view narrates the real pipeline rather than spinning.
    // Every line here corresponds to work that actually happened.
    const consoleBox = document.getElementById('console');
    const logStream = document.getElementById('log-stream');
    const statusLed = document.getElementById('status-led');
    const statusText = document.getElementById('status-text');

    function logLine(text, cls) {
      const el = document.createElement('div');
      el.className = 'cl' + (cls ? ' ' + cls : '');
      el.textContent = text;
      logStream.appendChild(el);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function clearLog() { logStream.innerHTML = ''; }

    // state: '' (working, pulsing), 'idle', 'err'
    function setStatus(text, state) {
      statusText.textContent = text;
      statusLed.className = 'st-led' + (state ? ' ' + state : '');
    }

    const prefersReducedMotion = () =>
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ---- Gauge ---------------------------------------------------------
    // The result number counts up over exactly one beat, so the payoff lands
    // on the same pulse the caret and the status LED run at.
    function beatMs() {
      const bpm = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue('--bpm')
      );
      return 60000 / (bpm > 0 ? bpm : 60);
    }

    function animateCount(el, to, render) {
      if (prefersReducedMotion()) { el.textContent = render(to); return; }
      const duration = beatMs();
      const start = performance.now();
      function frame(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = render(to * eased);
        if (t < 1) requestAnimationFrame(frame);
        else el.textContent = render(to);
      }
      requestAnimationFrame(frame);
    }

    // Elements
    const formatBtns = document.querySelectorAll('.format-btn');
    let selectedFormat = 'webp';

    const formatExtensions = {
      'webp': 'webp',
      'webp-lossless': 'webp',
      'avif': 'avif'
    };

    const formatMimeTypes = {
      'webp': 'image/webp',
      'webp-lossless': 'image/webp',
      'avif': 'image/avif'
    };

    formatBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        formatBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedFormat = btn.dataset.format;
        applyQualityState();
      });
    });

    const optQuality = document.getElementById('opt-quality');
    const qualityVal = document.getElementById('quality-val');
    const qualityRow = document.getElementById('quality-row');

    optQuality.addEventListener('input', (e) => {
      qualityVal.textContent = e.target.value + '%';
    });

    function applyQualityState() {
      const disabled = selectedFormat === 'webp-lossless';
      optQuality.disabled = disabled;
      qualityRow.classList.toggle('quality-disabled', disabled);
    }
    applyQualityState();

    // Resize control (scale down by percentage, aspect ratio preserved)
    const resizePercent = document.getElementById('resize-percent');

    // Compute target dimensions from a scale percentage, keeping aspect ratio.
    // Only shrinks — 100% (or anything >= 100) leaves the image untouched.
    function computeResizeTarget(w, h, percent) {
      const p = parseFloat(percent);
      if (!p || p <= 0 || p >= 100) return { w, h };
      const scale = p / 100;
      return {
        w: Math.max(1, Math.round(w * scale)),
        h: Math.max(1, Math.round(h * scale)),
      };
    }

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');

    const loadingMsg = document.getElementById('loading-msg');
    const loadingSubmsg = document.getElementById('loading-submsg');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');

    const resultList = document.getElementById('result-list');
    const summaryOriginal = document.getElementById('summary-original');
    const summaryOutput = document.getElementById('summary-output');
    const summaryBadge = document.getElementById('summary-badge');
    const summaryCount = document.getElementById('summary-count');
    const btnDownloadAll = document.getElementById('btn-download-all');
    const btnDownloadAllLabel = document.getElementById('btn-download-all-label');
    const btnReset = document.getElementById('btn-reset');

    const urlInput = document.getElementById('url-input');
    const urlBtn = document.getElementById('url-btn');

    let results = [];        // array of result objects
    // Teardowns for each rendered inline compare slider — replaced wholesale
    // on every renderResults() so listeners can't accumulate across runs.
    let compareTeardowns = [];
    let blobUrls = [];       // all created blob URLs (for cleanup)
    let isProcessing = false;

    function isHeicFile(file) {
      const n = file.name.toLowerCase();
      return n.endsWith('.heic') || n.endsWith('.heif')
        || file.type === 'image/heic' || file.type === 'image/heif';
    }

    async function decodeToBitmap(file) {
      if (isHeicFile(file)) {
        const conversionResult = await heic2any({ blob: file, toType: 'image/png' });
        const blobArr = Array.isArray(conversionResult) ? conversionResult : [conversionResult];
        const png = new File(blobArr, file.name.replace(/\.heic$|\.heif$/i, '.png'), { type: 'image/png' });
        return await createImageBitmap(png);
      }
      return await createImageBitmap(file);
    }

    // Lazily loaded WASM-based AVIF encoder (used when the browser's native canvas.toBlob
    // does not support image/avif). The module is fetched only when needed.
    let avifEncoderPromise = null;
    function loadAvifEncoder() {
      if (!avifEncoderPromise) {
        avifEncoderPromise = import('https://esm.sh/@jsquash/avif@2.1.1').then(m => m.encode);
      }
      return avifEncoderPromise;
    }

    let webpEncoderPromise = null;
    function loadWebpEncoder() {
      if (!webpEncoderPromise) {
        webpEncoderPromise = import('https://esm.sh/@jsquash/webp@1.4.0').then(m => m.encode);
      }
      return webpEncoderPromise;
    }

    async function encodeCanvasAsLosslessWebp(canvas, statusUpdate) {
      statusUpdate && statusUpdate('可逆WebPエンコーダを読み込み中...');
      let encode;
      try {
        encode = await loadWebpEncoder();
      } catch (e) {
        console.error('jsquash WebP load failed:', e);
        throw new Error('WebPエンコーダの読み込みに失敗しました: ' + (e.message || e));
      }
      statusUpdate && statusUpdate('可逆WebPを生成中 (WASM)...');
      const ctx = canvas.getContext('2d');
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const buf = await encode(imageData, { lossless: 1, quality: 100, exact: 1 });
      return new Blob([buf], { type: 'image/webp' });
    }

    async function encodeWithCanvasToBlob(canvas, mimeType, q) {
      const blob = await new Promise((resolve) => {
        canvas.toBlob(b => resolve(b), mimeType, q);
      });
      console.log('[encode] canvas.toBlob returned:', blob && blob.type, 'size=' + (blob && blob.size));
      return blob;
    }

    async function encodeCanvasAsAvif(canvas, quality, statusUpdate) {
      // 1) Try native canvas.toBlob('image/avif') — fastest when available
      const native = await encodeWithCanvasToBlob(canvas, 'image/avif', quality);
      if (native && native.type === 'image/avif') return native;

      // 2) Fall back to WASM encoder (jsquash)
      statusUpdate && statusUpdate('AVIFエンコーダを読み込み中...');
      let encode;
      try {
        encode = await loadAvifEncoder();
      } catch (e) {
        console.error('jsquash AVIF load failed:', e);
        throw new Error('AVIFエンコーダの読み込みに失敗しました: ' + (e.message || e));
      }
      statusUpdate && statusUpdate('AVIFを生成中 (WASM)...');
      const ctx = canvas.getContext('2d');
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const buf = await encode(imageData, { quality: Math.round(quality * 100) });
      return new Blob([buf], { type: 'image/avif' });
    }

    async function encodeOne(file, opts, statusUpdate) {
      const { format, quality } = opts;
      const mimeType = formatMimeTypes[format];

      const bitmap = await decodeToBitmap(file);

      const { w: targetW, h: targetH } = computeResizeTarget(bitmap.width, bitmap.height, opts.resizePercent);

      const canvas = document.createElement('canvas');
      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(bitmap, 0, 0, targetW, targetH);
      if (bitmap.close) bitmap.close();

      const q = quality / 100;

      let blob;
      if (format === 'avif') {
        blob = await encodeCanvasAsAvif(canvas, q, statusUpdate);
      } else if (format === 'webp-lossless') {
        blob = await encodeCanvasAsLosslessWebp(canvas, statusUpdate);
      } else {
        blob = await encodeWithCanvasToBlob(canvas, mimeType, q);
        if (!blob) throw new Error('エンコードに失敗しました (toBlob returned null)');
        if (blob.type !== mimeType) {
          throw new Error('お使いのブラウザは ' + mimeType + ' のエンコードに対応していません');
        }
      }

      if (!blob) throw new Error('エンコードに失敗しました');
      return { blob, width: targetW, height: targetH };
    }

    function buildOutputFilename(originalName, format) {
      const dot = originalName.lastIndexOf('.');
      const baseName = dot >= 0 ? originalName.slice(0, dot) : (originalName || 'image');
      return `${baseName}.${formatExtensions[format]}`;
    }

    async function processFiles(files) {
      if (isProcessing) return;
      if (!files || files.length === 0) return;
      isProcessing = true;

      // Cleanup previous results
      teardownCompares();
      blobUrls.forEach(u => URL.revokeObjectURL(u));
      blobUrls = [];
      results = [];

      switchView('view-loading');
      progressBar.classList.remove('indeterminate');
      clearLog();
      setStatus('working');

      const opts = {
        format: selectedFormat,
        quality: parseInt(optQuality.value, 10),
        resizePercent: parseFloat(resizePercent.value),
      };

      const total = files.length;

      // The command line the user effectively just typed.
      loadingMsg.textContent =
        `convert ${total} file${total > 1 ? 's' : ''} --to ${opts.format}`
        + (opts.format === 'webp-lossless' ? '' : ` --quality ${opts.quality}`)
        + (opts.resizePercent < 100 ? ` --scale ${opts.resizePercent}%` : '');
      loadingSubmsg.textContent = '';

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        loadingSubmsg.textContent = file.name;
        const pct = Math.round((i / total) * 100);
        progressBar.style.width = pct + '%';
        progressText.textContent = `${i} / ${total}`;

        const startedAt = performance.now();
        try {
          const { blob, width, height } = await encodeOne(file, opts, (sub) => {
            loadingSubmsg.textContent = `${file.name} — ${sub}`;
          });
          const elapsed = Math.round(performance.now() - startedAt);
          const savedPct = Math.round((1 - blob.size / file.size) * 100);
          logLine(
            `✓ ${file.name}  ${formatBytes(file.size)} → ${formatBytes(blob.size)}`
            + `  ${savedPct >= 0 ? '-' : '+'}${Math.abs(savedPct)}%  ${width}×${height}  ${elapsed}ms`,
            'ok'
          );
          const outName = buildOutputFilename(file.name, opts.format);
          const outUrl = URL.createObjectURL(blob);
          const beforeUrl = URL.createObjectURL(file);
          blobUrls.push(outUrl, beforeUrl);
          results.push({
            ok: true,
            originalFile: file,
            originalSize: file.size,
            outputBlob: blob,
            outputSize: blob.size,
            outputName: outName,
            outputUrl: outUrl,
            beforeUrl,
            width, height,
          });
        } catch (err) {
          console.error('Conversion failed for', file.name, err);
          logLine(`✗ ${file.name}  ${err.message || '不明なエラー'}`, 'err');
          results.push({
            ok: false,
            originalFile: file,
            originalSize: file.size,
            error: err.message || '不明なエラー',
          });
        }
      }

      progressBar.style.width = '100%';
      progressText.textContent = `${total} / ${total}`;

      isProcessing = false;
      fileInput.value = '';

      renderResults();
      const failCount = results.filter(r => !r.ok).length;
      if (failCount === total) {
        const firstErr = results[0]?.error || '不明なエラー';
        const prefix = total === 1 ? '変換失敗' : `全${total}件失敗`;
        setStatus('failed', 'err');
        showToast(`${prefix}: ${firstErr}`, 'error');
        switchView('view-upload');
      } else if (failCount > 0) {
        setStatus(`${total - failCount} ok / ${failCount} failed`, 'err');
        showToast(`${total - failCount}件成功 / ${failCount}件失敗`, 'error');
        switchView('view-result');
      } else {
        setStatus(`${total} file${total > 1 ? 's' : ''} done`, 'idle');
        showToast(`${total}件の変換が完了しました`);
        switchView('view-result');
      }
    }

    function renderResults() {
      const okResults = results.filter(r => r.ok);
      const totalOrig = results.reduce((s, r) => s + r.originalSize, 0);
      const totalOut = okResults.reduce((s, r) => s + r.outputSize, 0);
      const pct = totalOrig > 0 ? Math.round((1 - totalOut / totalOrig) * 100) : 0;

      summaryOriginal.textContent = formatBytes(totalOrig);
      summaryOutput.textContent = formatBytes(totalOut);
      summaryCount.textContent = okResults.length;
      summaryBadge.classList.toggle('negative', pct < 0);
      animateCount(summaryBadge, pct, v =>
        (pct >= 0 ? '-' : '+') + Math.abs(Math.round(v)) + '%'
      );

      // The bar is only meaningful next to a visible baseline, so it grows
      // from zero once the result view is actually on screen — a transition
      // on a display:none element never runs.
      // Both bars are scaled against the larger of the two, so a file that
      // grew shows a longer "after" bar instead of both pinning at full.
      const barAfter = document.getElementById('bar-after');
      const barBefore = document.querySelector('.bar i.before');
      const barMax = Math.max(totalOrig, totalOut, 1);
      barBefore.style.width = Math.max(1, Math.round((totalOrig / barMax) * 100)) + '%';
      const barTarget = Math.max(1, Math.round((totalOut / barMax) * 100));
      barAfter.style.width = '0%';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        barAfter.style.width = barTarget + '%';
      }));

      btnDownloadAll.disabled = okResults.length === 0;
      btnDownloadAllLabel.textContent = okResults.length > 1
        ? `${okResults.length}件をZIPでダウンロード`
        : '画像をダウンロード';

      teardownCompares();
      resultList.innerHTML = '';

      results.forEach((r) => {
        const row = document.createElement('div');
        row.className = 'result-row' + (r.ok ? '' : ' failed');

        // Inline Before/After compare lives at the top of every successful
        // result row — no button press required.
        if (r.ok) {
          // setupInlineCompare adds .compare-inline to the element it is given,
          // so the darkroom frame has to be a wrapper — styling the same node
          // would override the slider's own checkerboard background.
          const canvasWrap = document.createElement('div');
          canvasWrap.className = 'result-canvas';
          const compareBox = document.createElement('div');
          compareBox.className = 'result-compare';
          canvasWrap.appendChild(compareBox);
          row.appendChild(canvasWrap);
          const teardown = setupInlineCompare({
            container: compareBox,
            beforeUrl: r.beforeUrl,
            afterUrl: r.outputUrl,
          });
          compareTeardowns.push(teardown);
        }

        const metaRow = document.createElement('div');
        metaRow.className = 'result-meta-row';

        if (r.ok) {
          const thumb = document.createElement('img');
          thumb.className = 'result-thumb';
          thumb.alt = '';
          thumb.src = r.outputUrl;
          metaRow.appendChild(thumb);
        }

        const info = document.createElement('div');
        info.className = 'r-info';
        const name = document.createElement('div');
        name.className = 'r-name';
        name.title = r.originalFile.name;
        name.textContent = r.ok ? r.outputName : r.originalFile.name;
        info.appendChild(name);

        const meta = document.createElement('div');
        meta.className = 'r-meta';
        if (r.ok) {
          const rpct = Math.round((1 - r.outputSize / r.originalSize) * 100);
          const badge = document.createElement('span');
          badge.className = 'savings-badge' + (rpct < 0 ? ' negative' : '');
          badge.textContent = (rpct >= 0 ? '-' : '+') + Math.abs(rpct) + '%';
          meta.appendChild(badge);
          const sizeSpan = document.createElement('span');
          sizeSpan.innerHTML = `${formatBytes(r.originalSize)} <span class="r-arrow">→</span> <span class="r-out">${formatBytes(r.outputSize)}</span>`;
          meta.appendChild(sizeSpan);
          if (r.width && r.height) {
            const dim = document.createElement('span');
            dim.className = 'r-dim';
            dim.textContent = `${r.width}×${r.height}`;
            meta.appendChild(dim);
          }
        } else {
          const err = document.createElement('span');
          err.className = 'r-err';
          err.textContent = '失敗: ' + r.error;
          meta.appendChild(err);
        }
        info.appendChild(meta);
        metaRow.appendChild(info);

        const actions = document.createElement('div');
        actions.className = 'flex items-center gap-1';
        if (r.ok) {
          if (canShareResult()) {
            const shareBtn = document.createElement('button');
            shareBtn.className = 'icon-btn';
            shareBtn.title = '共有';
            shareBtn.setAttribute('aria-label', '共有');
            shareBtn.innerHTML = '<i data-lucide="share-2" class="w-4 h-4"></i>';
            shareBtn.addEventListener('click', () => shareOne(r, shareBtn));
            actions.appendChild(shareBtn);
          }
        }
        metaRow.appendChild(actions);

        row.appendChild(metaRow);
        resultList.appendChild(row);
      });

      if (window.lucide) lucide.createIcons();
    }

    function downloadOne(r) {
      const a = document.createElement('a');
      a.href = r.outputUrl;
      a.download = r.outputName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      if (window.STShare) STShare.celebrate();
    }

    function canShareResult() {
      const hasWebShare = typeof navigator.canShare === 'function';
      const hasClipboardItem = typeof navigator.clipboard !== 'undefined' && typeof window.ClipboardItem !== 'undefined';
      return hasWebShare || hasClipboardItem;
    }

    async function shareOne(r, btn) {
      const file = new File([r.outputBlob], r.outputName, { type: r.outputBlob.type });

      // 1) Web Share API (mobile, Safari, Edge) — shares the actual file
      if (typeof navigator.canShare === 'function' && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: r.outputName });
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') return;
          // fall through to clipboard fallback
        }
      }

      // 2) Clipboard fallback — copies the image (limited to types the browser allows; PNG always, WEBP on modern Chromium)
      if (typeof navigator.clipboard !== 'undefined' && typeof window.ClipboardItem !== 'undefined') {
        try {
          await navigator.clipboard.write([new ClipboardItem({ [r.outputBlob.type]: r.outputBlob })]);
          showToast('画像をクリップボードにコピーしました', 'success');
          if (btn) flashShareBtn(btn);
          return;
        } catch (e) {
          // Some browsers reject AVIF/WEBP for clipboard. Fall through.
        }
      }

      showToast('この環境では共有がサポートされていません', 'error');
    }

    function flashShareBtn(btn) {
      const original = btn.innerHTML;
      btn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i>';
      if (window.lucide) lucide.createIcons();
      setTimeout(() => {
        btn.innerHTML = original;
        if (window.lucide) lucide.createIcons();
      }, 1400);
    }

    async function downloadAllAsZip() {
      const okResults = results.filter(r => r.ok);
      if (okResults.length === 0) return;

      if (okResults.length === 1) {
        downloadOne(okResults[0]);
        return;
      }

      if (typeof JSZip === 'undefined') {
        showToast('ZIPライブラリの読み込みに失敗しました', 'error');
        return;
      }

      const zip = new JSZip();
      // Avoid filename collisions
      const used = new Map();
      okResults.forEach(r => {
        let name = r.outputName;
        const seen = used.get(name) || 0;
        if (seen > 0) {
          const dot = name.lastIndexOf('.');
          const base = dot >= 0 ? name.slice(0, dot) : name;
          const ext = dot >= 0 ? name.slice(dot) : '';
          name = `${base}_${seen}${ext}`;
        }
        used.set(r.outputName, seen + 1);
        zip.file(name, r.outputBlob);
      });

      btnDownloadAll.disabled = true;
      btnDownloadAllLabel.textContent = 'ZIPを生成中...';
      try {
        const content = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(content);
        const a = document.createElement('a');
        a.href = url;
        const ts = new Date().toISOString().replace(/[:T]/g, '-').slice(0, 16);
        a.download = `converted_${ts}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        if (window.STShare) STShare.celebrate();
      } catch (err) {
        console.error('ZIP creation failed', err);
        showToast('ZIP生成に失敗しました: ' + (err.message || ''), 'error');
      } finally {
        btnDownloadAll.disabled = false;
        btnDownloadAllLabel.textContent = `${okResults.length}件をZIPでダウンロード`;
      }
    }

    function teardownCompares() {
      compareTeardowns.forEach(fn => { try { fn(); } catch (_) { } });
      compareTeardowns = [];
    }

    async function loadFromUrl(url) {
      if (!url) return;

      let urlObj;
      try {
        urlObj = new URL(url);
      } catch (e) {
        showToast('URLの形式が正しくありません', 'error');
        return;
      }
      if (urlObj.protocol !== 'http:' && urlObj.protocol !== 'https:') {
        showToast('http(s) のURLを指定してください', 'error');
        return;
      }
      if (isPrivateHost(urlObj.hostname)) {
        showToast('ローカル/プライベートIPのURLは利用できません', 'error');
        return;
      }

      switchView('view-loading');
      clearLog();
      setStatus('fetching');
      loadingMsg.textContent = `fetch ${urlObj.href}`;
      loadingSubmsg.textContent = '画像を取得しています…';

      try {
        let response;
        let usedProxy = false;
        let directError = null;
        try {
          response = await fetch(url, { mode: 'cors', credentials: 'omit' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
        } catch (e) {
          directError = e;
          const ok = window.confirm(
            '直接の画像取得に失敗しました。\n外部プロキシ経由で再試行しますか？\n\n注意: プロキシ運営者にURLと画像内容が渡ります。'
          );
          if (!ok) {
            switchView('view-upload');
            return;
          }
          console.warn('Direct fetch failed:', directError);
          usedProxy = true;

          // Try image-specialized proxy first (more reliable than generic CORS proxies)
          const stripped = url.replace(/^https?:\/\//, '');
          const proxies = [
            `https://images.weserv.nl/?url=${encodeURIComponent(stripped)}`,
            `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
          ];

          let lastErr = null;
          let lastProxyHost = null;
          response = null;
          for (const proxyUrl of proxies) {
            try {
              console.log('Trying proxy:', proxyUrl);
              const r = await fetch(proxyUrl, { mode: 'cors', credentials: 'omit' });
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              response = r;
              break;
            } catch (perr) {
              lastErr = perr;
              try { lastProxyHost = new URL(proxyUrl).host; } catch (_) { lastProxyHost = proxyUrl; }
              console.warn('Proxy failed:', proxyUrl, perr);
            }
          }
          if (!response) {
            const hostHint = lastProxyHost ? ` (${lastProxyHost})` : '';
            throw new Error(`すべてのプロキシで失敗${hostHint}: ${lastErr?.message || '不明'}`);
          }
        }

        const contentType = response.headers.get('content-type') || '';
        const blob = await response.blob();
        const blobType = blob.type || contentType;

        if (blobType && !blobType.startsWith('image/') && blobType !== 'application/octet-stream') {
          throw new Error(`画像ではないデータを受信しました (${blobType})`);
        }

        let filename = 'downloaded_image';
        const pathParts = urlObj.pathname.split('/');
        const lastPart = pathParts[pathParts.length - 1];
        if (lastPart && lastPart.includes('.')) {
          filename = lastPart;
        }

        const file = new File([blob], filename, { type: blobType || 'image/png' });
        if (usedProxy) showToast('プロキシ経由で取得しました');
        processFiles([file]);
      } catch (err) {
        console.error('URL Load error:', err);
        setStatus('fetch failed', 'err');
        showToast(`取得失敗: ${err.message || 'unknown'}`, 'error');
        switchView('view-upload');
      }
    }

    function filterImageFiles(fileList) {
      return Array.from(fileList || []).filter(f => {
        if (!f) return false;
        if (f.type && f.type.startsWith('image/')) return true;
        const n = (f.name || '').toLowerCase();
        return n.endsWith('.heic') || n.endsWith('.heif');
      });
    }

    fileInput.addEventListener('change', (e) => {
      const files = filterImageFiles(e.target.files);
      if (files.length) processFiles(files);
    });

    setupDropzone({
      dropzone,
      fileInput,
      onFiles: (fileList) => {
        const files = filterImageFiles(fileList);
        if (files.length) processFiles(files);
        else showToast('画像ファイルを選択してください', 'error');
      },
    });

    // Paste event handling
    document.addEventListener('paste', (e) => {
      // Don't intercept if user is typing in a text input
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      const pastedFiles = [];
      for (const item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          const blob = item.getAsFile();
          if (blob) {
            const ext = (blob.type.split('/')[1] || 'png').replace(/[^a-z0-9]/gi, '');
            pastedFiles.push(new File([blob], `pasted_image_${pastedFiles.length + 1}.${ext}`, { type: blob.type }));
          }
        }
      }
      if (pastedFiles.length) processFiles(pastedFiles);
    });

    urlBtn.addEventListener('click', () => {
      const url = urlInput.value.trim();
      if (url) loadFromUrl(url);
    });

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const url = urlInput.value.trim();
        if (url) loadFromUrl(url);
      }
    });

    btnDownloadAll.addEventListener('click', () => {
      downloadAllAsZip();
    });

    btnReset.addEventListener('click', () => {
      switchView('view-upload');
      teardownCompares();
      blobUrls.forEach(u => URL.revokeObjectURL(u));
      blobUrls = [];
      results = [];
      resultList.innerHTML = '';
      urlInput.value = '';
      clearLog();
      setStatus('ready', 'idle');
    });

  </script>
</body>
</html>
