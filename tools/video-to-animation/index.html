  <script>
    const { formatBytes, showToast, switchView, setupDropzone } = window.STCommon;

    lucide.createIcons();
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    // ---- Theme ---------------------------------------------------------
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const root = document.documentElement;
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const current = root.getAttribute('data-theme') || (systemDark ? 'dark' : 'light');
      const next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('st-theme', next); } catch (e) { }
    });

    // ---- Console -------------------------------------------------------
    // FFmpeg genuinely goes through stages; the log says which one is running
    // instead of spinning a wheel that means nothing.
    const consoleBox = document.getElementById('console');
    const logStream = document.getElementById('log-stream');
    const statusLed = document.getElementById('status-led');
    const statusText = document.getElementById('status-text');

    function logLine(text, cls) {
      const el = document.createElement('div');
      el.className = 'cl' + (cls ? ' ' + cls : '');
      el.textContent = text;
      logStream.appendChild(el);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }
    function clearLog() { logStream.innerHTML = ''; }

    // state: '' (working, pulsing), 'idle', 'err'
    function setStatus(text, state) {
      statusText.textContent = text;
      statusLed.className = 'st-led' + (state ? ' ' + state : '');
    }

    // ---- Gauge ---------------------------------------------------------
    function beatMs() {
      const bpm = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue('--bpm')
      );
      return 60000 / (bpm > 0 ? bpm : 60);
    }
    function animateCount(el, to, render) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        el.textContent = render(to);
        return;
      }
      const duration = beatMs();
      const start = performance.now();
      function frame(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = render(to * eased);
        if (t < 1) requestAnimationFrame(frame);
        else el.textContent = render(to);
      }
      requestAnimationFrame(frame);
    }

    const resultSavings = document.getElementById('result-savings');
    const srcSizeEl = document.getElementById('src-size');
    const outSizeEl = document.getElementById('out-size');
    const barAfter = document.getElementById('bar-after');
    const barBefore = document.querySelector('.bar i.before');

    const resultUnit = document.getElementById('result-unit');

    // A video codec almost always beats an animation format on bytes, so a
    // "saved %" headline here would report a loss on a perfectly good result.
    // What actually matters when you are about to share an animation is how
    // big it ended up, so that is the number that gets the big type. The two
    // bars still show the honest comparison underneath.
    function renderGauge(sourceBytes, outputBytes) {
      const parts = formatBytes(outputBytes).split(' ');
      const value = parseFloat(parts[0]) || 0;
      resultUnit.textContent = parts[1] || 'B';
      const decimals = value < 100 ? 1 : 0;
      animateCount(resultSavings, value, v => v.toFixed(decimals));

      srcSizeEl.textContent = formatBytes(sourceBytes);
      outSizeEl.textContent = formatBytes(outputBytes);

      // Both bars are scaled against the larger of the two, so "the animation
      // came out bigger" is visible instead of both bars pinning at full.
      const max = Math.max(sourceBytes, outputBytes, 1);
      const srcPct = Math.max(1, Math.round((sourceBytes / max) * 100));
      const outPct = Math.max(1, Math.round((outputBytes / max) * 100));
      barBefore.style.width = srcPct + '%';
      barAfter.style.width = '0%';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        barAfter.style.width = outPct + '%';
      }));
    }

    // Setup format selection
    const formatBtns = document.querySelectorAll('.format-btn');
    let selectedFormat = 'webp';

    const LOSSY_FORMATS = new Set(['webp']);

    const formatExtensions = {
      'apng': 'apng',
      'webp': 'webp',
      'webp-lossless': 'webp',
      'gif': 'gif'
    };

    const formatMimeTypes = {
      'apng': 'image/apng',
      'webp': 'image/webp',
      'webp-lossless': 'image/webp',
      'gif': 'image/gif'
    };

    const formatLabels = {
      'apng': 'APNG',
      'webp': 'WEBP',
      'webp-lossless': 'WEBP (可逆)',
      'gif': 'GIF'
    };

    formatBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        formatBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedFormat = btn.dataset.format;
        applyQualityState();
      });
    });

    // Elements
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');

    const loadingMsg = document.getElementById('loading-msg');
    const loadingSubmsg = document.getElementById('loading-submsg');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    
    const resultPreview = document.getElementById('result-preview');
    const resultFormat = document.getElementById('result-format');
    const resultSize = document.getElementById('result-size');
    const btnDownload = document.getElementById('btn-download');
    const btnShare = document.getElementById('btn-share');
    const btnReset = document.getElementById('btn-reset');
    
    const optWidth = document.getElementById('opt-width');
    const optFps = document.getElementById('opt-fps');
    const optQuality = document.getElementById('opt-quality');
    const qualityVal = document.getElementById('quality-val');
    const qualityRow = document.getElementById('quality-row');

    optQuality.addEventListener('input', (e) => {
      qualityVal.textContent = e.target.value + '%';
    });

    function applyQualityState() {
      const disabled = !LOSSY_FORMATS.has(selectedFormat);
      optQuality.disabled = disabled;
      qualityRow.classList.toggle('quality-disabled', disabled);
    }
    applyQualityState();

    // ffmpeg.wasm shares the ~2 GB WASM heap with the decoded frame buffer,
    // so a 500 MB source typically OOMs partway through. 200 MB is a more
    // honest ceiling for a browser-only encoder.
    const MAX_FILE_SIZE = 200 * 1024 * 1024; // 200MB

    let ffmpeg = null;
    let isProcessing = false;
    let resultBlobUrl = null;
    let resultFilename = 'output.apng';
    let conversionStarted = false;
    let ffmpegLogBuffer = [];

    function buildFFmpegError(exitCode, hint) {
      const tail = ffmpegLogBuffer.slice(-15).join('\n');
      const lower = tail.toLowerCase();
      let summary = hint;
      if (!summary) {
        if (/unknown encoder|encoder .* not found|encoder not found/.test(lower)) {
          summary = 'このフォーマット用のエンコーダが現在のビルドに含まれていません';
        } else {
          const m = tail.match(/error[^\n]*/i);
          summary = m ? m[0] : `FFmpeg がコード ${exitCode} で終了しました`;
        }
      }
      console.error('[ffmpeg log tail]\n' + tail);
      return new Error(summary);
    }

    async function initFFmpeg() {
      if (ffmpeg) return ffmpeg;

      const { FFmpeg } = FFmpegWASM;
      const { toBlobURL } = FFmpegUtil;
      ffmpeg = new FFmpeg();

      ffmpeg.on('log', ({ message }) => {
        console.log('[ffmpeg]', message);
        ffmpegLogBuffer.push(message);
        if (ffmpegLogBuffer.length > 30) ffmpegLogBuffer.shift();
      });

      ffmpeg.on('progress', ({ progress }) => {
        if (!conversionStarted) return;
        const pct = Math.max(0, Math.min(100, Math.round(progress * 100)));
        progressBar.style.width = `${pct}%`;
        progressText.textContent = `${pct}%`;
      });

      // The caller already wrote the command line; don't clobber it here.
      loadingSubmsg.textContent = 'FFmpeg エンジンを読み込んでいます…';

      // Use ESM build of core because @ffmpeg/ffmpeg@0.12.10's worker is a module worker
      // and falls back to `await import(coreURL)`, which requires a default export.
      const coreBase = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';
      const ffmpegBase = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd';

      console.log('[init] fetching worker chunk');
      const classWorkerURL = await toBlobURL(`${ffmpegBase}/814.ffmpeg.js`, 'text/javascript');
      console.log('[init] fetching core js (ESM)');
      const coreURL = await toBlobURL(`${coreBase}/ffmpeg-core.js`, 'text/javascript');
      console.log('[init] fetching core wasm');
      const wasmURL = await toBlobURL(`${coreBase}/ffmpeg-core.wasm`, 'application/wasm');
      console.log('[init] calling ffmpeg.load');

      await ffmpeg.load({ classWorkerURL, coreURL, wasmURL });
      console.log('[init] ffmpeg loaded');

      return ffmpeg;
    }

    async function processVideo(file) {
      if (isProcessing) return;

      if (file.size > MAX_FILE_SIZE) {
        showToast(`ファイルが大きすぎます(${formatBytes(file.size)} / 上限 ${formatBytes(MAX_FILE_SIZE)})`, 'error');
        return;
      }

      isProcessing = true;
      conversionStarted = false;

      switchView('view-loading');
      clearLog();
      setStatus('working');
      loadingMsg.textContent =
        `encode ${file.name} --to ${selectedFormat}`
        + (optFps.value !== 'original' ? ` --fps ${optFps.value}` : '')
        + (optWidth.value !== 'original' ? ` --width ${optWidth.value}` : '');
      loadingSubmsg.textContent = 'FFmpeg エンジンを読み込んでいます…';
      progressBar.style.width = '0%';
      progressText.textContent = '0%';

      if (resultBlobUrl) {
        URL.revokeObjectURL(resultBlobUrl);
        resultBlobUrl = null;
      }

      let ff = null;
      let inputName = null;
      let outputName = null;

      try {
        ff = await initFFmpeg();
        const { fetchFile } = FFmpegUtil;

        logLine('> ffmpeg ready');
        loadingSubmsg.textContent = `reading  ${formatBytes(file.size)}`;

        const dot = file.name.lastIndexOf('.');
        const inExt = dot >= 0 ? file.name.slice(dot) : '.mp4';
        const baseName = dot >= 0 ? file.name.slice(0, dot) : file.name;
        const outExt = formatExtensions[selectedFormat];
        inputName = 'input' + inExt;
        outputName = 'output.' + outExt;

        await ff.writeFile(inputName, await fetchFile(file));

        const width = optWidth.value;
        const fps = optFps.value;

        const args = ['-i', inputName];
        const vfFilters = [];

        if (fps !== 'original') {
          vfFilters.push(`fps=${fps}`);
        }

        if (width !== 'original') {
          // -2 keeps aspect ratio while rounding to an even number.
          vfFilters.push(`scale=${width}:-2:flags=lanczos`);
        }

        logLine(`> input loaded  ${formatBytes(file.size)}`);
        loadingSubmsg.textContent = 'encoding — ブラウザが重くなることがあります';
        conversionStarted = true;

        if (selectedFormat === 'gif') {
          // GIF は 256 色パレットなので、全フレームから最適パレットを作る
          // palettegen → paletteuse の 2 パスを 1 回の実行で済ませる。
          // vfFilters が空になることもあるため、前段のチェーンは条件付きで連結する。
          const preChain = vfFilters.length > 0 ? vfFilters.join(',') + ',' : '';
          args.push('-filter_complex',
            `[0:v]${preChain}split[s0][s1];` +
            `[s0]palettegen=stats_mode=full[p];` +
            `[s1][p]paletteuse=dither=sierra2_4a:diff_mode=rectangle`);
        } else if (vfFilters.length > 0) {
          args.push('-vf', vfFilters.join(','));
        }

        if (selectedFormat === 'apng') {
          args.push('-plays', '0', outputName);
        } else if (selectedFormat === 'gif') {
          args.push('-loop', '0', '-an', '-fps_mode', 'passthrough', outputName);
        } else if (selectedFormat === 'webp') {
          const webpQuality = String(parseInt(optQuality.value, 10) || 80);
          args.push('-c:v', 'libwebp', '-lossless', '0', '-quality', webpQuality, '-loop', '0', '-an', '-fps_mode', 'passthrough', outputName);
        } else if (selectedFormat === 'webp-lossless') {
          args.push('-c:v', 'libwebp', '-lossless', '1', '-compression_level', '6', '-loop', '0', '-an', '-fps_mode', 'passthrough', outputName);
        }

        ffmpegLogBuffer = [];
        const exitCode = await ff.exec(args);
        conversionStarted = false;
        if (exitCode !== 0) throw buildFFmpegError(exitCode);

        loadingSubmsg.textContent = 'muxing output …';
        const data = await ff.readFile(outputName);

        const mimeType = formatMimeTypes[selectedFormat];
        const blob = new Blob([data.buffer], { type: mimeType });
        resultBlobUrl = URL.createObjectURL(blob);
        resultFilename = baseName + '.' + outExt;

        logLine(
          `✓ ${resultFilename}  ${formatBytes(file.size)} → ${formatBytes(blob.size)}`,
          'ok'
        );

        resultPreview.src = resultBlobUrl;
        resultFormat.textContent = formatLabels[selectedFormat];
        resultSize.textContent = formatBytes(blob.size);
        renderGauge(file.size, blob.size);
        setStatus('done', 'idle');

        switchView('view-result');
        showToast('変換が完了しました！');

      } catch (err) {
        console.error('Conversion Error:', err);
        const detail = err && err.message ? err.message : String(err);
        logLine('✗ ' + detail, 'err');
        setStatus('failed', 'err');
        showToast(`エラー: ${detail.slice(0, 80)}`, 'error');
        switchView('view-upload');
      } finally {
        conversionStarted = false;
        isProcessing = false;
        if (ff) {
          if (inputName) {
            try { await ff.deleteFile(inputName); } catch (_) {}
          }
          if (outputName) {
            try { await ff.deleteFile(outputName); } catch (_) {}
          }
        }
      }
    }

    // Event Listeners
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) processVideo(file);
      fileInput.value = '';
    });

    setupDropzone({
      dropzone,
      fileInput,
      onFiles: (files) => {
        const file = files[0];
        if (file && file.type.startsWith('video/')) {
          processVideo(file);
        } else {
          showToast('動画ファイル(MP4等)を選択してください。', 'error');
        }
      },
    });

    btnDownload.addEventListener('click', () => {
      if (!resultBlobUrl) return;
      const a = document.createElement('a');
      a.href = resultBlobUrl;
      a.download = resultFilename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      if (window.STShare) STShare.celebrate();
    });

    if (navigator.share) {
      btnShare.classList.remove('hidden');
      btnShare.addEventListener('click', async () => {
        if (!resultBlobUrl) return;

        // URL/テキスト共有用のフォールバックデータ（Outlook や LINE などファイルを
        // 受け付けないアプリ向け）。クエリ・ハッシュを除いたツールページのURLを使う。
        const fallbackData = {
          title: '動画アニメーション',
          text: '動画から作るアニメーション変換ツール',
          url: location.origin + location.pathname,
        };

        try {
          const response = await fetch(resultBlobUrl);
          const originalBlob = await response.blob();

          let file;
          if (selectedFormat === 'apng') {
            // Chromeの内部仕様で image/apng はシェアを拒否され空ファイルになるため、完全に image/png のBlobとして再生成する
            const cleanBlob = new Blob([originalBlob], { type: 'image/png' });
            const shareFilename = resultFilename.replace(/\.apng$/i, '.png');
            file = new File([cleanBlob], shareFilename, { type: 'image/png' });
          } else {
            // WebPなど他の形式はそのままFile化する（ArrayBuffer経由だと失敗するため）
            file = new File([originalBlob], resultFilename, { type: originalBlob.type });
          }

          // まずファイルそのものの共有を試す（Copilot など画像対応アプリ向け）
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({ title: '動画アニメーション', files: [file] });
              return;
            } catch (err) {
              if (err.name === 'AbortError') return; // ユーザーがキャンセル
              // 共有先アプリがファイル形式を拒否した場合などは URL 共有にフォールバック
              console.warn('File share failed, falling back to URL share:', err);
            }
          }

          // フォールバック: ツールのURL＋テキストを共有する
          await navigator.share(fallbackData);
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.error('Share error:', err);
            showToast('共有に失敗しました', 'error');
          }
        }
      });
    }

    btnReset.addEventListener('click', () => {
      switchView('view-upload');
      if (resultBlobUrl) {
        URL.revokeObjectURL(resultBlobUrl);
        resultBlobUrl = null;
      }
      resultPreview.removeAttribute('src');
      clearLog();
      setStatus('ready', 'idle');
    });

    /* The mark beside the trail is this page's own favicon, read from
       the <link>, so the bar and the browser tab cannot drift apart. */
    (function () {
      var icon = document.querySelector('link[rel="icon"]');
      var mark = document.querySelector('.crumb-mark');
      if (icon && mark) mark.style.backgroundImage = 'url("' + icon.href + '")';
    })();
  /* The way back up follows the reader: it appears only once there is
     something to scroll back over. */
  (function () {
    var btn = document.getElementById('scroll-top-btn');
    if (!btn) return;
    window.addEventListener('scroll', function () {
      btn.classList.toggle('visible', window.scrollY > 300);
    }, { passive: true });
    btn.addEventListener('click', function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    });
  })();
  </script>
</body>
</html>
