<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to Image は PDF Studio になりました | ST TOOLS</title>
  <meta name="description" content="PDF to Image は PDF Studio に統合されました。PDFのPNG・WebP・AVIF変換に加えて、回転・結合・分割・面付け・墨消しにも対応しています。">
  <link rel="canonical" href="https://tk.st/tools/pdf-studio/">
  <meta http-equiv="refresh" content="0; url=/tools/pdf-studio/">
  <style>
    /* A redirect stub still gets rendered for a frame, so it follows the
       reader's colour scheme rather than flashing white at a dark-mode user. */
    :root { color-scheme: light dark; --bg: #F7F8F9; --ink: #15191D; --accent: #4F46E5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0F1317; --ink: #E5E9ED; --accent: #818CF8; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
      text-align: center;
      padding: 24px;
      line-height: 1.7;
    }
    h1 { font-size: 20px; letter-spacing: -0.02em; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>PDF to Image は PDF Studio になりました</h1>
    <p>画像変換の機能はそのままに、回転・結合・分割・面付け・墨消しも使えます。</p>
    <p><a href="/tools/pdf-studio/">https://tk.st/tools/pdf-studio/ へ移動する</a></p>
  </main>
  <script>location.replace('/tools/pdf-studio/');</script>
</body>
</html>
