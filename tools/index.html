  <!-- Stamp the remembered theme before first paint. The tools write the same
       key, so a choice made there carries over to the index. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('st-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* private mode — fall back to the system setting */ }
    })();

  <style>
    /* ------------------------------------------------------------------
       ST TOOLS index — the Print Shop. This is the one page in the set
       that is read rather than operated, so it is allowed to be loud: ink
       rules, hard shadows, uppercase mono. The tools themselves stay quiet.

       data/tools-ui.css is linked for its tokens only — <html> deliberately
       has no .st-theme, so none of the Instrument chrome applies here.
       ------------------------------------------------------------------ */

    :root {
      --paper: #F1EFE9;
      --paper-2: #FFFFFF;
      --ink: #17160F;
      --ink-2: #5B594E;
      --ink-3: #8B887B;
      --rule: #17160F;
      --hair: #D6D2C6;
      --shadow-ink: rgba(23, 22, 15, 0.9);
      --bpm: 60;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #131208;
        --paper-2: #1C1B12;
        --ink: #EFEBDD;
        --ink-2: #A8A493;
        --ink-3: #7A776A;
        --rule: #EFEBDD;
        --hair: #35332A;
        --shadow-ink: rgba(239, 235, 221, 0.55);
      }
    }
    :root[data-theme="dark"] {
      --paper: #131208;
      --paper-2: #1C1B12;
      --ink: #EFEBDD;
      --ink-2: #A8A493;
      --ink-3: #7A776A;
      --rule: #EFEBDD;
      --hair: #35332A;
      --shadow-ink: rgba(239, 235, 221, 0.55);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    body { display: flex; flex-direction: column; min-height: 100vh; }

    .hidden { display: none !important; }

    .mono {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
    }
    .lbl {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* ===== masthead ===== */
    .masthead { border-bottom: 2px solid var(--rule); }
    .mast-in { max-width: 1120px; margin: 0 auto; padding: 0 22px; }

    .mast-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 0;
      border-bottom: 1px solid var(--hair);
    }
    .mast-back {
      color: var(--ink-2);
      text-decoration: none;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      white-space: nowrap;
      transition: color 120ms ease;
    }
    .mast-back:hover { color: var(--ink); }
    .mast-issue { margin-left: auto; color: var(--ink-2); }

    .icon-btn {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--rule);
      background: var(--paper-2);
      color: var(--ink);
      cursor: pointer;
      flex: none;
      border-radius: 2px;
      transition: transform 60ms ease;
    }
    .icon-btn:active { transform: translateY(2px); }
    .icon-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    #theme-toggle .to-dark { display: inline-flex; }
    #theme-toggle .to-light { display: none; }
    :root[data-theme="dark"] #theme-toggle .to-dark { display: none; }
    :root[data-theme="dark"] #theme-toggle .to-light { display: inline-flex; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) #theme-toggle .to-dark { display: none; }
      :root:not([data-theme="light"]) #theme-toggle .to-light { display: inline-flex; }
    }

    .mast-main {
      display: grid;
      grid-template-columns: minmax(0, auto) minmax(0, 1fr);
      gap: 8px 40px;
      align-items: end;
      padding: 26px 0 22px;
    }
    @media (max-width: 780px) { .mast-main { grid-template-columns: 1fr; gap: 14px; } }

    .mast-title {
      font-family: "Archivo", "Inter", sans-serif;
      font-weight: 800;
      font-size: clamp(52px, 12vw, 116px);
      line-height: 0.82;
      letter-spacing: -0.055em;
      text-transform: uppercase;
      margin: 0;
    }
    .mast-side { display: flex; flex-direction: column; gap: 14px; padding-bottom: 6px; }
    .mast-lede {
      margin: 0;
      font-size: 14.5px;
      color: var(--ink-2);
      max-width: 38ch;
      /* Japanese has no spaces to break on, so without this the last clause
         happily leaves a one-character orphan on its own line. */
      text-wrap: pretty;
      line-break: strict;
    }

    .mast-controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .search-wrap { position: relative; flex: 1; min-width: 190px; }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
    #search-input {
      width: 100%;
      border: 1.5px solid var(--rule);
      background: var(--paper-2);
      color: var(--ink);
      border-radius: 2px;
      padding: 8px 12px 8px 32px;
      font-family: "Inter", sans-serif;
      font-size: 13.5px;
    }
    #search-input::placeholder { color: var(--ink-3); }
    #search-input:focus { outline: none; box-shadow: 3px 3px 0 var(--shadow-ink); }

    #sort-select {
      border: 1.5px solid var(--rule);
      background: var(--paper-2);
      color: var(--ink);
      border-radius: 2px;
      padding: 8px 28px 8px 11px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, currentColor 50%),
        linear-gradient(135deg, currentColor 50%, transparent 50%);
      background-position: right 13px center, right 9px center;
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat;
    }
    #sort-select:focus { outline: none; box-shadow: 3px 3px 0 var(--shadow-ink); }

    /* A printer's rule: the page is set on a press, not a canvas. */
    .press-rule {
      height: 7px;
      background-image: repeating-linear-gradient(90deg, var(--rule) 0 2px, transparent 2px 9px);
    }

    /* ===== main ===== */
    main { flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding: 26px 22px 64px; }

    #message-bar {
      border: 1.5px solid var(--rule);
      background: var(--paper-2);
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 20px;
      box-shadow: 3px 3px 0 var(--shadow-ink);
    }
    #message-bar.msg-error { border-color: #C0392B; color: #C0392B; box-shadow: 3px 3px 0 #C0392B; }

    #category-filter { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 22px; }
    .filter-chip {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 13px;
      border: 1.5px solid var(--rule);
      border-radius: 2px;
      background: var(--paper-2);
      color: var(--ink);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 60ms ease;
    }
    .filter-chip:active { transform: translateY(2px); }
    .filter-chip.active { background: var(--ink); color: var(--paper); }
    .filter-chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    #tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(288px, 1fr));
      gap: 26px 22px;
    }

    /* ===== card ===== */
    .tool-card {
      --card-accent: var(--ink);
      display: flex;
      flex-direction: column;
      border: 2px solid var(--rule);
      border-radius: 2px;
      background: var(--paper-2);
      color: inherit;
      text-decoration: none;
      overflow: hidden;
      box-shadow: 5px 5px 0 var(--shadow-ink);
      transition: transform 130ms ease, box-shadow 130ms ease;
    }
    .tool-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 var(--card-accent);
    }
    .tool-card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--card-accent); }
    .tool-card:focus-visible { outline: 2px solid var(--card-accent); outline-offset: 3px; }

    .tool-img-wrap {
      position: relative;
      aspect-ratio: 1200 / 630;
      background: var(--paper);
      border-bottom: 2px solid var(--rule);
      overflow: hidden;
    }
    .tool-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tool-img-fallback {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--ink-3);
      font-size: 11px;
    }
    .badge-new {
      position: absolute;
      top: 0;
      left: 0;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      padding: 3px 9px;
      background: var(--card-accent);
      color: #fff;
      border-right: 2px solid var(--rule);
      border-bottom: 2px solid var(--rule);
    }

    .tool-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 9px; flex: 1; }

    .category-badge {
      display: inline-block;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--card-accent);
      border-bottom: 2px solid var(--card-accent);
      padding-bottom: 2px;
      align-self: flex-start;
    }
    .tool-title {
      font-family: "Archivo", "Inter", sans-serif;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.02em;
      margin: 0;
      color: var(--ink);
    }
    .tool-desc { font-size: 13px; line-height: 1.75; color: var(--ink-2); margin: 0; flex: 1; }
    .tool-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag-chip {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--ink-2);
      border: 1px solid var(--hair);
      border-radius: 2px;
      padding: 1px 6px;
    }

    /* ===== skeleton ===== */
    .skeleton {
      background: linear-gradient(90deg, var(--hair) 25%, var(--paper) 50%, var(--hair) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .sk-line { height: 12px; }
    .sk-line.w25 { width: 25%; }
    .sk-line.w75 { width: 75%; }
    .sk-line.w100 { width: 100%; }
    .sk-line.w60 { width: 60%; }

    /* ===== empty ===== */
    #empty-state { text-align: center; padding: 72px 0; }
    #empty-state .box {
      width: 56px;
      height: 56px;
      border: 2px solid var(--rule);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 4px 4px 0 var(--shadow-ink);
    }
    #empty-state p { margin: 0; font-size: 13.5px; color: var(--ink-2); }

    /* ===== footer ===== */
    footer { margin-top: auto; border-top: 2px solid var(--rule); }
    .foot-in {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      color: var(--ink-2);
    }
    .foot-in a { color: inherit; text-decoration: none; }
    .foot-in a:hover { color: var(--ink); }
    .foot-copy { margin-left: auto; }
    @media (max-width: 560px) { .foot-copy { display: none; } }

    /* ===== scroll to top ===== */
    #scroll-top-btn {
      position: fixed;
      bottom: 22px;
      right: 22px;
      width: 38px;
      height: 38px;
      border: 2px solid var(--rule);
      border-radius: 2px;
      background: var(--paper-2);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--shadow-ink);
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 200ms ease, transform 200ms ease;
      z-index: 40;
    }
    #scroll-top-btn.visible { opacity: 1; pointer-events: auto; transform: none; }
    #scroll-top-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow-ink); }

    /* The whole site breathes on one variable; the entrance is no exception. */
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink);
      display: inline-block;
      animation: hub-pulse calc(60s / var(--bpm)) ease-in-out infinite;
    }
    @keyframes hub-pulse { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }

    .fade-up { animation: fadeUp 320ms ease both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

  <script>
    new DonationWidget({

  <script>
    /* Theme: system by default, explicit choice remembered — the same key the
       tools use, so the choice carries across the whole site. */
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const root = document.documentElement;
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const current = root.getAttribute('data-theme') || (systemDark ? 'dark' : 'light');
      const next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('st-theme', next); } catch (e) { }
    });
  </script>

  <script>
    let records = [];
    let newIds = new Set();
    let activeCategory = 'all';

    const grid = document.getElementById('tool-grid');
    const emptyState = document.getElementById('empty-state');
    const countEl = document.getElementById('tool-count');
    const messageBar = document.getElementById('message-bar');
    const searchInput = document.getElementById('search-input');
    const sortSelect = document.getElementById('sort-select');
    const categoryFilter = document.getElementById('category-filter');
    const scrollTopBtn = document.getElementById('scroll-top-btn');

    const escapeHTML = (str) => String(str).replace(/[&<>"']/g, m =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])
    );

    const SAME_ORIGIN_HOSTS = new Set(['tk.st', 'www.tk.st', location.hostname]);
    const safeUrl = (raw) => {
      if (!raw || raw === '#') return null;
      try {
        const u = new URL(raw, location.href);
        return (u.protocol === 'http:' || u.protocol === 'https:') ? u : null;
      } catch {
        return null;
      }
    };

    const debounce = (fn, ms) => {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), ms);
      };
    };

    function showMessage(text, type) {
      if (!text) { messageBar.classList.add('hidden'); messageBar.textContent = ''; return; }
      messageBar.textContent = text;
      messageBar.className = type === 'error' ? 'msg-error' : '';
    }

    // Each card carries the accent of the tool it opens, so the index and the
    // tool read as one object rather than two unrelated pages.
    const TOOL_ACCENTS = {
      'nextgen-image':      '#0E9F6E',
      'light-svg':          '#0284C7',
      'image-to-animation': '#7C3AED',
      'video-to-animation': '#E11D48',
      'pdf-studio':         '#4F46E5',
      'csv-json':           '#0D9488',
    };
    function accentFor(url) {
      if (!url) return null;
      const slug = url.pathname.replace(/\/+$/, '').split('/').pop();
      return TOOL_ACCENTS[slug] || null;
    }

    function showSkeletons(count = 6) {
      grid.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const sk = document.createElement('div');
        sk.className = 'tool-card';
        sk.innerHTML = `
          <div class="skeleton" style="aspect-ratio:1200/630"></div>
          <div class="tool-body">
            <div class="skeleton sk-line w25"></div>
            <div class="skeleton sk-line w75"></div>
            <div class="skeleton sk-line w100"></div>
            <div class="skeleton sk-line w60"></div>
          </div>
        `;
        grid.appendChild(sk);
      }
    }

    function renderCategoryChips() {
      const cats = [...new Set(records.map(r => r.category).filter(Boolean))].sort();
      if (!cats.length) return;
      categoryFilter.classList.add('visible');
      categoryFilter.innerHTML = '';
      ['all', ...cats].forEach(cat => {
        const btn = document.createElement('button');
        const isActive = cat === activeCategory;
        btn.className = 'filter-chip' + (isActive ? ' active' : '');
        btn.textContent = cat === 'all' ? 'All' : cat.charAt(0).toUpperCase() + cat.slice(1);
        btn.setAttribute('aria-pressed', String(isActive));
        btn.addEventListener('click', () => {
          activeCategory = cat;
          renderCategoryChips();
          updateView();
        });
        categoryFilter.appendChild(btn);
      });
    }

    const IMAGE_OFF_SVG = `
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           class="opacity-40" aria-hidden="true">
        <line x1="2" y1="2" x2="22" y2="22"/>
        <path d="M10.41 10.41a2 2 0 1 1-2.83-2.83"/>
        <line x1="13.5" y1="13.5" x2="6" y2="21"/>
        <line x1="18" y1="12" x2="21" y2="15"/>
        <path d="M3.59 3.59A1.99 1.99 0 0 0 3 5v14a2 2 0 0 0 2 2h14c.55 0 1.05-.22 1.41-.59"/>
        <path d="M21 15V5a2 2 0 0 0-2-2H9"/>
      </svg>`;

    function createCard(record) {
      const url = safeUrl(record.url);
      const imgURL = safeUrl(record.imageUrl);
      const card = document.createElement('a');
      card.className = 'tool-card fade-up';
      card.href = url ? url.href : '#';
      if (url && !SAME_ORIGIN_HOSTS.has(url.hostname)) {
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
      }

      const title = escapeHTML(record.title);
      const desc = escapeHTML(record.description || '');
      const category = record.category ? escapeHTML(record.category) : '';
      const tags = (record.tags || []).map(t => escapeHTML(t));
      const isNew = newIds.has(record.id);

      const accent = accentFor(url);
      if (accent) card.style.setProperty('--card-accent', accent);

      card.innerHTML = `
        <div class="tool-img-wrap">
          ${imgURL ? `<img src="${imgURL.href}" alt="${title}" loading="lazy" class="tool-img">` : ''}
          <div class="tool-img-fallback"${imgURL ? '' : ' style="display:flex"'}>
            ${IMAGE_OFF_SVG}
            <span>No preview</span>
          </div>
          ${isNew ? `<span class="badge-new">New</span>` : ''}
        </div>
        <div class="tool-body">
          ${category ? `<span class="category-badge">${category}</span>` : ''}
          <h3 class="tool-title">${title}</h3>
          <p class="tool-desc">${desc}</p>
          ${tags.length ? `
            <div class="tool-tags">
              ${tags.map(t => `<span class="tag-chip">${t}</span>`).join('')}
            </div>` : ''}
        </div>
      `;

      const img = card.querySelector('img.tool-img');
      if (img) {
        const fallback = card.querySelector('.tool-img-fallback');
        img.addEventListener('error', () => {
          img.style.display = 'none';
          if (fallback) fallback.style.display = 'flex';
        });
      }

      return card;
    }

    function updateView() {
      const term = searchInput.value.toLowerCase();
      const sortType = sortSelect.value;

      let filtered = records.filter(r => {
        const matchSearch = `${r.title} ${r.description || ''} ${r.category || ''} ${(r.tags || []).join(' ')}`.toLowerCase().includes(term);
        const matchCat = activeCategory === 'all' || r.category === activeCategory;
        return matchSearch && matchCat;
      });

      filtered.sort((a, b) => {
        if (sortType === 'title') return a.title.localeCompare(b.title, 'ja');
        if (sortType === 'oldest') return a.id - b.id;
        return b.id - a.id;
      });

      grid.innerHTML = '';
      filtered.forEach((record, i) => {
        const card = createCard(record);
        card.style.animationDelay = `${i * 40}ms`;
        grid.appendChild(card);
      });

      countEl.textContent = filtered.length;
      emptyState.classList.toggle('hidden', filtered.length > 0);
    }

    function updateItemListSchema(tools) {
      const script = document.querySelector('script[type="application/ld+json"]');
      if (!script) return;
      try {
        const data = JSON.parse(script.textContent);
        const list = data['@graph'].find(n => n['@type'] === 'ItemList');
        if (!list) return;
        list.itemListElement = tools
          .map(t => ({ tool: t, url: safeUrl(t.url) }))
          .filter(x => x.url)
          .map((x, i) => ({ '@type': 'ListItem', 'position': i + 1, 'url': x.url.href }));
        script.textContent = JSON.stringify(data);
      } catch (e) {
        console.warn('Failed to update JSON-LD ItemList:', e);
      }
    }

    const FALLBACK_RECORDS = [
      {
        id: 1,
        title: "CSV ↔ JSON 相互変換ツール",
        url: "https://tk.st/tools/csv-json/",
        imageUrl: "https://tk.st/images/ogp/csv-json-ogp.png",
        category: "converter",
        description: "CSVファイルとJSONファイルを相互変換。Excelからのコピーペーストにも対応しています。",
        tags: ["CSV", "JSON"]
      }
    ];

    async function loadTools() {
      showSkeletons(6);
      let usedFallback = false;
      try {
        const res = await fetch('/data/tools.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        records = await res.json();
      } catch (e) {
        console.warn('Failed to load tools.json, using fallback:', e);
        records = FALLBACK_RECORDS;
        usedFallback = true;
      } finally {
        if (usedFallback) {
          showMessage('最新のツール一覧を取得できなかったため、サンプルを表示しています。', 'info');
        }
        const sorted = [...records].sort((a, b) => b.id - a.id);
        newIds = new Set(sorted.slice(0, 2).map(r => r.id));
        renderCategoryChips();
        updateView();
        updateItemListSchema(records);
      }
    }

    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('visible', window.scrollY > 300);
    });
    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    searchInput.addEventListener('input', debounce(updateView, 150));
    sortSelect.addEventListener('change', updateView);
    lucide.createIcons();

    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('q');
    if (initialQuery) searchInput.value = initialQuery;

    loadTools();

    document.getElementById('currentYear').textContent = new Date().getFullYear();
  </script>
</body>
</html>
