       key, so a choice made there carries over to the index. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('st-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* private mode — fall back to the system setting */ }
    })();

  <style>
    /* ------------------------------------------------------------------
       SAFE TOOLS index — the shelf the instruments sit on.

       This page wears the same chrome as the tools it lists: <html> carries
       .st-theme, so the app bar, toolbar, footer, scroll-top button, tokens
       and dark palette all come from data/tools-ui.css. Only what is unique
       to a *list* of tools is written here — the shelf head, the filter
       chips and the cards. A card borrows the accent of its category, so
       the index card, its badge and the tool page it opens agree on colour.
       ------------------------------------------------------------------ */

    /* The index shows a grid rather than a single instrument, so its shell
       is wider than a tool's. Every other measurement stays theirs. */
    .st-theme { --shell: 1080px; }
    .st-theme main { max-width: var(--shell); padding: 22px 20px 56px; }

    /* Lucide stamps 24x24 onto every icon it injects, and this page carries
       no utility classes to override that, so the sizes live here. */
    .icon-btn svg,
    .search-wrap svg { width: 15px; height: 15px; }
    .fact svg { width: 13px; height: 13px; }
    #empty-state .box svg { width: 20px; height: 20px; }
    /* The mark is drawn, not loaded, so it needs its own box. */
    .crumb-mark { color: var(--ink); }
    .crumb-mark svg { display: block; width: 18px; height: 18px; }
    .tool-img-fallback svg { width: 26px; height: 26px; }

    /* ===== facts strip =====
       The page name sits at the end of the trail, the way it does on every
       tool, so the shelf keeps only what the bar cannot say: what the whole
       set promises. One line, above the controls.

       width:100% matters: body is a column flex container, and an auto-margin
       flex item without it shrinks to its content instead of filling the
       shell — the same shape main gets from tools-ui.css. */
    .shelf {
      width: 100%;
      max-width: var(--shell);
      margin: 0 auto;
      padding: 11px 20px 10px;
    }
    /* Three plain statements of fact, set as readouts rather than as a pitch. */
    .shelf-facts { display: flex; flex-wrap: wrap; gap: 7px; }
    .fact {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: var(--panel);
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--ink-2);
      white-space: nowrap;
    }
    .fact svg { color: var(--accent); flex: none; }

    /* ===== toolbar =====
       Search, categories and sort ride the tools' own sticky toolbar, so the
       controls stay put while the shelf scrolls past them. */
    .search-wrap { position: relative; flex: 1 1 190px; min-width: 0; display: flex; }
    .search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-3);
      pointer-events: none;
    }
    #search-input {
      width: 100%;
      border: 1px solid var(--rule);
      border-radius: var(--r-1);
      background: var(--panel);
      color: var(--ink);
      padding: 6px 11px 6px 32px;
      font-family: var(--font-ui);
      font-size: 13.5px;
      transition: border-color 120ms ease;
    }
    #search-input::placeholder { color: var(--ink-3); }
    #search-input:focus { outline: none; border-color: var(--accent); }

    #category-filter { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
    /* On a narrow screen the sort pairs up with the search on the first row
       and the chips take the second, which is one row fewer than letting them
       wrap in DOM order. */
    @media (max-width: 780px) {
      .tb-sort { order: 2; }
      #category-filter { order: 3; flex-basis: 100%; }
    }
    .filter-chip {
      --chip: var(--ink-3);
      --chip-soft: var(--panel-2);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 11px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink-2);
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 120ms ease, color 120ms ease, background 120ms ease;
    }
    /* A dot in the category's own colour, so the chips read as the same
       four-hue ramp the cards and the tools themselves use. */
    .filter-chip::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--chip);
      flex: none;
    }
    .filter-chip[data-cat="optimizer"] { --chip: var(--cat-optimizer); --chip-soft: var(--cat-optimizer-soft); }
    .filter-chip[data-cat="converter"] { --chip: var(--cat-converter); --chip-soft: var(--cat-converter-soft); }
    .filter-chip[data-cat="editor"]    { --chip: var(--cat-editor);    --chip-soft: var(--cat-editor-soft); }
    .filter-chip[data-cat="generator"] { --chip: var(--cat-generator); --chip-soft: var(--cat-generator-soft); }
    .filter-chip:hover:not(.active) { border-color: var(--rule-strong); color: var(--ink); }
    .filter-chip.active {
      background: var(--chip-soft);
      border-color: var(--chip);
      color: var(--chip);
      font-weight: 700;
    }
    .filter-chip[data-cat="all"].active { color: var(--ink); border-color: var(--rule-strong); }
    .filter-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ===== notice ===== */
    #message-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--rule);
      border-left: 3px solid var(--accent);
      border-radius: var(--r-1);
      background: var(--panel);
      padding: 9px 13px;
      margin-bottom: 16px;
      font-size: 12.5px;
      color: var(--ink-2);
    }

    /* ===== shelf ===== */
    #tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
      gap: 18px;
    }

    /* A card wears the colour of what its tool does, so the card, its badge
       and the tool page it opens all agree. */
    .tool-card[data-category="optimizer"] { --accent: var(--cat-optimizer); --accent-ink: var(--cat-optimizer-ink); --accent-soft: var(--cat-optimizer-soft); }
    .tool-card[data-category="converter"] { --accent: var(--cat-converter); --accent-ink: var(--cat-converter-ink); --accent-soft: var(--cat-converter-soft); }
    .tool-card[data-category="editor"]    { --accent: var(--cat-editor);    --accent-ink: var(--cat-editor-ink);    --accent-soft: var(--cat-editor-soft); }
    .tool-card[data-category="generator"] { --accent: var(--cat-generator); --accent-ink: var(--cat-generator-ink); --accent-soft: var(--cat-generator-soft); }

    .tool-card {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--rule);
      border-radius: var(--r-2);
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      overflow: hidden;
      transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }
    .tool-card:hover { border-color: var(--accent); box-shadow: var(--shadow-1); transform: translateY(-2px); }
    .tool-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .tool-img-wrap {
      position: relative;
      aspect-ratio: 1200 / 630;
      background: var(--panel-2);
      border-bottom: 1px solid var(--rule);
      overflow: hidden;
    }
    .tool-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 420ms cubic-bezier(.2, .7, .3, 1);
    }
    .tool-card:hover .tool-img { transform: scale(1.025); }
    .tool-img-fallback {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--ink-3);
      font-family: var(--font-mono);
      font-size: 10.5px;
    }
    .badge-new {
      position: absolute;
      top: 9px;
      left: 9px;
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
    }

    .tool-body { padding: 13px 14px 15px; display: flex; flex-direction: column; gap: 8px; flex: 1; }

    .category-badge {
      align-self: flex-start;
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .tool-title {
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: -0.015em;
      margin: 0;
      color: var(--ink);
    }
    /* Descriptions in tools.json run from one line to five; clamping keeps a
       row of cards the same height without trimming the source data. */
    .tool-desc {
      margin: 0;
      flex: 1;
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--ink-2);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tool-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag-chip {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-3);
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 1px 8px;
    }

    /* ===== skeleton ===== */
    .skeleton {
      background: linear-gradient(90deg, var(--panel-2) 25%, var(--rule) 50%, var(--panel-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 3px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .sk-line { height: 11px; }
    .sk-line.w25 { width: 25%; }
    .sk-line.w60 { width: 60%; }
    .sk-line.w75 { width: 75%; }
    .sk-line.w100 { width: 100%; }

    /* ===== empty ===== */
    #empty-state { text-align: center; padding: 64px 0; }
    #empty-state .box {
      width: 46px;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--rule);
      border-radius: var(--r-1);
      background: var(--panel);
      color: var(--ink-3);
      margin-bottom: 12px;
    }
    #empty-state p { margin: 0; font-size: 13px; color: var(--ink-3); }

    .fade-up { animation: fadeUp 300ms ease both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    /* On a phone the pills cost more height than they earn, so the same three
       facts are set as one quiet line under the lede. */
    @media (max-width: 560px) {
      .shelf { padding: 10px 20px 8px; }
      .st-theme main { padding-top: 14px; }
      .shelf-facts { gap: 4px 12px; }
      .fact { border: 0; background: none; padding: 0; font-size: 10px; }
      #tool-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>

  <script>
    /* Theme: system by default, explicit choice remembered — the same key the
       tools use, so the choice carries across the whole site. */
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const root = document.documentElement;
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const current = root.getAttribute('data-theme') || (systemDark ? 'dark' : 'light');
      const next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('st-theme', next); } catch (e) { }
    });
  /* The way back up follows the reader: it appears only once there is
     something to scroll back over. */
  (function () {
    var btn = document.getElementById('scroll-top-btn');
    if (!btn) return;
    window.addEventListener('scroll', function () {
      btn.classList.toggle('visible', window.scrollY > 300);
    }, { passive: true });
    btn.addEventListener('click', function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    });
  })();
  </script>

  <script>
    let records = [];
    let newIds = new Set();
    let activeCategory = 'all';
    let firstRender = true;

    const grid = document.getElementById('tool-grid');
    const emptyState = document.getElementById('empty-state');
    const countEl = document.getElementById('tool-count');
    const messageBar = document.getElementById('message-bar');
    const searchInput = document.getElementById('search-input');
    const sortSelect = document.getElementById('sort-select');
    const categoryFilter = document.getElementById('category-filter');


    const escapeHTML = (str) => String(str).replace(/[&<>"']/g, m =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])
    );

    const SAME_ORIGIN_HOSTS = new Set(['tk.st', 'www.tk.st', location.hostname]);
    const safeUrl = (raw) => {
      if (!raw || raw === '#') return null;
      try {
        const u = new URL(raw, location.href);
        return (u.protocol === 'http:' || u.protocol === 'https:') ? u : null;
      } catch {
        return null;
      }
    };

    const debounce = (fn, ms) => {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), ms);
      };
    };

    /* One caller: the fallback notice below. It never comes back down. */
    function showMessage(text) {
      messageBar.textContent = text;
      messageBar.classList.remove('hidden');
    }

    /* tools.json is edited by hand, so a record only earns a card once it has
       the three things a card cannot be drawn without: an id to sort by, a
       title to show and a URL that resolves. Anything short of that is dropped
       with a note in the console instead of taking the whole shelf down.

       This is the only place a record is inspected, so everything downstream is
       free to trust these fields: the URLs are resolved and the search text is
       built here rather than again on every keystroke. */
    function normalizeRecords(raw) {
      if (!Array.isArray(raw)) throw new Error('tools.json is not an array');
      return raw.reduce((keep, r) => {
        const url = safeUrl(r && r.url);
        const title = r && typeof r.title === 'string' ? r.title.trim() : '';
        const id = Number(r && r.id);
        if (!url || !title || !Number.isFinite(id)) {
          console.warn('Skipping malformed tool record:', r);
          return keep;
        }
        const imageUrl = safeUrl(r.imageUrl);
        keep.push({
          ...r, id, title,
          url: url.href,
          external: !SAME_ORIGIN_HOSTS.has(url.hostname),
          imageUrl: imageUrl ? imageUrl.href : '',
          haystack: `${title} ${r.description || ''} ${r.category || ''} ${(r.tags || []).join(' ')}`.toLowerCase()
        });
        return keep;
      }, []);
    }

    function showSkeletons(count = 6) {
      grid.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const sk = document.createElement('div');
        sk.className = 'tool-card';
        sk.innerHTML = `
          <div class="skeleton" style="aspect-ratio:1200/630"></div>
          <div class="tool-body">
            <div class="skeleton sk-line w25"></div>
            <div class="skeleton sk-line w75"></div>
            <div class="skeleton sk-line w100"></div>
            <div class="skeleton sk-line w60"></div>
          </div>
        `;
        grid.appendChild(sk);
      }
    }

    function renderCategoryChips() {
      const cats = [...new Set(records.map(r => r.category).filter(Boolean))].sort();
      if (!cats.length) return;
      categoryFilter.innerHTML = '';
      ['all', ...cats].forEach(cat => {
        const btn = document.createElement('button');
        const isActive = cat === activeCategory;
        btn.type = 'button';
        btn.className = 'filter-chip' + (isActive ? ' active' : '');
        /* The chip carries its category so the dot and the active fill can
           take that category's own colour straight from the tokens. */
        btn.dataset.cat = cat;
        btn.textContent = cat === 'all' ? 'All' : cat.charAt(0).toUpperCase() + cat.slice(1);
        btn.setAttribute('aria-pressed', String(isActive));
        btn.addEventListener('click', () => {
          activeCategory = cat;
          categoryFilter.querySelectorAll('.filter-chip').forEach(el => {
            const on = el.dataset.cat === cat;
            el.classList.toggle('active', on);
            el.setAttribute('aria-pressed', String(on));
          });
          updateView();
        });
        categoryFilter.appendChild(btn);
      });
    }

    const IMAGE_OFF_SVG = `
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        <line x1="2" y1="2" x2="22" y2="22"/>
        <path d="M10.41 10.41a2 2 0 1 1-2.83-2.83"/>
        <line x1="13.5" y1="13.5" x2="6" y2="21"/>
        <line x1="18" y1="12" x2="21" y2="15"/>
        <path d="M3.59 3.59A1.99 1.99 0 0 0 3 5v14a2 2 0 0 0 2 2h14c.55 0 1.05-.22 1.41-.59"/>
        <path d="M21 15V5a2 2 0 0 0-2-2H9"/>
      </svg>`;

    function createCard(record) {
      const card = document.createElement('a');
      card.className = 'tool-card';
      card.href = record.url;
      if (record.external) {
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
      }

      const title = escapeHTML(record.title);
      const desc = escapeHTML(record.description || '');
      const category = record.category ? escapeHTML(record.category) : '';
      const tags = (record.tags || []).map(t => escapeHTML(t));
      const isNew = newIds.has(record.id);

      if (record.category) card.dataset.category = record.category;

      card.innerHTML = `
        <div class="tool-img-wrap">
          ${record.imageUrl ? `<img src="${record.imageUrl}" alt="" loading="lazy" class="tool-img">` : ''}
          <div class="tool-img-fallback"${record.imageUrl ? '' : ' style="display:flex"'}>
            ${IMAGE_OFF_SVG}
            <span>No preview</span>
          </div>
          ${isNew ? `<span class="badge-new">New</span>` : ''}
        </div>
        <div class="tool-body">
          ${category ? `<span class="category-badge">${category}</span>` : ''}
          <h2 class="tool-title">${title}</h2>
          <p class="tool-desc">${desc}</p>
          ${tags.length ? `
            <div class="tool-tags">
              ${tags.map(t => `<span class="tag-chip">${t}</span>`).join('')}
            </div>` : ''}
        </div>
      `;

      const img = card.querySelector('img.tool-img');
      if (img) {
        const fallback = card.querySelector('.tool-img-fallback');
        img.addEventListener('error', () => {
          img.style.display = 'none';
          if (fallback) fallback.style.display = 'flex';
        });
      }

      return card;
    }

    function updateView() {
      const term = searchInput.value.toLowerCase();
      const sortType = sortSelect.value;

      let filtered = records.filter(r => {
        const matchSearch = r.haystack.includes(term);
        const matchCat = activeCategory === 'all' || r.category === activeCategory;
        return matchSearch && matchCat;
      });

      filtered.sort((a, b) => {
        if (sortType === 'title') return a.title.localeCompare(b.title, 'ja');
        if (sortType === 'oldest') return a.id - b.id;
        return b.id - a.id;
      });

      grid.innerHTML = '';
      filtered.forEach((record, i) => {
        const card = createCard(record);
        /* Replaying the stagger on every keystroke would turn filtering into a
           wait, so it runs on the first paint only — and caps, so a long shelf
           does not take seconds to finish arriving. */
        if (firstRender) {
          card.classList.add('fade-up');
          card.style.animationDelay = `${Math.min(i * 40, 240)}ms`;
        }
        grid.appendChild(card);
      });

      firstRender = false;
      countEl.textContent = filtered.length;
      emptyState.classList.toggle('hidden', filtered.length > 0);
    }

    function updateItemListSchema(tools) {
      const script = document.querySelector('script[type="application/ld+json"]');
      if (!script) return;
      try {
        const data = JSON.parse(script.textContent);
        const list = data['@graph'].find(n => n['@type'] === 'ItemList');
        if (!list) return;
        list.itemListElement = tools.map((t, i) => (
          { '@type': 'ListItem', 'position': i + 1, 'name': t.title, 'url': t.url }
        ));
        script.textContent = JSON.stringify(data);
      } catch (e) {
        console.warn('Failed to update JSON-LD ItemList:', e);
      }
    }

    const FALLBACK_RECORDS = [
      {
        id: 1,
        title: "CSV JSON Bridge - CSV ↔ JSON 相互変換ツール",
        url: "https://tk.st/tools/csv-json-bridge/",
        imageUrl: "https://tk.st/images/ogp/csv-json-bridge-ogp.png",
        category: "converter",
        description: "CSVファイルとJSONファイルを相互変換。Excelからのコピーペーストにも対応しています。",
        tags: ["CSV", "JSON"]
      }
    ];

    async function loadTools() {
      showSkeletons(6);
      try {
        /* Relative, like the stylesheet on this page. The host serves data/
           with max-age=0, must-revalidate, so freshness is already settled at
           the header level and needs no cache option here. */
        const res = await fetch('../data/tools.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        records = normalizeRecords(await res.json());
      } catch (e) {
        console.warn('Failed to load tools.json, using fallback:', e);
        records = normalizeRecords(FALLBACK_RECORDS);
        showMessage('最新のツール一覧を取得できなかったため、サンプルを表示しています。');
      }

      const sorted = [...records].sort((a, b) => b.id - a.id);
      newIds = new Set(sorted.slice(0, 2).map(r => r.id));
      renderCategoryChips();
      updateView();
      updateItemListSchema(records);
    }


    searchInput.addEventListener('input', debounce(updateView, 150));
    sortSelect.addEventListener('change', updateView);

    /* The icons ride a CDN, so they are treated as decoration that may not
       turn up: the shelf itself must never depend on them loading. The script
       is deferred, which puts it ahead of DOMContentLoaded and behind this. */
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });

    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('q');
    if (initialQuery) searchInput.value = initialQuery;

    loadTools();

    document.getElementById('currentYear').textContent = new Date().getFullYear();
  </script>
</body>
</html>
