  <style>
    :root { --ink: #212529; --screen: #f7f7f7; --nes-blue: #209cee; --nes-red: #e76e55; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, button, input, select { font-family: "Press Start 2P", "Noto Sans JP", monospace; }
    html, body { min-height: 100%; }
    body {
      margin: 0;

      overflow-x: hidden;

      background-image: url("data:image/svg+xml,%3Csvg width='192' height='192' viewBox='0 0 192 192' xmlns='http://www.w3.org/2000/svg' shape-rendering='crispEdges'%3E%3Cg fill='%23533d6b' opacity='.72'%3E%3Cpath d='M76 56h40v8H76zM68 64h56v8H68zM60 72h72v8H60zM60 80h16v8H60zM84 80h24v8H84zM116 80h16v8h-16zM60 88h72v8H60zM76 96h8v8h-8zM108 96h8v8h-8zM68 104h16v8H68zM108 104h16v8h-16zM60 112h8v8h-8zM84 112h24v8H84zM124 112h8v8h-8z'/%3E%3C/g%3E%3Cg fill='%23f7d51d' opacity='.6'%3E%3Cpath d='M22 24h4v16h-4zM16 30h16v4H16zM154 142h6v18h-6zM148 148h18v6h-18z'/%3E%3C/g%3E%3Cg fill='%23209cee' opacity='.5'%3E%3Cpath d='M150 30h6v6h-6zM30 150h6v6h-6zM168 82h4v4h-4zM20 92h4v4h-4z'/%3E%3C/g%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 192px 192px;
      background-attachment: fixed;
    }
    body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60; background: repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 4px); opacity: .25; }

    .site-header { width: 100%; padding: 24px 24px 16px; }

    .game-card:hover .game-image { transform: scale(1.05); }
    .image-fallback { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #777; background: #ddd; }

    #genre-filter { display: none; max-width: 100%; flex-wrap: wrap; gap: 12px; align-items: center; margin: 4px 0 24px; }
    #genre-filter.visible { display: flex; }
    .genre-chip { font-size: .62rem; white-space: nowrap; }

    .skeleton { background: linear-gradient(90deg, #d3d3d3 25%, #fff 50%, #d3d3d3 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
    .skeleton-image { aspect-ratio: 1200 / 630; }

    .skeleton-line.short { width: 25%; }
    .skeleton-line.medium { width: 85%; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .fade-up { animation: fadeUp 250ms steps(4, end) both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .empty-state { padding: 40px; text-align: center; }
    .empty-icon { display: block; margin-bottom: 20px; color: var(--nes-red); font-size: 2rem; }
    .empty-state p { margin: 16px 0 0; font-size: .7rem; line-height: 1.8; }
    .image-modal { width: min(calc(100% - 32px), 72rem); max-width: none; max-height: calc(100dvh - 32px); padding: 0; overflow: visible; color: #fff; border: 0; background: transparent; }
    .image-modal::backdrop { background: rgba(10, 8, 16, .88); }

    .image-modal-frame { display: flex; align-items: center; justify-content: center; overflow: auto; max-height: calc(100dvh - 160px); border: 4px solid #fff; background: #000; }
    .image-modal-image { display: block; width: 100%; height: auto; max-height: calc(100dvh - 168px); object-fit: contain; image-rendering: auto; }
    .image-modal-caption { margin: 16px 0 0; overflow-wrap: anywhere; font-size: .65rem; line-height: 1.8; text-align: center; }
    .site-footer { width: 100%; padding: 24px 24px 32px; color: #fff; }
    .footer-panel { display: flex; align-items: center; }

    #scroll-top-btn.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    @media (max-width: 1199px) { .game-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 900px) { .header-content { align-items: stretch; flex-direction: column; } .controls { align-items: stretch; } .search-control { flex: 1; width: auto; } }
    @media (max-width: 767px) { .site-header, .main-content, .site-footer { padding-left: 16px; padding-right: 16px; } .game-grid { grid-template-columns: 1fr; } .game-card { width: calc(100% - 8px); margin: 4px; } }
    @media (max-width: 640px) { .controls { flex-direction: column; } .sort-control { width: 100%; } .genre-chip { font-size: .54rem; } .heart-wrap { flex-basis: 52px; width: 52px; height: 52px; } .heart-wrap > .nes-icon { scale: 1; } .footer-panel { gap: 16px; flex-wrap: wrap; justify-content: center; } .footer-side { flex: none; } .image-modal-panel { padding: 16px !important; } .image-modal-close { top: 8px; right: 8px; } .image-modal-caption { font-size: .52rem; } #scroll-top-btn { right: 16px; bottom: 60px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>

  <script>
    // --- Web Audio API (ワクワク機能：効果音) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let isAudioUnlocked = false;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    
    // ユーザー操作でAudioContextのロックを解除
    const unlockAudio = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isAudioUnlocked = true;
      ['mousedown', 'touchstart', 'keydown', 'click'].forEach(evt => {
        document.removeEventListener(evt, unlockAudio, true);
      });
    };
    // capture: true にして、他のイベントより先にロック解除処理を走らせる
    ['mousedown', 'touchstart', 'keydown', 'click'].forEach(evt => {
      document.addEventListener(evt, unlockAudio, true);
    });

    function playBeep(freq = 440, type = 'sine', duration = 0.05, endFreq = null) {
      if (!isAudioUnlocked || prefersReducedMotion) return;
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (endFreq) {
        oscillator.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
      }
      gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + duration);
    }

    // 8ビット効果音
    const soundPop = () => playBeep(800, 'triangle', 0.04);
    const soundPunch = () => playBeep(400, 'sine', 0.2, 50);
    const soundJingle = () => {
      playBeep(440, 'triangle', 0.1);
      setTimeout(() => playBeep(660, 'triangle', 0.1), 80);
      setTimeout(() => playBeep(880, 'triangle', 0.3), 160);
    };

    // --- 隠しコマンド（コナミコマンドでパーティモード） ---
    const konamiCode = ['arrowup', 'arrowup', 'arrowdown', 'arrowdown', 'arrowleft', 'arrowright', 'arrowleft', 'arrowright', 'b', 'a'];
    let konamiIndex = 0;
    
    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === konamiCode[konamiIndex]) {
        konamiIndex++;
        if (konamiIndex === konamiCode.length) {
          document.body.classList.toggle('bw-mode');
          showMessage("📖 CLASSIC B&W MODE ACTIVATED! 📖", "success");
          soundJingle();
          konamiIndex = 0;
        }
      } else {
        konamiIndex = 0;
      }
    });

    // --- メインロジック ---
    let records = [];
    let newIds = new Set();
    let activeGenre = 'all';
    const grid = document.getElementById("game-grid");
    const emptyState = document.getElementById("empty-state");
    const countEl = document.getElementById("game-count");
    const messageBar = document.getElementById("message-bar");
    const searchInput = document.getElementById("search-input");
    const sortSelect = document.getElementById("sort-select");
    const genreFilter = document.getElementById("genre-filter");
    const scrollTopBtn = document.getElementById("scroll-top-btn");
    const imageModal = document.getElementById("image-modal");
    const imageModalImage = document.getElementById("image-modal-image");
    const imageModalCaption = document.getElementById("image-modal-caption");
    const imageModalClose = document.getElementById("image-modal-close");

    function openImageModal(src, title) {
      imageModalImage.src = src;
      imageModalImage.alt = `${title} thumbnail enlarged`;
      imageModalCaption.textContent = title;
      imageModal.showModal();
      soundPop();
    }

    function closeImageModal() {
      imageModal.close();
      imageModalImage.removeAttribute('src');
      imageModalImage.alt = '';
    }

    imageModalClose.addEventListener('click', closeImageModal);
    imageModal.addEventListener('click', event => {
      if (event.target === imageModal) closeImageModal();
    });
    imageModal.addEventListener('close', () => {
      imageModalImage.removeAttribute('src');
      imageModalImage.alt = '';
    });

    function showMessage(text, type) {
      if (!text) {
        messageBar.classList.add("hidden");
        messageBar.textContent = '';
        return;
      }
      messageBar.classList.remove("hidden");
      messageBar.textContent = text;
      messageBar.style.borderColor = type === "error" ? "var(--nes-red)" : "var(--nes-blue)";
    }

    function showSkeletons(count = 6) {
      grid.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const sk = document.createElement('div');
        sk.className = 'game-card nes-container is-rounded';
        sk.innerHTML = `
          <div class="image-frame skeleton-image">
            <div class="skeleton"></div>
          </div>
          <div class="skeleton-copy">
            <div class="skeleton skeleton-line title"></div>
            <div class="skeleton skeleton-line short"></div>
            <div class="skeleton skeleton-line"></div>
            <div class="skeleton skeleton-line medium"></div>
          </div>
        `;
        grid.appendChild(sk);
      }
    }

    function genreTone(genre) {
      const key = String(genre || '').toLowerCase();
      return ({ all: 'is-primary', puzzle: 'is-warning', roguelike: 'is-success', sandbox: 'is-error' })[key] || 'is-primary';
    }

    function renderGenreChips() {
      const genres = [...new Set(records.map(r => r.genre).filter(Boolean))].sort();
      if (genres.length === 0) return;
      genreFilter.classList.add('visible');
      genreFilter.innerHTML = '';
      ['all', ...genres].forEach(genre => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = `genre-chip nes-btn ${genreTone(genre)}` + (genre === activeGenre ? ' active' : '');
        chip.textContent = genre === 'all' ? 'ALL' : genre.toUpperCase();
        chip.setAttribute('aria-pressed', String(genre === activeGenre));
        chip.addEventListener('click', () => {
          activeGenre = genre;
          soundPop();
          renderGenreChips();
          updateView();
        });
        genreFilter.appendChild(chip);
      });
    }

    // XSS対策用のエスケープ関数
    const escapeHTML = (str) => String(str).replace(/[&<>"']/g, match => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    })[match]);

    function createCard(record) {
      const card = document.createElement("article");
      card.className = "game-card nes-container is-rounded fade-up";
      const title = escapeHTML(record.title);
      const desc = escapeHTML(record.description || '');
      const genre = record.genre ? escapeHTML(record.genre) : '';
      const genreToneClass = genreTone(record.genre);
      const ai = record.ai ? escapeHTML(record.ai) : '';
      const url = escapeHTML(record.url);
      const imgUrl = escapeHTML(record.imageUrl);

      const isNew = newIds.has(record.id);

      card.innerHTML = `
        ${isNew ? `<span class="card-new nes-badge"><span class="is-error">NEW!</span></span>` : ''}
        <button type="button" class="image-frame thumbnail-button" aria-label="${title}のサムネイルを拡大表示">
          <img src="${imgUrl}" alt="${title}" loading="lazy"
               class="game-image"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'; this.closest('.thumbnail-button').disabled=true;">
          <div class="image-fallback">
            <span class="no-signal-icon" aria-hidden="true">□</span>
            <span class="pixel-title card-title">NO SIGNAL</span>
          </div>
        </button>
        <div class="card-body">
          <h3 class="pixel-title card-title">${title}</h3>
          <div class="card-details">
            ${genre ? `<span class="nes-badge game-genre"><span class="${genreToneClass}">${genre}</span></span>` : ''}
            <p class="game-description">${desc}</p>
            ${ai ? `<div class="game-meta"><span class="ai-mark" aria-hidden="true">[AI]</span><span>${ai}</span></div>` : ''}
          </div>
          <div class="card-actions">
            <a href="${url}" target="_blank" rel="noopener noreferrer" class="nes-btn is-primary pixel-button snd-click">
              <span aria-hidden="true">▶</span><span>READ GAME</span>
            </a>
          </div>
        </div>
      `;

      // カード作成時に動的要素にのみサウンドイベントを付与
      card.addEventListener('mouseenter', soundPop);
      const startBtn = card.querySelector('.snd-click');
      if (startBtn) {
        startBtn.addEventListener('mousedown', soundPunch);
      }
      const thumbnailButton = card.querySelector('.thumbnail-button');
      thumbnailButton.addEventListener('click', () => openImageModal(record.imageUrl, record.title));
      
      return card;
    }

    function updateView() {
      const term = searchInput.value.toLowerCase();
      const sortType = sortSelect.value;
      
      let filtered = records.filter(r => {
        const matchSearch = `${r.title} ${r.description || ''} ${r.genre || ''} ${r.ai || ''}`.toLowerCase().includes(term);
        const matchGenre = activeGenre === 'all' || r.genre === activeGenre;
        return matchSearch && matchGenre;
      });
      
      filtered.sort((a, b) => {
        if (sortType === 'title') return a.title.localeCompare(b.title, 'ja');
        if (sortType === 'oldest') return a.id - b.id;
        return b.id - a.id;
      });
      
      grid.innerHTML = "";
      filtered.forEach((record, index) => {
        const card = createCard(record);
        card.style.animationDelay = `${index * 50}ms`;
        grid.appendChild(card);
      });
      
      countEl.textContent = filtered.length;
      emptyState.classList.toggle("hidden", filtered.length > 0);
      
    }

    function computeNewIds() {
      const sorted = [...records].sort((a, b) => b.id - a.id);
      newIds = new Set(sorted.slice(0, 2).map(r => r.id));
    }

    function updateItemListSchema(games) {
      const script = document.querySelector('script[type="application/ld+json"]');
      if (!script) return;
      try {
        const data = JSON.parse(script.textContent);
        const list = data['@graph'].find(n => n['@type'] === 'ItemList');
        if (!list) return;
        list.itemListElement = games
          .filter(g => g.url && g.url !== '#')
          .map((g, i) => ({ '@type': 'ListItem', 'position': i + 1, 'url': g.url }));
        script.textContent = JSON.stringify(data);
      } catch (e) {}
    }

    async function loadGames() {
      showSkeletons(6);
      try {
        const res = await fetch('../data/game.json');
        if (!res.ok) throw new Error('Network error');
        records = await res.json();
      } catch (error) {
        records = [];
        showMessage('ゲーム一覧を読み込めませんでした。時間をおいて再度お試しください。', 'error');
      } finally {
        computeNewIds();
        renderGenreChips();
        updateView();
        updateItemListSchema(records);
      }
    }

    // 静的要素（検索バー、セレクトなど）のサウンドイベント初期化
    function initStaticSoundEvents() {
      document.querySelectorAll('.snd-hover').forEach(el => {
        el.addEventListener('mouseenter', soundPop);
      });
    }

    // スクロールトップボタン
    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('visible', window.scrollY > 300);
    });
    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      soundPop();
    });
    // 初期化処理
    searchInput.addEventListener("input", updateView);
    sortSelect.addEventListener("change", updateView);
    initStaticSoundEvents();

    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('q');
    if (initialQuery) searchInput.value = initialQuery;

    loadGames();

    document.getElementById('currentYear').textContent = '2024-' + new Date().getFullYear();

  </script>
</body>
</html>
