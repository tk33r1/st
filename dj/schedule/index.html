<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 身内専用ページ。検索結果には一切出さない -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="bingbot" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0a0a0c">
  <title>白昼夢 スケジュール調整</title>
  <link rel="icon" href="https://tk.st/images/favicons/dj-favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="https://tk.st/images/favicons/dj-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Share+Tech+Mono&family=Shippori+Mincho&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 美術紫水（bijutsushisui.com）のテーマ変数をそのまま持ってきている */
    :root {
      --bg: #0a0a0c;
      --bg-elevated: #121216;
      --fg: #ececec;
      --fg-dim: #9a9aa0;
      --heart-primary: #ff2f6e;
      --heart-secondary: #37f2e6;
      --glitch-accent: #ffe14d;
      --border: rgba(255, 255, 255, 0.14);

      --f-display: 'Share Tech Mono', ui-monospace, monospace;
      --f-dot: 'DotGothic16', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      --f-body: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;

      color-scheme: dark;
    }

    html {
      scrollbar-gutter: stable;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--f-body);
      font-size: 0.9375rem;
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* 本家（bijutsushisui.com）と同じテイクオーバー背景。ドットのハートが漂うキャンバス */
    #bs-takeover-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      /* このページはフォーム主体で文字量が多いので、本家がイベントページで
         行っているのと同じく背景の主張を抑える */
      opacity: 0.35;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 39;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    }

    /* VHS のスキャンライン。本家と同じ 1px / 3px */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      mix-blend-mode: overlay;
      background: repeating-linear-gradient(to bottom,
          rgba(255, 255, 255, 0.03) 0px,
          rgba(255, 255, 255, 0.03) 1px,
          transparent 1px,
          transparent 3px);
    }

    /* ===== LAYOUT ===== */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 calc(20px + env(safe-area-inset-right)) calc(16vh + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    }

    .hero {
      padding: 7vh 0 4vh;
    }

    .section {
      margin-bottom: 8vh;
    }

    .section-title {
      font-family: var(--f-dot);
      font-size: 0.9375rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      color: var(--heart-secondary);
      margin-bottom: 18px;
    }

    /* ===== MONTH ===== */
    .month-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .month-now {
      flex: 1 1 auto;
      text-align: center;
      min-width: 0;
    }

    .month-now .no {
      display: block;
      font-family: var(--f-dot);
      font-size: clamp(1.875rem, 7vw, 3.375rem);
      line-height: 1.35;
      letter-spacing: 0.04em;
    }

    .month-now .sub {
      display: block;
      font-family: var(--f-dot);
      font-size: 0.6875rem;
      letter-spacing: 0.22em;
      color: var(--fg-dim);
    }

    .nav-btn {
      flex: 0 0 auto;
      font-family: var(--f-dot);
      font-size: 0.6875rem;
      letter-spacing: 0.1em;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg-dim);
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
    }

    .nav-btn:hover {
      color: var(--heart-secondary);
      border-color: var(--heart-secondary);
    }

    .quick-months {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 26px;
    }

    .quick {
      font-family: var(--f-dot);
      font-size: 0.6875rem;
      letter-spacing: 0.06em;
      padding: 5px 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg-dim);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .quick:hover {
      color: var(--heart-primary);
      border-color: var(--heart-primary);
    }

    /* ===== FORM ===== */
    .field-label {
      display: block;
      font-family: var(--f-display);
      font-size: 0.625rem;
      letter-spacing: 0.2em;
      color: var(--fg-dim);
      margin-bottom: 8px;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      font-family: var(--f-body);
      font-size: 0.875rem;
      color: var(--fg);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 11px 12px;
      transition: border-color 0.2s;
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(154, 154, 160, 0.6);
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--heart-secondary);
    }

    textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.8;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .row>* {
      flex: 1 1 180px;
    }

    /* ===== BUTTONS ===== */
    .btn {
      font-family: var(--f-dot);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      padding: 12px 26px;
      border: 1px solid var(--heart-secondary);
      background: transparent;
      color: var(--heart-secondary);
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background: var(--heart-secondary);
      color: var(--bg);
    }

    .btn.primary {
      background: var(--heart-secondary);
      color: var(--bg);
    }

    .btn.primary:hover {
      background: var(--fg);
      border-color: var(--fg);
    }

    .btn.small {
      font-size: 0.6875rem;
      padding: 8px 14px;
      letter-spacing: 0.08em;
      border-color: var(--border);
      color: var(--fg-dim);
    }

    .btn.small:hover {
      background: transparent;
      border-color: var(--heart-secondary);
      color: var(--heart-secondary);
    }

    .btn.danger {
      border-color: var(--heart-primary);
      color: var(--heart-primary);
    }

    .btn.danger:hover {
      border-color: var(--heart-primary);
      background: var(--heart-primary);
      color: var(--bg);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 22px;
    }

    /* ===== TABLE ===== */
    .table-scroll {
      overflow-x: auto;
      margin-bottom: 14px;
    }

    table.grid {
      border-collapse: collapse;
      width: 100%;
      min-width: 420px;
    }

    table.grid th,
    table.grid td {
      border-bottom: 1px solid var(--border);
      padding: 11px 12px;
      text-align: center;
      font-weight: 400;
      white-space: nowrap;
    }

    /* 日曜日 と ○ / △ / × を直接書き出す行なので Latin のみの Share Tech Mono は使えない */
    table.grid thead th {
      font-family: var(--f-dot);
      font-size: 0.6875rem;
      letter-spacing: 0.06em;
      color: var(--fg-dim);
      padding-bottom: 10px;
    }

    table.grid tbody td,
    table.grid tfoot td {
      font-family: var(--f-dot);
      font-size: 0.8125rem;
    }

    table.grid th.date-cell,
    table.grid td.date-cell {
      text-align: left;
      position: sticky;
      left: 0;
      z-index: 1;
      background: var(--bg);
      border-right: 1px solid var(--border);
    }

    /* ○△× は Share Tech Mono に無く × だけ字面が変わるので、3つとも DotGothic16 で揃える */
    .tally {
      font-family: var(--f-dot);
      font-size: 0.8125rem;
      letter-spacing: 0.06em;
    }

    tr.best td {
      background: rgba(55, 242, 230, 0.08);
    }

    tr.best td.date-cell {
      background: #0e1a1c;
      color: var(--heart-secondary);
    }

    /* 開催日が確定した行。白昼夢のアクセント色で塗る */
    tr.decided td,
    tr.decided td.date-cell {
      background: var(--glitch-accent);
      color: var(--bg);
      border-bottom-color: var(--glitch-accent);
    }

    tr.decided .mark-o,
    tr.decided .mark-t,
    tr.decided .mark-x,
    tr.decided .mark-none {
      color: var(--bg);
    }

    tr.decided td.date-cell::after {
      content: ' 開催';
      font-size: 0.625rem;
    }

    /* 開催できない日。本家の売り切れ行と同じ扱い。
       opacity だと sticky の日付列まで透けて横スクロール中に裏のセルが見えるので、色を落として表現する */
    tr.blocked td {
      color: rgba(154, 154, 160, 0.55);
    }

    tr.blocked .mark-o,
    tr.blocked .mark-t,
    tr.blocked .mark-x,
    tr.blocked .mark-none {
      color: rgba(154, 154, 160, 0.45);
    }

    tr.blocked td.date-cell {
      text-decoration: line-through;
    }

    .mark-o {
      color: var(--heart-secondary);
    }

    .mark-t {
      color: var(--glitch-accent);
    }

    .mark-x {
      color: var(--heart-primary);
    }

    .mark-none {
      color: rgba(154, 154, 160, 0.4);
    }

    .name-btn {
      font-family: var(--f-dot);
      font-size: 0.6875rem;
      letter-spacing: 0.06em;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--fg);
      cursor: pointer;
      padding: 0 2px 2px;
      transition: color 0.2s, border-color 0.2s;
    }

    .name-btn:hover {
      color: var(--heart-secondary);
      border-bottom-color: var(--heart-secondary);
    }

    table.grid tfoot td.comment-cell {
      white-space: normal;
      font-family: var(--f-body);
      font-size: 0.75rem;
      color: var(--fg-dim);
      max-width: 170px;
      line-height: 1.7;
    }

    /* ===== ANSWER PICKER ===== */
    .answer-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .answer-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: linear-gradient(180deg, var(--bg-elevated), rgba(18, 18, 22, 0.4));
      padding: 11px 14px;
      transition: border-color 0.25s;
    }

    .answer-row .d {
      flex: 1 1 130px;
      font-family: var(--f-dot);
      font-size: 0.8125rem;
      letter-spacing: 0.04em;
    }

    .answer-row.is-decided {
      border-color: var(--glitch-accent);
    }

    .answer-row.is-decided .d {
      color: var(--glitch-accent);
    }

    .answer-row.is-blocked {
      opacity: 0.4;
    }

    .answer-row.is-blocked .d {
      text-decoration: line-through;
    }

    .answer-row .tag {
      font-family: var(--f-dot);
      font-size: 0.625rem;
      letter-spacing: 0.1em;
      padding: 2px 8px;
      border: 1px solid currentColor;
    }

    .answer-row .tag.decided {
      color: var(--glitch-accent);
    }

    .answer-row .tag.blocked {
      color: var(--heart-primary);
    }

    .seg {
      display: flex;
    }

    .seg button {
      font-family: var(--f-dot);
      font-size: 1rem;
      width: 50px;
      height: 42px;
      border: 1px solid var(--border);
      margin-left: -1px;
      background: transparent;
      color: var(--fg-dim);
      cursor: pointer;
      transition: all 0.15s;
    }

    .seg button:first-child {
      margin-left: 0;
    }

    .seg button:hover:not(:disabled):not([aria-pressed="true"]) {
      color: var(--fg);
      border-color: var(--fg-dim);
    }

    .seg button[aria-pressed="true"] {
      color: var(--bg);
    }

    .seg button[aria-pressed="true"][data-v="o"] {
      background: var(--heart-secondary);
      border-color: var(--heart-secondary);
    }

    .seg button[aria-pressed="true"][data-v="t"] {
      background: var(--glitch-accent);
      border-color: var(--glitch-accent);
    }

    .seg button[aria-pressed="true"][data-v="x"] {
      background: var(--heart-primary);
      border-color: var(--heart-primary);
    }

    .seg button:disabled {
      cursor: not-allowed;
      color: rgba(154, 154, 160, 0.3);
    }

    /* 開催不可日は押せないので、選択済みの塗りも外して無効に見せる */
    .seg button:disabled[aria-pressed="true"] {
      background: transparent;
      border-color: var(--border);
      color: rgba(154, 154, 160, 0.35);
    }

    .bulk {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 18px;
    }

    /* ===== 開催日 ===== */
    .status-line {
      font-family: var(--f-dot);
      font-size: 0.875rem;
      letter-spacing: 0.06em;
      color: var(--glitch-accent);
      margin-bottom: 14px;
    }

    .block-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .block-chip {
      font-family: var(--f-dot);
      font-size: 0.75rem;
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg-dim);
      cursor: pointer;
      transition: all 0.15s;
    }

    .block-chip:hover {
      color: var(--fg);
      border-color: var(--fg-dim);
    }

    .block-chip[aria-pressed="true"] {
      color: var(--heart-primary);
      border-color: var(--heart-primary);
      text-decoration: line-through;
      opacity: 0.75;
    }

    /* ===== MISC ===== */
    .notice {
      font-family: var(--f-body);
      font-size: 0.8125rem;
      padding: 12px 16px;
      border: 1px solid var(--heart-secondary);
      border-radius: 2px;
      background: var(--bg-elevated);
      color: var(--fg);
      margin-top: 18px;
    }

    .notice.error {
      border-color: var(--heart-primary);
    }

    .muted {
      font-family: var(--f-body);
      font-size: 0.75rem;
      color: var(--fg-dim);
    }

    .best-line {
      font-family: var(--f-body);
      font-size: 0.8125rem;
      color: var(--heart-secondary);
      margin-bottom: 16px;
    }

    .best-line.quiet {
      color: var(--fg-dim);
    }

    .site-foot {
      border-top: 1px solid var(--border);
      margin-top: 10vh;
      padding-top: 30px;
      font-family: var(--f-display);
      font-size: 0.6875rem;
      letter-spacing: 0.1em;
      color: var(--fg-dim);
      text-align: center;
    }

    .site-foot a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--border);
    }

    .site-foot a:hover {
      color: var(--heart-secondary);
      border-bottom-color: var(--heart-secondary);
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 560px) {
      body {
        font-size: 0.875rem;
      }

      .wrap {
        padding: 0 calc(14px + env(safe-area-inset-right)) calc(14vh + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
      }

      .section {
        margin-bottom: 6vh;
      }

      .nav-btn {
        padding: 9px 8px;
        font-size: 0.625rem;
      }

      .seg button {
        width: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #bs-takeover-canvas {
        display: none;
      }

      .scanlines {
        display: none;
      }
    }
  </style>
</head>

<body>
  <canvas id="bs-takeover-canvas" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="wrap">
    <!-- ===== 月 ===== -->
    <section class="hero">
      <div class="month-bar">
        <button class="nav-btn" id="prevMonth" type="button">←</button>
        <div class="month-now">
          <span class="no" id="monthLabel">—</span>
          <span class="sub" id="monthSub"></span>
        </div>
        <button class="nav-btn" id="nextMonth" type="button">→</button>
      </div>
      <div class="quick-months" id="quickMonths" hidden></div>
      <div id="globalNotice" class="notice error" role="status" hidden></div>
    </section>

    <!-- ===== 回答 ===== -->
    <section class="section">
      <h2 class="section-title" id="answerTitle">出欠を入れる</h2>

      <div class="row" style="margin-bottom:22px">
        <label>
          <span class="field-label">NAME</span>
          <select id="ansName"></select>
        </label>
        <label id="customNameField" hidden>
          <span class="field-label">FREE INPUT</span>
          <input type="text" id="ansCustomName" maxlength="20" placeholder="お名前">
        </label>
      </div>

      <div class="bulk">
        <button class="btn small" data-fill="o" type="button">全部 ○</button>
        <button class="btn small" data-fill="t" type="button">全部 △</button>
        <button class="btn small" data-fill="x" type="button">全部 ×</button>
      </div>

      <div class="answer-list" id="ansList"></div>

      <div style="margin-top:22px">
        <label class="field-label" for="ansComment">COMMENT</label>
        <input type="text" id="ansComment" maxlength="200" placeholder="ひとこと（任意）">
      </div>

      <div class="btn-row">
        <button class="btn primary" id="submitAnswer">登録する</button>
        <button class="btn small danger" id="deleteAnswer" hidden>削除</button>
        <button class="btn small" id="resetAnswer" hidden>クリア</button>
      </div>
    </section>

    <!-- ===== 集計 ===== -->
    <section class="section">
      <h2 class="section-title">集計</h2>
      <p class="status-line" id="statusLine" hidden></p>
      <p class="best-line" id="bestLine"></p>
      <div class="table-scroll">
        <table class="grid" id="grid"></table>
      </div>
      <p class="muted">名前をタップすると修正できます</p>
    </section>

    <!-- ===== 開催日の設定 ===== -->
    <section class="section">
      <h2 class="section-title">開催日</h2>

      <div style="margin-bottom:22px">
        <label class="field-label" for="decidedSelect">FIXED</label>
        <select id="decidedSelect"></select>
      </div>

      <div>
        <span class="field-label">BLOCKED</span>
        <div class="block-chips" id="blockChips"></div>
      </div>
    </section>

    <footer class="site-foot">
      <p>© 2026 Shinya Takeda | <a href="https://bijutsushisui.com/" target="_blank" rel="noopener noreferrer">BIJUTSU SHISUI</a></p>
    </footer>
  </main>

  <!-- 本家（bijutsushisui.com）のテイクオーバー背景をそのまま移植。
       ドットのハートが漂い、たまに走査帯ズレ・RGB色収差でグリッチする -->
  <script>
    (function () {
      'use strict';

      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var canvas = document.getElementById('bs-takeover-canvas');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');

      var rootStyle = getComputedStyle(document.documentElement);
      var settings = {
        bgColor: rootStyle.getPropertyValue('--bg').trim() || '#0a0a0c',
        heartPrimary: rootStyle.getPropertyValue('--heart-primary').trim() || '#ff2f6e',
        heartSecondary: rootStyle.getPropertyValue('--heart-secondary').trim() || '#37f2e6',
        heartCount: 42,
        glitchFrequency: 0.02,
        motionStyle: 'breath'
      };

      // オフスクリーン: シーン本体 / R・G・B分離用 / 焼き付き用
      var scene = document.createElement('canvas');
      var sceneCtx = scene.getContext('2d');
      var rC = document.createElement('canvas'), rCtx = rC.getContext('2d');
      var gC = document.createElement('canvas'), gCtx = gC.getContext('2d');
      var bC = document.createElement('canvas'), bCtx = bC.getContext('2d');
      var burn = document.createElement('canvas'); // 残像焼き付きレイヤー
      var burnCtx = burn.getContext('2d');

      var W, H, DPR;
      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * DPR; canvas.height = H * DPR;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        [scene, rC, gC, bC, burn].forEach(function (cv) {
          cv.width = W; cv.height = H;
        });
        burnCtx.fillStyle = settings.bgColor;
        burnCtx.fillRect(0, 0, W, H);
      }
      window.addEventListener('resize', resize);
      resize();

      // ---- ハートのドット絵形状 ----
      var HEART_GRID = ['0110110', '1111111', '1111111', '0111110', '0011100', '0001000'];

      function drawHeartTile(g, cx, cy, size, angleRad, color, alpha) {
        var rows = HEART_GRID.length, cols = HEART_GRID[0].length;
        var cell = size / cols;
        g.save();
        g.translate(cx, cy);
        g.rotate(angleRad);
        g.globalAlpha = alpha;
        g.fillStyle = color;
        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++) {
            if (HEART_GRID[r][c] === '1') {
              g.fillRect((c - cols / 2) * cell, (r - rows / 2) * cell, cell * 0.92, cell * 0.92);
            }
          }
        }
        g.restore();
      }

      function makeHearts(count) {
        var hearts = [];
        for (var i = 0; i < count; i++) {
          hearts.push({
            x: Math.random(), y: Math.random(),
            size: 14 + Math.random() * 22,
            color: Math.random() > 0.5 ? settings.heartPrimary : settings.heartSecondary,
            phase: Math.random() * Math.PI * 2,
            period: 3 + Math.random() * 5,
            angularVelocity: (Math.random() - 0.5) * 1.2,
            baseAlpha: 0.35 + Math.random() * 0.35
          });
        }
        return hearts;
      }
      var hearts = makeHearts(settings.heartCount);

      // ---- グリッチ状態 ----
      var glitchUntil = 0;
      var BANDS = 32;
      var bandShift = [];
      var charFlashUntil = 0;
      var CORRUPT_CHARS = ['0', '1', 'ｱ', 'ｶ', 'ﾀ', 'ﾅ', '■', 'ﾊ', 'ﾏ', 'ﾔ', 'ﾝ'];

      function triggerGlitch(now) {
        glitchUntil = now + 140 + Math.random() * 180;
        bandShift = [];
        for (var b = 0; b < BANDS; b++) {
          var big = Math.random() < 0.06;
          bandShift.push((Math.random() - 0.5) * (big ? 36 : 5));
        }
        if (Math.random() < 0.6) {
          charFlashUntil = now + 300 + Math.random() * 200;
        }
      }

      function maybeTriggerGlitch(now) {
        if (now > glitchUntil && Math.random() < settings.glitchFrequency * 0.5) {
          triggerGlitch(now);
        }
      }

      function makeChannel(canvasEl, ctxEl, source, color) {
        ctxEl.clearRect(0, 0, W, H);
        ctxEl.drawImage(source, 0, 0);
        ctxEl.globalCompositeOperation = 'multiply';
        ctxEl.fillStyle = color;
        ctxEl.fillRect(0, 0, W, H);
        ctxEl.globalCompositeOperation = 'source-over';
      }

      function hexToRgb(hex) {
        hex = hex.replace('#', '');
        var r = parseInt(hex.substring(0, 2), 16);
        var g = parseInt(hex.substring(2, 4), 16);
        var b = parseInt(hex.substring(4, 6), 16);
        return r + ',' + g + ',' + b;
      }

      var start = performance.now();

      function frame(now) {
        var t = now - start;
        maybeTriggerGlitch(now);
        var glitching = now < glitchUntil;

        // --- シーン本体を描画（背景は塗らず、ハートのみ透明背景に描く） ---
        sceneCtx.clearRect(0, 0, W, H);
        for (var i = 0; i < hearts.length; i++) {
          var h = hearts[i];
          var angle;
          if (settings.motionStyle === 'flutter') {
            angle = (t / 1000) * h.angularVelocity;
          } else {
            var speed = Math.sin((t / 1000 / h.period) * Math.PI * 2 + h.phase);
            angle = speed * Math.PI * 0.9;
          }
          drawHeartTile(sceneCtx, h.x * W, h.y * H, h.size, angle, h.color, h.baseAlpha);
        }

        // --- 残像焼き付き ---
        burnCtx.fillStyle = 'rgba(' + hexToRgb(settings.bgColor) + ',0.14)';
        burnCtx.fillRect(0, 0, W, H);
        burnCtx.drawImage(scene, 0, 0);

        // --- RGB色収差（常時わずか、グリッチ中は強める） ---
        makeChannel(rC, rCtx, burn, '#ff0000');
        makeChannel(gC, gCtx, burn, '#00ff00');
        makeChannel(bC, bCtx, burn, '#0000ff');
        var ab = glitching ? 6 : 1.2;

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = settings.bgColor;
        ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(rC, -ab, 0);
        ctx.drawImage(gC, 0, 0);
        ctx.drawImage(bC, ab, 0);
        ctx.globalCompositeOperation = 'source-over';

        // --- 走査帯ズレ（グリッチ中のみ） ---
        if (glitching) {
          var snap = document.createElement('canvas');
          snap.width = W; snap.height = H;
          snap.getContext('2d').drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, W, H);
          var bh = H / BANDS;
          for (var b = 0; b < BANDS; b++) {
            var sx = bandShift[b] || 0;
            ctx.drawImage(snap, 0, b * bh, W, bh + 1, sx, b * bh, W, bh + 1);
          }
        }

        // --- 文字化けフラッシュ（グリッチ中のみ） ---
        if (now < charFlashUntil && Math.random() < 0.6) {
          ctx.font = '11px monospace';
          ctx.fillStyle = '#ffe14d';
          for (var c2 = 0; c2 < 6; c2++) {
            ctx.globalAlpha = 0.6 + Math.random() * 0.4;
            ctx.fillText(
              CORRUPT_CHARS[Math.floor(Math.random() * CORRUPT_CHARS.length)],
              Math.random() * W, Math.random() * H
            );
          }
          ctx.globalAlpha = 1;
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>

  <script>
    (function () {
      'use strict';

      // ===== 設定 =====
      // メンバーは五十音順。末尾の「その他」で自由入力。
      var MEMBERS = ['かずき', 'たけ', 'マメピー', 'ミツキ'];
      var OTHER = '__other__';
      var API_BASE = '/dj/api/schedule'; // tk.st 上の Worker ルート（同一オリジン）
      var STORE_KEY = 'dj-schedule-name';
      var WDAY = ['日', '月', '火', '水', '木', '金', '土'];
      var MARKS = { o: '○', t: '△', x: '×' };
      var SERIES_START = '2026-06'; // 2026年6月＝白昼夢①。毎月1回なので月がそのまま回数になる

      // ===== 状態 =====
      var month = '';        // 表示中の月 "YYYY-MM"
      var data = null;       // サーバーから取得した月データ
      var answers = {};      // { 'YYYY-MM-DD': 'o'|'t'|'x' }
      var editingId = null;  // 修正中の回答 id

      // ===== ユーティリティ =====
      function $(id) { return document.getElementById(id); }

      function notice(message, isError) {
        var el = $('globalNotice');
        if (!message) { el.hidden = true; return; }
        el.textContent = message;
        el.className = 'notice' + (isError === false ? '' : ' error');
        el.hidden = false;
        // 通知はページ上部にあるので、下のセクションから呼ばれても見える位置まで戻す
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      function toDate(iso) { return new Date(iso + 'T00:00:00'); }

      function fmtDate(iso) {
        var d = toDate(iso);
        return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WDAY[d.getDay()] + ')';
      }

      function fmtDateLong(iso) {
        var d = toDate(iso);
        return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日(' + WDAY[d.getDay()] + ')';
      }

      function fmtMonth(ym) {
        return Number(ym.slice(0, 4)) + '年' + Number(ym.slice(5, 7)) + '月';
      }

      // 白昼夢の通し回数。起点より前の月は番号なし
      function eventNo(ym) {
        var months = (Number(ym.slice(0, 4)) - Number(SERIES_START.slice(0, 4))) * 12
          + (Number(ym.slice(5, 7)) - Number(SERIES_START.slice(5, 7)));
        return months >= 0 ? months + 1 : null;
      }

      // ①〜㊿。それ以降は素直に数字で出す
      function circled(n) {
        if (n >= 1 && n <= 20) return String.fromCharCode(0x2460 + n - 1);
        if (n >= 21 && n <= 35) return String.fromCharCode(0x3251 + n - 21);
        if (n >= 36 && n <= 50) return String.fromCharCode(0x32b1 + n - 36);
        return '(' + n + ')';
      }

      // 「白昼夢③」。起点より前は月表記にフォールバック
      function eventLabel(ym) {
        var no = eventNo(ym);
        return no ? '白昼夢' + circled(no) : fmtMonth(ym);
      }

      function ymOf(date) {
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
      }

      function shiftMonth(ym, delta) {
        var d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)) - 1 + delta, 1);
        return ymOf(d);
      }

      function isMonth(ym) {
        if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(ym || '')) return false;
        var year = Number(ym.slice(0, 4));
        return year >= 2020 && year <= 2099;
      }

      function api(path, options) {
        var opts = options || {};
        return fetch(API_BASE + path, {
          method: opts.method || 'GET',
          headers: opts.body ? { 'Content-Type': 'application/json' } : undefined,
          body: opts.body ? JSON.stringify(opts.body) : undefined,
          cache: 'no-store'
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (payload) {
            if (!res.ok) throw new Error(payload.error || ('通信に失敗しました (' + res.status + ')'));
            return payload;
          });
        }).catch(function (err) {
          if (err instanceof TypeError) {
            throw new Error('サーバーに接続できませんでした');
          }
          throw err;
        });
      }

      // ===== ルーティング =====
      function monthFromUrl() {
        var m = new URLSearchParams(location.search).get('m');
        return isMonth(m) ? m : ymOf(new Date());
      }

      function goto(ym, replace) {
        history[replace ? 'replaceState' : 'pushState']({ m: ym }, '', location.pathname + '?m=' + ym);
        load(ym);
      }

      // ===== 読み込み =====
      function load(ym) {
        month = ym;
        notice('');
        renderMonthBar();
        api('/months/' + ym).then(function (payload) {
          data = payload;
          resetAnswerForm(true);
          renderAll();
        }).catch(function (err) {
          notice(err.message);
        });
        loadQuickMonths();
      }

      function loadQuickMonths() {
        api('/months').then(function (list) {
          var box = $('quickMonths');
          box.textContent = '';
          var others = list.filter(function (row) { return row.ym !== month; }).slice(0, 8);
          if (!others.length) { box.hidden = true; return; }
          box.hidden = false;
          var lbl = document.createElement('span');
          lbl.className = 'muted';
          lbl.textContent = '回答あり';
          box.appendChild(lbl);
          others.forEach(function (row) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'quick';
            b.textContent = eventLabel(row.ym) + ' ' + row.response_count;
            b.addEventListener('click', function () { goto(row.ym); });
            box.appendChild(b);
          });
        }).catch(function () { /* 一覧が出せなくても本体は使える */ });
      }

      function renderAll() {
        document.title = eventLabel(month) + ' スケジュール調整';
        renderMonthBar();
        renderTable();
        renderBest();
        renderStatusEditor();
        renderNameSelect();
        autoLoadOwnResponse();
        renderAnswerRows();
      }

      // ===== 月バー =====
      function renderMonthBar() {
        $('monthLabel').textContent = eventLabel(month);
        var count = data && data.month === month ? data.dates.length : 0;
        $('monthSub').textContent = fmtMonth(month) + (count ? ' / 日曜 ' + count + '回' : '');
        $('prevMonth').textContent = '← ' + eventLabel(shiftMonth(month, -1));
        $('nextMonth').textContent = eventLabel(shiftMonth(month, 1)) + ' →';
      }

      // ===== 集計表 =====
      function tallyOf(iso) {
        var t = { o: 0, t: 0, x: 0 };
        data.responses.forEach(function (r) {
          var v = r.answers[iso];
          if (v && t[v] !== undefined) t[v] += 1;
        });
        return t;
      }

      function isBlocked(iso) {
        return data.blocked.indexOf(iso) !== -1;
      }

      // ○=2点 / △=1点 で最高スコアの日を拾う（× が付いた日と開催不可日は除外）
      function bestDates() {
        if (!data.responses.length) return [];
        var top = -1;
        var winners = [];
        data.dates.forEach(function (iso) {
          if (isBlocked(iso)) return;
          var t = tallyOf(iso);
          if (t.x > 0) return;
          var score = t.o * 2 + t.t;
          if (score > top) { top = score; winners = [iso]; }
          else if (score === top) { winners.push(iso); }
        });
        return top > 0 ? winners : [];
      }

      function renderTable() {
        var table = $('grid');
        table.textContent = '';

        var thead = document.createElement('thead');
        var hr = document.createElement('tr');
        var thDate = document.createElement('th');
        thDate.className = 'date-cell';
        thDate.textContent = '日曜日';
        hr.appendChild(thDate);
        var thTally = document.createElement('th');
        thTally.textContent = '○ / △ / ×';
        hr.appendChild(thTally);
        data.responses.forEach(function (r) {
          var th = document.createElement('th');
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'name-btn';
          btn.textContent = r.name;
          btn.title = r.name + ' の回答を読み込む';
          btn.addEventListener('click', function () { loadResponseIntoForm(r); });
          th.appendChild(btn);
          hr.appendChild(th);
        });
        thead.appendChild(hr);
        table.appendChild(thead);

        // 確定してしまえば有力候補のハイライトは意味がないので出さない
        var best = data.decided ? [] : bestDates();
        var tbody = document.createElement('tbody');
        data.dates.forEach(function (iso) {
          var tr = document.createElement('tr');
          // 確定日 > 開催不可 > 有力候補 の順で見た目を決める
          if (iso === data.decided) tr.className = 'decided';
          else if (isBlocked(iso)) tr.className = 'blocked';
          else if (best.indexOf(iso) !== -1) tr.className = 'best';

          var dateTd = document.createElement('td');
          dateTd.className = 'date-cell';
          dateTd.textContent = fmtDate(iso);
          tr.appendChild(dateTd);

          var t = tallyOf(iso);
          var tallyTd = document.createElement('td');
          tallyTd.className = 'tally';
          [['o', t.o], ['t', t.t], ['x', t.x]].forEach(function (pair, i) {
            if (i > 0) tallyTd.appendChild(document.createTextNode(' / '));
            var span = document.createElement('span');
            span.className = 'mark-' + pair[0];
            span.textContent = MARKS[pair[0]] + pair[1];
            tallyTd.appendChild(span);
          });
          tr.appendChild(tallyTd);

          data.responses.forEach(function (r) {
            var td = document.createElement('td');
            var v = r.answers[iso];
            td.className = v ? 'mark-' + v : 'mark-none';
            td.textContent = v ? MARKS[v] : '－';
            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });
        table.appendChild(tbody);

        if (data.responses.length) {
          var tfoot = document.createElement('tfoot');
          var fr = document.createElement('tr');
          var label = document.createElement('td');
          label.className = 'date-cell';
          label.textContent = 'ひとこと';
          fr.appendChild(label);
          fr.appendChild(document.createElement('td'));
          data.responses.forEach(function (r) {
            var td = document.createElement('td');
            td.className = 'comment-cell';
            td.textContent = r.comment || '－';
            fr.appendChild(td);
          });
          tfoot.appendChild(fr);
          table.appendChild(tfoot);
        }
      }

      function renderBest() {
        var status = $('statusLine');
        status.hidden = !data.decided;
        if (data.decided) status.textContent = '開催日 ' + fmtDateLong(data.decided);

        var el = $('bestLine');
        el.className = 'best-line quiet';

        // 確定済みなら有力候補は出さず、回答数だけ添える
        if (data.decided) {
          el.textContent = data.responses.length ? '回答 ' + data.responses.length + '人' : 'まだ回答がありません';
          return;
        }
        if (!data.responses.length) {
          el.textContent = 'まだ回答がありません';
          return;
        }
        var best = bestDates();
        if (!best.length) {
          el.textContent = '全員が空いている日はまだありません';
          return;
        }
        el.className = 'best-line';
        el.textContent = '有力候補 ' + best.map(fmtDateLong).join(' ／ ')
          + '（回答 ' + data.responses.length + '人）';
      }

      // ===== 開催日の設定 =====
      function renderStatusEditor() {
        var sel = $('decidedSelect');
        sel.textContent = '';
        var none = document.createElement('option');
        none.value = '';
        none.textContent = '未定';
        sel.appendChild(none);
        data.dates.forEach(function (iso) {
          var opt = document.createElement('option');
          opt.value = iso;
          opt.textContent = fmtDateLong(iso);
          sel.appendChild(opt);
        });
        sel.value = data.decided || '';

        var box = $('blockChips');
        box.textContent = '';
        data.dates.forEach(function (iso) {
          var chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'block-chip';
          chip.dataset.iso = iso;
          chip.textContent = fmtDate(iso);
          chip.setAttribute('aria-pressed', isBlocked(iso) ? 'true' : 'false');
          chip.addEventListener('click', function () {
            var on = chip.getAttribute('aria-pressed') === 'true';
            chip.setAttribute('aria-pressed', on ? 'false' : 'true');
            saveStatus();
          });
          box.appendChild(chip);
        });
      }

      // 開催日 / 開催不可日を変更した時点で即保存する
      function saveStatus() {
        var decided = $('decidedSelect').value || null;
        var blocked = Array.prototype.filter.call(
          $('blockChips').children,
          function (chip) { return chip.getAttribute('aria-pressed') === 'true'; }
        ).map(function (chip) { return chip.dataset.iso; });

        api('/months/' + month + '/status', {
          method: 'PUT',
          body: { decided: decided, blocked: blocked }
        }).then(function (payload) {
          data = payload;
          renderAll();
          notice(data.decided ? '開催日を ' + fmtDateLong(data.decided) + ' に設定しました' : '開催日の設定を保存しました', false);
        }).catch(function (err) {
          notice(err.message);
        });
      }

      // ===== 回答フォーム =====
      function renderNameSelect() {
        var sel = $('ansName');
        var stored = '';
        try { stored = localStorage.getItem(STORE_KEY) || ''; } catch (e) { /* プライベートモード等 */ }
        var saved = editingId ? sel.value : stored;
        sel.textContent = '';

        var placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = '選んでください';
        sel.appendChild(placeholder);

        MEMBERS.forEach(function (name) {
          var opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          sel.appendChild(opt);
        });

        var other = document.createElement('option');
        other.value = OTHER;
        other.textContent = 'その他（自由入力）';
        sel.appendChild(other);

        if (saved === OTHER) {
          sel.value = OTHER;
        } else if (saved && MEMBERS.indexOf(saved) !== -1) {
          sel.value = saved;
        } else if (saved) {
          // 自由入力で登録した名前を復元する
          sel.value = OTHER;
          if (!$('ansCustomName').value) $('ansCustomName').value = saved;
        }
        syncCustomNameField();
      }

      function syncCustomNameField() {
        $('customNameField').hidden = $('ansName').value !== OTHER;
      }

      function selectedName() {
        var v = $('ansName').value;
        if (v === OTHER) return $('ansCustomName').value.trim();
        return v;
      }

      function renderAnswerRows() {
        var list = $('ansList');
        list.textContent = '';
        if (!data) return;
        data.dates.forEach(function (iso) {
          var blocked = isBlocked(iso);
          var decided = iso === data.decided;

          var row = document.createElement('div');
          row.className = 'answer-row' + (decided ? ' is-decided' : '') + (blocked ? ' is-blocked' : '');

          var d = document.createElement('span');
          d.className = 'd';
          d.textContent = fmtDateLong(iso);
          row.appendChild(d);

          if (decided || blocked) {
            var tag = document.createElement('span');
            tag.className = 'tag ' + (decided ? 'decided' : 'blocked');
            tag.textContent = decided ? '開催' : '開催不可';
            row.appendChild(tag);
          }

          var seg = document.createElement('div');
          seg.className = 'seg';
          ['o', 't', 'x'].forEach(function (v) {
            var b = document.createElement('button');
            b.type = 'button';
            b.dataset.v = v;
            b.textContent = MARKS[v];
            b.disabled = blocked;
            b.setAttribute('aria-label', fmtDateLong(iso) + ' ' + MARKS[v]);
            b.setAttribute('aria-pressed', answers[iso] === v ? 'true' : 'false');
            b.addEventListener('click', function () {
              answers[iso] = (answers[iso] === v) ? undefined : v;
              if (!answers[iso]) delete answers[iso];
              Array.prototype.forEach.call(seg.children, function (child) {
                child.setAttribute('aria-pressed', answers[iso] === child.dataset.v ? 'true' : 'false');
              });
            });
            seg.appendChild(b);
          });
          row.appendChild(seg);
          list.appendChild(row);
        });
      }

      // 前回この端末で登録した名前に回答があれば、開いた時点で読み込んでおく
      function autoLoadOwnResponse() {
        if (editingId) return;
        var name = selectedName();
        if (!name) return;
        var mine = data.responses.filter(function (r) { return r.name === name; })[0];
        if (mine) loadResponseIntoForm(mine, { scroll: false, rerender: false });
      }

      function loadResponseIntoForm(r, options) {
        var opts = options || {};
        editingId = r.id;
        answers = Object.assign({}, r.answers);
        if (MEMBERS.indexOf(r.name) !== -1) {
          $('ansName').value = r.name;
        } else {
          $('ansName').value = OTHER;
          $('ansCustomName').value = r.name;
        }
        syncCustomNameField();
        $('ansComment').value = r.comment || '';
        $('answerTitle').textContent = r.name + ' の回答を修正';
        $('submitAnswer').textContent = '更新する';
        $('deleteAnswer').hidden = false;
        $('resetAnswer').hidden = false;
        if (opts.rerender !== false) renderAnswerRows();
        if (opts.scroll !== false) $('ansList').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      function resetAnswerForm(skipRender) {
        editingId = null;
        answers = {};
        // 未回答者は最初から全部○の状態にしておく（開催不可日は除く）
        if (data) {
          data.dates.forEach(function (iso) { if (!isBlocked(iso)) answers[iso] = 'o'; });
        }
        $('ansComment').value = '';
        $('answerTitle').textContent = '出欠を入れる';
        $('submitAnswer').textContent = '登録する';
        $('deleteAnswer').hidden = true;
        $('resetAnswer').hidden = true;
        if (!skipRender) renderAnswerRows();
      }

      // 名前を選び直したとき、その人の既存回答があれば読み込む
      function onNameChanged() {
        syncCustomNameField();
        var name = selectedName();
        if (!name) return;
        var existing = data.responses.filter(function (r) { return r.name === name; })[0];
        if (existing) {
          loadResponseIntoForm(existing);
        } else if (editingId) {
          resetAnswerForm();
        }
      }

      // ===== イベントハンドラ =====
      $('prevMonth').addEventListener('click', function () { goto(shiftMonth(month, -1)); });
      $('nextMonth').addEventListener('click', function () { goto(shiftMonth(month, 1)); });

      $('ansName').addEventListener('change', onNameChanged);
      $('ansCustomName').addEventListener('blur', onNameChanged);
      $('resetAnswer').addEventListener('click', function () { resetAnswerForm(); });

      Array.prototype.forEach.call(document.querySelectorAll('[data-fill]'), function (btn) {
        btn.addEventListener('click', function () {
          if (!data) return;
          var v = btn.dataset.fill;
          // 開催不可の日は一括入力の対象外
          data.dates.forEach(function (iso) { if (!isBlocked(iso)) answers[iso] = v; });
          renderAnswerRows();
        });
      });

      $('submitAnswer').addEventListener('click', function () {
        var name = selectedName();
        if (!name) { notice('名前を選んでください'); return; }
        if (!Object.keys(answers).length) { notice('○ △ × をひとつ以上選んでください'); return; }

        var btn = this;
        btn.disabled = true;
        api('/months/' + month + '/responses', {
          method: 'POST',
          body: { name: name, answers: answers, comment: $('ansComment').value.trim() }
        }).then(function (payload) {
          btn.disabled = false;
          data = payload;
          try { localStorage.setItem(STORE_KEY, name); } catch (e) { /* noop */ }
          resetAnswerForm(true);
          renderAll();
          loadQuickMonths();
          notice(eventLabel(month) + ' の ' + name + ' の回答を保存しました', false);
        }).catch(function (err) {
          btn.disabled = false;
          notice(err.message);
        });
      });

      $('deleteAnswer').addEventListener('click', function () {
        if (!editingId) return;
        if (!confirm('この回答を削除します。よろしいですか？')) return;
        var btn = this;
        btn.disabled = true;
        api('/months/' + month + '/responses/' + editingId, { method: 'DELETE' })
          .then(function (payload) {
            btn.disabled = false;
            data = payload;
            resetAnswerForm(true);
            renderAll();
            loadQuickMonths();
            notice('回答を削除しました', false);
          }).catch(function (err) {
            btn.disabled = false;
            notice(err.message);
          });
      });

      $('decidedSelect').addEventListener('change', saveStatus);

      window.addEventListener('popstate', function () { load(monthFromUrl()); });

      // ===== 起動 =====
      // 常に翌月を開く（URL の m パラメータは月移動時の履歴用としてのみ使う）
      goto(shiftMonth(ymOf(new Date()), 1), true);
    })();
  </script>
</body>

</html>
