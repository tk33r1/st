<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 背景グラデーション（ディープネイビー〜ロイヤルブルー〜マゼンタ） -->
    <linearGradient id="rtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2a6d" />
      <stop offset="55%" stop-color="#124bda" />
      <stop offset="100%" stop-color="#9a1b80" />
    </linearGradient>

    <!-- シグナル発光グラデーション（エレクトリックシアン〜ネオンピンク） -->
    <linearGradient id="rtSignal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ff33aa" />
    </linearGradient>

    <!-- 柔らかなグローフィルター -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#124bda" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- アイコンベース（角丸コンテナ） -->
  <rect width="64" height="64" rx="15" fill="url(#rtBg)" />

  <!-- 繊細なインナーボーダーハイライト -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.2" />

  <!-- スマートカート本体（ホワイトソリッド＆クリーンライン） -->
  <g filter="url(#glow)">
    <!-- カートフレーム＆バスケット（左下寄り配置） -->
    <path d="M12 26 h5 l5 16 h17 l4 -11 h-23" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- カート前輪・後輪 -->
    <circle cx="24" cy="47" r="3" fill="#ffffff" />
    <circle cx="38" cy="47" r="3" fill="#ffffff" />

    <!-- 厳密な幾何学同心円のWi-Fiシグナル（中心 40, 26 / 角度 15°〜75°） -->
    <!-- 基点ドット -->
    <circle cx="40" cy="26" r="2.2" fill="url(#rtSignal)" />
    <!-- 内側アーク (R=7) -->
    <path d="M 41.8 19.2 A 7 7 0 0 1 46.8 24.2" 
          fill="none" 
          stroke="url(#rtSignal)" 
          stroke-width="2.8" 
          stroke-linecap="round" />
    <!-- 外側アーク (R=12) -->
    <path d="M 43.1 14.4 A 12 12 0 0 1 51.6 22.9" 
          fill="none" 
          stroke="url(#rtSignal)" 
          stroke-width="2.8" 
          stroke-linecap="round" />
  </g>
</svg>
