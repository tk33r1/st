<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- ニトリカラーグラデーション（ディープエメラルド〜ニトリカラー〜フレッシュミント） -->
    <linearGradient id="ntBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006b66" />
      <stop offset="55%" stop-color="#009e96" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- 柔らかなグローフィルター -->
    <filter id="ntGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#004d49" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- アイコンベース（角丸コンテナ） -->
  <rect width="64" height="64" rx="15" fill="url(#ntBg)" />

  <!-- 繊細なインナーボーダーハイライト -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1.2" />

  <!-- 住まいのルーフ（屋根）＋ ニトリの「N」モノグラム -->
  <g filter="url(#ntGlow)">
    <!-- ルーフ（屋根）ライン -->
    <path d="M13 26 L32 13 L51 26" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3.8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- ボールド N（ニトリの象徴） -->
    <path d="M21 48 V27 L43 48 V27" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3.8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
