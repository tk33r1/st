name               = "tk-st-dj-request"
main               = "src/index.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding       = "DB"
database_name = "dj-request-db"
database_id   = "a2dad8cb-040e-4ef9-96cc-2659e7a83bd2"

# dj-schedule が tk.st/dj/api/schedule/* を使うので、こちらは req/* に固定する。
# Cloudflare は route の重複を許さないため、両者は必ず別の接頭辞にすること。
[[routes]]
pattern   = "tk.st/dj/api/req/*"
zone_name = "tk.st"

# secret は wrangler secret put で設定する（コミットしない）:
#   wrangler secret put IP_SALT    … IP ハッシュのソルト
#   wrangler secret put SONGBPM_KEY … GetSongBPM の API キー（BPM・キーの取得）
#   wrangler secret put OPENAI_API_KEY … 曲の背景カード（Web 検索付き）。未設定ならカードを作らない
#   wrangler secret put TYPESAFE_API_KEY … NEXTの音楽評価（Jev）。ローカルは.dev.varsでもよい
#
# モデルIDは config/ai-models.json の openai.luna / typesafe.jev を import する。正本が変わったら再デプロイする。
