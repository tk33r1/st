name               = "tk-st-auth"
main               = "src/index.js"
compatibility_date = "2025-01-01"

# ベーシック認証をかけたいパスを routes に追加してください
# パターンの書き方: https://developers.cloudflare.com/workers/configuration/routing/routes/
routes = [
  { pattern = "tk.st/bitcoinyen/bbm/*", zone_name = "tk.st" },
  # DJ ブースコンソール。ページ自体をベーシック認証で守る
  # （API 側は別途 x-admin-key を要求する二重構え）
  { pattern = "tk.st/dj/booth/*", zone_name = "tk.st" },
  # 追加したいページがあれば下に行を足してください
  # { pattern = "example.tk.st/secret/*", zone_name = "tk.st" },
]
