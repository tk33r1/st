name: MAGI Daily Automation

# main側で判定し、PRコードの検証ジョブにはsecretを渡さない。
# 段階2でも正式なレビュー取得経路が未設定ならマージしない。
# 主な起動はコメント。依頼・レビュー結果・本人の印が付いたらすぐ判定する。
# issue_commentもmain側のファイルで動き、コメントの文面は読まない（状態はAPIから読み直す）。
# 定時は取りこぼしとmainの変化・期限の保険。報告ジョブのコメント（GITHUB_TOKEN）は起動しない。
on:
  schedule:
    - cron: '43 */4 * * *'
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read

# 対象外のコメントの実行は別のgroupに置く（待機中の本来の実行を取り消させない）。条件はdiscoverのifと同じ。
concurrency:
  group: ${{ (github.event_name != 'issue_comment' || ((github.event.comment.user.login == (vars.MAGI2_DAILY_ACTOR || 'tk33r1') || github.event.comment.user.login == format('{0}[bot]', vars.MAGI2_DAILY_REVIEW_APP)) && (github.event.issue.pull_request || github.event.issue.number == vars.MAGI2_DAILY_ISSUE))) && 'magi2-daily-merge' || format('magi2-daily-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  discover:
    if: >-
      github.ref == 'refs/heads/main' && vars.MAGI2_DAILY_ISSUE != '' &&
      (github.event_name != 'issue_comment' || ((github.event.comment.user.login == (vars.MAGI2_DAILY_ACTOR || 'tk33r1') || github.event.comment.user.login == format('{0}[bot]', vars.MAGI2_DAILY_REVIEW_APP)) && (github.event.issue.pull_request || github.event.issue.number == vars.MAGI2_DAILY_ISSUE)))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      snapshot: ${{ steps.snapshot.outputs.snapshot }}
      validate: ${{ steps.snapshot.outputs.validate }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Fetch candidate refs without persisting credentials
        run: |
          # 公開リポジトリなのでgitのfetchは認証不要。PRのコードは取り出さずgitオブジェクトとして読む。
          git remote set-url origin https://github.com/tk33r1/st.git
      - name: Inspect trusted diff
        id: snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAGI2_DAILY_ACTOR: ${{ vars.MAGI2_DAILY_ACTOR }}
        run: node .github/scripts/magi2-daily-control.mjs --discover --output "$RUNNER_TEMP/snapshot.json"

  validate:
    needs: discover
    if: needs.discover.outputs.validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.discover.outputs.snapshot).head }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: trusted/.node-version
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Integrate the recorded main without running hooks
        working-directory: candidate
        env:
          DAILY_BASE: ${{ fromJSON(needs.discover.outputs.snapshot).base }}
        run: |
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c user.name=validation -c user.email=validation@example.invalid merge --no-commit --no-ff "$DAILY_BASE"
      - name: Install verification dependencies
        working-directory: candidate
        run: |
          npm --prefix workers ci --no-audit --no-fund
          npm --prefix .github/scripts ci --no-audit --no-fund
          .github/scripts/node_modules/.bin/playwright install --with-deps chromium
      - name: Run the trusted full checker
        working-directory: candidate
        env:
          DAILY_BASE: ${{ fromJSON(needs.discover.outputs.snapshot).base }}
          DAILY_HEAD: ${{ fromJSON(needs.discover.outputs.snapshot).head }}
        run: node ../trusted/.github/scripts/magi2-daily-check.mjs --full --root "$PWD" --base "$DAILY_BASE" --head "$DAILY_HEAD"

  report:
    needs: [discover, validate]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Report using main code and only the validation job result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAGI2_DAILY_ACTOR: ${{ vars.MAGI2_DAILY_ACTOR }}
          MAGI2_DAILY_ISSUE: ${{ vars.MAGI2_DAILY_ISSUE }}
          MAGI2_DAILY_STAGE: ${{ vars.MAGI2_DAILY_STAGE }}
          MAGI2_DAILY_REVIEW_APP: ${{ vars.MAGI2_DAILY_REVIEW_APP }}
          MAGI2_DAILY_REVIEW_TRIAL: ${{ vars.MAGI2_DAILY_REVIEW_TRIAL }}
          DAILY_SNAPSHOT: ${{ needs.discover.outputs.snapshot }}
          DAILY_VALIDATION: ${{ needs.validate.result }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: node .github/scripts/magi2-daily-control.mjs --report

  merge:
    needs: [discover, validate, report]
    if: vars.MAGI2_DAILY_STAGE == '2' && needs.validate.result == 'success' && needs.report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: read
    outputs:
      merge: ${{ steps.merge.outputs.merge }}
      merged: ${{ steps.merge.outputs.merged }}
      attempted: ${{ steps.merge.outputs.attempted }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Recompute review and recheck live settings, halt, head and base
        id: merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAGI2_DAILY_ACTOR: ${{ vars.MAGI2_DAILY_ACTOR }}
          MAGI2_DAILY_ISSUE: ${{ vars.MAGI2_DAILY_ISSUE }}
          MAGI2_DAILY_REVIEW_APP: ${{ vars.MAGI2_DAILY_REVIEW_APP }}
          MAGI2_DAILY_REVIEW_TRIAL: ${{ vars.MAGI2_DAILY_REVIEW_TRIAL }}
          DAILY_SNAPSHOT: ${{ needs.discover.outputs.snapshot }}
          DAILY_VALIDATION: ${{ needs.validate.result }}
        run: node .github/scripts/magi2-daily-merge.mjs

  prepare:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      action: ${{ steps.plan.outputs.action }}
      target: ${{ steps.plan.outputs.target }}
      previous-id: ${{ steps.plan.outputs.previous-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Read production version and prepare exact merged target without executing it
        id: plan
        env:
          DAILY_MERGE: ${{ needs.merge.outputs.merge }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/magi2-daily-release-run.mjs --prepare

  worker:
    needs: prepare
    if: needs.prepare.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.target }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install verification dependencies
        working-directory: candidate
        run: npm --prefix workers ci --no-audit --no-fund
      - name: Verify the pinned merged Worker without credentials
        working-directory: candidate
        run: node ../trusted/.github/scripts/magi2-daily-check.mjs --worker --root "$PWD"

  deploy:
    needs: [prepare, worker]
    if: needs.prepare.outputs.action == 'deploy' && needs.worker.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-worker-core.yml
    with:
      worker: magi2
      sha: ${{ needs.prepare.outputs.target }}
      expected-version-id: ${{ needs.prepare.outputs.previous-id }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  publication:
    needs: [prepare, deploy]
    if: needs.deploy.result == 'success' && needs.deploy.outputs.version-id != ''
    permissions:
      contents: read
    uses: ./.github/workflows/magi2-daily-publication.yml
    with:
      target-sha: ${{ needs.prepare.outputs.target }}
      version-id: ${{ needs.deploy.outputs.version-id }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  finish:
    needs: [merge, prepare, worker, deploy, publication]
    if: always() && needs.merge.outputs.attempted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install trusted recovery tooling
        if: needs.deploy.outputs.version-id != '' && needs.publication.result != 'success'
        run: npm --prefix workers ci --no-audit --no-fund
      - name: Finish, recover if necessary, keep halt and notify
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAGI2_DAILY_ISSUE: ${{ vars.MAGI2_DAILY_ISSUE }}
          DAILY_MERGE: ${{ needs.merge.outputs.merge }}
          DAILY_RELEASE: ${{ needs.prepare.outputs.release }}
          DAILY_RESULTS: ${{ toJSON(needs) }}
          DAILY_REPORT: ${{ runner.temp }}/magi2-daily-release.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: node .github/scripts/magi2-daily-release-run.mjs --finish
      - name: Preserve status-only recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: magi2-daily-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/magi2-daily-release.json
          if-no-files-found: ignore
          retention-days: 7
