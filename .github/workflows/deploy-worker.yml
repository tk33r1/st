name: Deploy Worker

# Cloudflare Workers を GitHub の Actions 画面から手動でデプロイする（手元に wrangler の環境が無くても出せるように）。
# push では動かさない（Worker は従来どおり、出すと決めたときだけ出す）。
#
# リポジトリ Secrets に次の2つを置く:
#   CLOUDFLARE_API_TOKEN  … Cloudflare の API トークン（テンプレート「Edit Cloudflare Workers」で作る。ルートを持つ
#                           Worker があるので、ゾーン tk.st の Workers Routes の編集権限も要る）
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare のアカウント ID
# dj-request の DB 更新には Account > D1 > Edit も追加する（上記テンプレートには含まれない）。
# Worker の既存 secret は維持する。magi2 の Anthropicキーと、dj-request の任意の TYPESAFE_API_KEY を同期する。
# dry-run は Secrets なしで動く（バンドルできるかだけ確かめる）。

on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'デプロイする Worker（workers/ の下のフォルダ名）'
        required: true
        type: choice
        options:
          - dj-request
          - dj-schedule
          - dj-offer
          - comments
          - magi
          - magi2
          - games
      dry-run:
        description: 'バンドルできるかだけ確かめ、デプロイしない'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# 同じ Worker のデプロイを重ねない（後から押したほうを待たせる）
concurrency:
  group: deploy-worker-${{ inputs.worker }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-worker-core.yml
    with:
      worker: ${{ inputs.worker }}
      dry-run: ${{ inputs.dry-run }}
      sha: ${{ github.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
