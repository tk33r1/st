name: Deploy Worker Core

# 本人の手動公開と、後の自動公開で共用する。対象は確定したコミットに固定する。
on:
  workflow_call:
    inputs:
      worker:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
      sha:
        required: true
        type: string
      expected-version-id:
        description: 'magi2の公開前に照合する本番版ID。日次の呼び出し側が記録した値'
        required: false
        type: string
        default: ''
    outputs:
      version-id:
        description: 'magi2を実際に公開した版ID。dry-runと他Workerでは空'
        value: ${{ jobs.deploy.outputs.version-id }}
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      TYPESAFE_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  magi-chat-check:
    if: inputs.worker == 'magi2'
    uses: ./.github/workflows/magi-chat-validation.yml
    with:
      sha: ${{ inputs.sha }}

  deploy:
    needs: [magi-chat-check]
    if: always() && (needs.magi-chat-check.result == 'success' || needs.magi-chat-check.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      version-id: ${{ steps.published.outputs.version-id }}
    steps:
    - name: Validate the pinned target
      env:
        DEPLOY_SHA: ${{ inputs.sha }}
        WORKER: ${{ inputs.worker }}
        EXPECTED_VERSION_ID: ${{ inputs.expected-version-id }}
      run: |
        [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::A full commit SHA is required'; exit 1; }
        [[ "$WORKER" =~ ^[a-z][a-z0-9-]*$ ]] || { echo '::error::Invalid Worker name'; exit 1; }
        if [ -n "$EXPECTED_VERSION_ID" ]; then
          [[ "$WORKER" == magi2 && "$EXPECTED_VERSION_ID" =~ ^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$ ]] || { echo '::error::Invalid expected MAGI version ID'; exit 1; }
        fi
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.sha }}
        persist-credentials: false
    # 許可する一覧は呼び出し側のコミット（手動なら選んだコミット、自動公開ならmain）から読む。
    # 公開対象のコミットが自分で一覧を広げられないよう、対象のcheckoutとは分ける。
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: .deploy-caller
        sparse-checkout: |
          .github/workflows/deploy-worker.yml
          .github/scripts/magi2-daily-cloudflare.mjs
          .github/scripts/magi2-daily-deploy-worker.mjs
          .github/scripts/magi2-daily-http.mjs
          workers/magi2/wrangler.toml
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
    # 手動選択肢を唯一の一覧として使う。workflow_callの任意文字列も同じ一覧で検査する。
    - name: Validate Worker against dispatch options
      env:
        WORKER: ${{ inputs.worker }}
        OPTIONS_FILE: .deploy-caller/.github/workflows/deploy-worker.yml
      run: |
        node --input-type=module <<'JS'
        import {readFileSync} from 'node:fs';
        const workflow=readFileSync(process.env.OPTIONS_FILE,'utf8');
        const options=workflow.match(/^        options:\n((?:          - [a-z][a-z0-9-]*\n)+)/m)?.[1]
          .trim().split('\n').map(line=>line.trim().slice(2));
        if(!options?.includes(process.env.WORKER)) {
          console.error('::error::Worker must be listed in deploy-worker.yml dispatch options');
          process.exit(1);
        }
        JS

    # wrangler は全 Worker 共通で workers/package.json に入れてある
    - name: Install wrangler
      working-directory: workers
      run: npm ci --no-audit --no-fund

    - name: Validate Cloudflare credentials
      if: ${{ !inputs.dry-run }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "::error::リポジトリ Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録してください"
          exit 1
        fi

    # DB更新が通ってからキーを設定する。権限不足なら既存のキーを変更せず止める。
    # dry-runでは本番を変更しない。
    - name: Prepare DJ NEXT
      if: ${{ inputs.worker == 'dj-request' && !inputs.dry-run }}
      working-directory: workers
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      run: |
        if ! npx wrangler d1 execute dj-request-db --remote --config dj-request/wrangler.toml --file dj-request/migrations/0008_transition_scores.sql; then
          echo "::error::DJ NEXTのDB更新に失敗しました。CLOUDFLARE_API_TOKEN に Account > D1 > Edit があるか確認し、上のエラーを解消して再実行してください"
          exit 1
        fi
        if [ -n "$TYPESAFE_API_KEY" ]; then
          printf '%s' "$TYPESAFE_API_KEY" | npx wrangler secret put TYPESAFE_API_KEY --config dj-request/wrangler.toml
        fi

    # AIの回数表を先に用意する。ランキングの既存データには触れない。
    - name: Prepare game AI limits
      if: ${{ inputs.worker == 'games' && !inputs.dry-run }}
      working-directory: workers
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: npx wrangler d1 execute st-games-ranking-db --remote --config games/wrangler.toml --file games/migrations/0001_ai_rate_limits.sql

    # 条件付き移行の採用後だけ同期する。評価前のopenai設定では既存のキーを触らない。
    - name: Prepare auxiliary Anthropic
      if: ${{ (inputs.worker == 'games' || inputs.worker == 'dj-request') && !inputs.dry-run }}
      working-directory: workers
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        WORKER: ${{ inputs.worker }}
      run: |
        if ! grep -Eq '^(GAME|SONG_INFO)_AI_PROVIDER = "anthropic"' "$WORKER/wrangler.toml"; then exit 0; fi
        if [ -z "$ANTHROPIC_API_KEY" ]; then
          echo "::error::ANTHROPIC_API_KEY が未設定のため、モデル移行を止めます"
          exit 1
        fi
        KEY_NAME=ANTHROPIC_API_KEY
        if [ "$WORKER" = "games" ]; then KEY_NAME=GAME_ANTHROPIC_API_KEY; fi
        printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put "$KEY_NAME" --config "$WORKER/wrangler.toml"

    - name: Deploy
      working-directory: workers
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        WORKER: ${{ inputs.worker }}
        DRY_RUN: ${{ inputs.dry-run }}
        DEPLOY_SHA: ${{ inputs.sha }}
        EXPECTED_VERSION_ID: ${{ inputs.expected-version-id }}
        ANTHROPIC_API_KEY: ${{ inputs.worker == 'magi2' && secrets.ANTHROPIC_API_KEY || '' }}
        WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/worker-deployment.jsonl
      run: |
        if [ "$DRY_RUN" = "true" ]; then
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle" --config "$WORKER/wrangler.toml"
          exit 0
        fi
        if [ "$WORKER" = magi2 ]; then
          node ../.deploy-caller/.github/scripts/magi2-daily-deploy-worker.mjs
        else
          npx wrangler deploy --config "$WORKER/wrangler.toml" --message "$DEPLOY_SHA"
        fi

    - name: Capture the published MAGI version from structured Wrangler output
      id: published
      if: ${{ inputs.worker == 'magi2' && !inputs.dry-run }}
      run: node .deploy-caller/.github/scripts/magi2-daily-cloudflare.mjs --published --file "$RUNNER_TEMP/worker-deployment.jsonl"
