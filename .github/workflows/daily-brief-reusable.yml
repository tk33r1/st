name: Daily Brief Generator

on:
  workflow_call:
    inputs:
      media:
        description: 'retailtechdaily or nitoridaily'
        required: true
        type: string
      target-date:
        description: 'Target issue date in YYYYMMDD format'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  BOT_EMAIL: "github-actions[bot]@users.noreply.github.com"

jobs:
  generate-news:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow
    # OGP カードは Chrome でレンダリングするので、日本語フォントが無いと豆腐になる
    - name: Install Japanese fonts
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
        fc-cache -f > /dev/null

    - name: Generate daily brief
      env:
        MEDIA: ${{ inputs.media }}
        TARGET_DATE: ${{ inputs.target-date }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        case "$MEDIA" in
          retailtechdaily)
            python .github/scripts/generate-retail-tech-daily.py --date "$TARGET_DATE"
            ;;
          nitoridaily)
            python .github/scripts/generate-nitori-daily.py --date "$TARGET_DATE"
            ;;
          *)
            echo "Unsupported media: $MEDIA" >&2
            exit 1
            ;;
        esac

    # push はサイトマップと一緒に後ろでまとめて行う。ここではコミットと取り込みだけ。
    - name: Commit generated issue
      env:
        MEDIA: ${{ inputs.media }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "$BOT_EMAIL"
        case "$MEDIA" in
          retailtechdaily)
            git add job/retailtechdaily/ data/retail-tech-daily.json images/ogp/
            commit_message="Auto-generate retail tech daily"
            ;;
          nitoridaily)
            git add job/nitoridaily/ data/nitori-daily.json images/ogp/
            commit_message="Auto-generate nitori daily"
            ;;
        esac
        git commit -m "$commit_message" || true
        git pull --rebase -X ours origin main || (git rebase --abort && git pull -s recursive -X ours origin main)

    # 新しい号をサイトマップに載せ、号と同じ push で公開する。
    # GITHUB_TOKEN の push は sitemap.yml を起動しないうえ、sitemap.yml のコミットは
    # [skip ci] で Pages がビルドしないため、任せると号が載るのが手動の push 2回あとになる。
    # 手順は sitemap.yml と同じ（号のコミット後に走らせるのは、lastmod を git の日時から引くため）。
    - name: Sync JSON-LD dateModified with commit dates
      run: python .github/scripts/update-modified.py

    - name: Generate Sitemap
      uses: cicirello/generate-sitemap@v1
      with:
        base-url-path: https://tk.st/

    # 先頭のコミットに [skip ci] を付けない（付けると Pages がこの push をビルドしない）
    - name: Commit sitemap and push
      run: |
        git add sitemap.xml robots.txt
        git add -u -- '*.html'   # update-modified.py が書き換えた HTML だけ（生成物の他の差分は拾わない）
        git commit -m "Update sitemap for new daily issue" || true
        if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
          echo "push するコミットがない"
          exit 0
        fi
        bash .github/scripts/push-with-retry.sh

    # RSS の更新を WebSub の hub へ知らせる（Google に新しい号を取りに来てもらう）。
    # 公開反映を待つので、後ろの X ポストはここで待たずに済む。失敗しても止めない。
    - name: Notify WebSub hub
      env:
        MEDIA: ${{ inputs.media }}
      run: python .github/scripts/websub-ping.py --media "$MEDIA"

    # 号ページの公開反映を待ってから公式 X へポストし、投稿 ID を号の JSON に記録する
    - name: Post to X
      env:
        MEDIA: ${{ inputs.media }}
        TARGET_DATE: ${{ inputs.target-date }}
        X_NITORIDAILY_CONSUMER_KEY: ${{ secrets.X_NITORIDAILY_CONSUMER_KEY }}
        X_NITORIDAILY_CONSUMER_SECRET: ${{ secrets.X_NITORIDAILY_CONSUMER_SECRET }}
        X_NITORIDAILY_ACCESS_TOKEN: ${{ secrets.X_NITORIDAILY_ACCESS_TOKEN }}
        X_NITORIDAILY_ACCESS_TOKEN_SECRET: ${{ secrets.X_NITORIDAILY_ACCESS_TOKEN_SECRET }}
        X_RETAILTECHDAILY_CONSUMER_KEY: ${{ secrets.X_RETAILTECHDAILY_CONSUMER_KEY }}
        X_RETAILTECHDAILY_CONSUMER_SECRET: ${{ secrets.X_RETAILTECHDAILY_CONSUMER_SECRET }}
        X_RETAILTECHDAILY_ACCESS_TOKEN: ${{ secrets.X_RETAILTECHDAILY_ACCESS_TOKEN }}
        X_RETAILTECHDAILY_ACCESS_TOKEN_SECRET: ${{ secrets.X_RETAILTECHDAILY_ACCESS_TOKEN_SECRET }}
      run: |
        if [ -n "$TARGET_DATE" ]; then
          python .github/scripts/post-to-x.py --media "$MEDIA" --date "$TARGET_DATE"
        else
          python .github/scripts/post-to-x.py --media "$MEDIA"
        fi
        git config --global user.name "github-actions[bot]"
        git config --global user.email "$BOT_EMAIL"
        git add data/nitori-daily.json data/retail-tech-daily.json
        git commit -m "Record X post [skip ci]" || exit 0
        git pull --rebase -X ours origin main || (git rebase --abort && git pull -s recursive -X ours origin main)
        git push origin HEAD:main
