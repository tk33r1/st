name: AI Model Registry Check

on:
  push:
    paths: ['config/**', '.github/**', 'workers/**']
  pull_request:
    paths: ['config/**', '.github/**', 'workers/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check AI model registry
      run: python .github/scripts/ai_models.py check

    - name: Set up Node for MAGI smoke configuration
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Check MAGI smoke request parity
      run: python .github/scripts/test-magi-smoke.py
