name: MAGI Persona Context

# 人格カード（data/magi-context.json）を、元ページが変わったときだけ作り直す。
# 起動は push のたび。素材の一覧は magi-context.py の PERSONAS だけが持ち、LLM を呼ぶか
# どうかも人格ごとのハッシュで決めるので、素材が変わっていなければ API 呼び出しは 0 回で終わる
# （paths で絞ると素材の一覧が2か所に分かれ、足し忘れた素材の更新が黙って無視されるため絞らない）。
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force:
        description: '全人格を、前回のカードを参照せずゼロから作り直す'
        type: boolean
        default: false

permissions:
  contents: write

# 連続 push で同時に走ると、同じ JSON を奪い合って push が弾かれる
concurrency:
  group: magi-context
  cancel-in-progress: false

env:
  BOT_EMAIL: "github-actions[bot]@users.noreply.github.com"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # 起動したコミットではなく main の最新を取る。順番待ちしていた実行が、前の実行の
        # 生成結果を知らない古い JSON から始めると、同じ人格を二重に要約した末に rebase で衝突する
        ref: main

    - name: Generate persona cards
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_MODEL: 'gpt-5.6-luna'
      run: python3 .github/scripts/magi-context.py ${{ inputs.force && '--force' || '' }}

    - name: Commit and push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "$BOT_EMAIL"
        git add data/magi-context.json
        # CI を止める印はコミットメッセージに入れない。Cloudflare Pages はその印（メッセージの
        # どこにあっても）のコミットをビルドせず、JSON が次の push まで公開されなくなる。
        # GITHUB_TOKEN の push はほかの workflow を起動しないので、付けなくてもループはしない
        git commit -m "Auto-generated MAGI persona context" || exit 0
        # 同じ push で sitemap.yml も main にコミットしてくるので、取り込んでから push する。
        # 取り込んだ直後に相手が先に push すると弾かれるので、取り込みからやり直す（負けると
        # 生成したカードがコミットされず、次の push でもう一度要約の料金がかかる）
        for i in 1 2 3 4; do
          git pull --rebase origin main && git push origin HEAD:main && exit 0
          git rebase --abort 2>/dev/null || true
          sleep $((i * 5))
        done
        echo "push に4回失敗した" >&2
        exit 1
