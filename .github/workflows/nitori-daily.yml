name: Daily Nitori Brief

on:
  schedule:
    # 毎朝 02:05 JST（前日 17:05 UTC）に実行（retail-tech-daily との競合防止）
    # TikTok の収集は前日 14:00 の nitori-tiktok-fetch.yml が済ませており、
    # ここではそのスナップショットを読むだけなので所要時間は従来どおり
    - cron: '5 17 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target issue date (YYYYMMDD). Leave empty for today JST.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: nitori-daily
  cancel-in-progress: false

jobs:
  generate-news:
    uses: ./.github/workflows/daily-brief-reusable.yml
    with:
      media: nitoridaily
      target-date: ${{ github.event.inputs.date || '' }}
    secrets: inherit
