name: MAGI X Posts

# 本人（@Tah_Keh）の X の投稿を、MAGI の人格カードの素材として取り込む（.github/scripts/magi-x-posts.py）。
#   check: 本人として認証できるかだけを確かめる
#   fetch: 前回より新しい投稿を読み、.github/magi/x-posts.json に足してコミットする
# 定期実行は、取り込んだ中身と費用を確かめてから足す。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '実行内容'
        type: choice
        options: [check, fetch]
        default: check

permissions:
  contents: write

concurrency:
  group: magi-x-posts
  cancel-in-progress: false

env:
  BOT_EMAIL: "github-actions[bot]@users.noreply.github.com"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Run
      env:
        X_TAHKEH_ACCESS_TOKEN: ${{ secrets.X_TAHKEH_ACCESS_TOKEN }}
        X_TAHKEH_ACCESS_TOKEN_SECRET: ${{ secrets.X_TAHKEH_ACCESS_TOKEN_SECRET }}
        X_TAHKEH_CONSUMER_KEY: ${{ secrets.X_TAHKEH_CONSUMER_KEY }}
        X_TAHKEH_CONSUMER_SECRET: ${{ secrets.X_TAHKEH_CONSUMER_SECRET }}
        X_NITORIDAILY_CONSUMER_KEY: ${{ secrets.X_NITORIDAILY_CONSUMER_KEY }}
        X_NITORIDAILY_CONSUMER_SECRET: ${{ secrets.X_NITORIDAILY_CONSUMER_SECRET }}
        X_RETAILTECHDAILY_CONSUMER_KEY: ${{ secrets.X_RETAILTECHDAILY_CONSUMER_KEY }}
        X_RETAILTECHDAILY_CONSUMER_SECRET: ${{ secrets.X_RETAILTECHDAILY_CONSUMER_SECRET }}
      run: python3 .github/scripts/magi-x-posts.py --${{ inputs.mode }}

    - name: Commit and push
      if: ${{ inputs.mode == 'fetch' }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "$BOT_EMAIL"
        git add .github/magi/x-posts.json
        git commit -m "Update MAGI X posts" || exit 0
        bash .github/scripts/push-with-retry.sh
