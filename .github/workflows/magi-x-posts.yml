name: MAGI X Posts

# 本人（@Tah_Keh）の X を、MAGI の人格カードの素材として取り込む（.github/scripts/magi-x-posts.py）。
#   check:     本人として認証できるかだけを確かめる
#   fetch:     前回より新しい投稿を読み、.github/magi/x-posts.json に足す（週1回の定期実行もこれ）
#   recheck:   直近 days 日（既定60日）を読み直し、X で消した投稿をファイルからも落とす（月1回の定期実行。1回 数セント）。
#              新しい投稿もこれで入る。git の履歴には残るので、完全に消すには履歴の書き換えが要る。
#              画像の説明の付け方を変えて付け直すときは、x-posts.json の enriched を外してから days=365 で手動実行する
# 取り込んだ投稿には、AI で画像の説明（1枚1行）と返信・引用の相手の投稿の要約を付ける。相手の本文と画像は保存しない
#   interests: いいねとフォローを読み、関心を分野ごとに要約して .github/magi/x-interests.json に書く
#              （生のデータは保存しない。全件を読み直すので数ドルかかる。数か月に1回の手動実行で十分）
# fetch・recheck・interests で素材が変わったら、コミットしてから magi-context.yml に人格カードの作り直しを頼む。
# bot（GITHUB_TOKEN）の push はほかの workflow を起動しないが、workflow_dispatch での起動はできる。
# magi-context.json を書くのを magi-context.yml だけにして、書き手どうしの衝突を起こさないため。
# 費用は本人の読み取りの単価（$0.001／件）。X API の残高から引かれる。
on:
  schedule:
    - cron: '0 18 * * 0'   # 毎週月曜 03:00 JST（fetch）
    - cron: '30 18 1 * *'  # 毎月2日 03:30 JST（recheck）
  workflow_dispatch:
    inputs:
      mode:
        description: '実行内容'
        type: choice
        options: [check, fetch, recheck, interests]
        default: check
      days:
        description: 'recheck で読み直す日数（空なら既定の60日。ほかのモードでは使わない）'
        type: string
        default: ''

permissions:
  contents: write
  actions: write   # magi-context.yml の起動

# workflow をまたいだ組の共有はしない（待機中の実行が新しい実行に黙ってキャンセルされるため。AGENTS.md）
concurrency:
  group: magi-x-posts
  cancel-in-progress: false

env:
  BOT_EMAIL: "github-actions[bot]@users.noreply.github.com"
  MODE: ${{ inputs.mode || (github.event.schedule == '30 18 1 * *' && 'recheck' || 'fetch') }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Read X
      env:
        X_TAHKEH_ACCESS_TOKEN: ${{ secrets.X_TAHKEH_ACCESS_TOKEN }}
        X_TAHKEH_ACCESS_TOKEN_SECRET: ${{ secrets.X_TAHKEH_ACCESS_TOKEN_SECRET }}
        X_TAHKEH_CONSUMER_KEY: ${{ secrets.X_TAHKEH_CONSUMER_KEY }}
        X_TAHKEH_CONSUMER_SECRET: ${{ secrets.X_TAHKEH_CONSUMER_SECRET }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        DAYS: ${{ inputs.days }}
      # 日数は recheck で指定があるときだけ渡す（既定は magi-x-posts.py の RECHECK_DAYS の1か所）
      run: |
        args="--$MODE"
        if [ "$MODE" = recheck ] && [ -n "$DAYS" ]; then args="$args --days $DAYS"; fi
        python3 .github/scripts/magi-x-posts.py $args

    # .github/magi/ を書くのはこの workflow だけなので、取り込みで衝突しない。変わらなければ何もしない
    - name: Commit X sources and rebuild persona cards
      if: ${{ env.MODE != 'check' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "$BOT_EMAIL"
        git add .github/magi/
        git commit -m "Update MAGI X sources" || exit 0
        bash .github/scripts/push-with-retry.sh
        gh workflow run magi-context.yml --ref main
