name: MAGI 7.21 publication

# この公開専用ブランチでだけ既存の検査・デプロイを呼ぶ。Web公開前に削除する。
on:
  push:
    branches: [release/magi-7-21]

permissions:
  contents: read

concurrency:
  group: magi-7-21-publication
  cancel-in-progress: false

jobs:
  worker:
    uses: ./.github/workflows/deploy-worker-core.yml
    with:
      worker: magi2
      dry-run: false
      sha: ${{ github.sha }}
    secrets: inherit

  verify-worker:
    needs: worker
    runs-on: ubuntu-latest
    steps:
      - name: Verify full history and legacy compatibility without calling AI
        run: |
          python3 - <<'PY'
          import json, urllib.request
          def load(query):
              request = urllib.request.Request('https://workers.tk.st/magi2/versions' + query, headers={'Origin': 'https://tk.st'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)['versions']
          rows = load('?format=3')
          names = {row['version'] for row in rows}
          assert len(rows) > 60 and {'3.4', '3.3', '3.2', '3.1', '3.0', '2.4', '2.3', '2.2', '2.1'} <= names
          assert len(load('?format=2')) <= 60
          assert len(load('')) <= 60
          print(json.dumps({'pass': True, 'completeHistory': len(rows), 'legacyCompatible': True}))
          PY

  verify-pages:
    needs: verify-worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for Web and PWA 7.21 and verify the published history
        run: |
          python3 -u - <<'PY'
          import json, time, urllib.request
          def read(url):
              request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'Origin': 'https://tk.st'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.read().decode('utf-8')
          for attempt in range(80):
              try:
                  home = read('https://tk.st/?release=7.21')
                  app = read('https://tk.st/magi-app/www/app.js?release=7.21')
                  history = json.loads(read('https://tk.st/data/magi-versions.json?release=7.21'))['versions']
                  api = json.loads(read('https://workers.tk.st/magi2/versions?format=3&release=7.21'))['versions']
                  assert "AGENT_SCREEN_VERSION = '7.21'" in home and "APP_VERSION = '7.21'" in app
                  assert history[0]['version'] == api[0]['version'] == '7.21'
                  assert len(history) == len(api) and any(row['version'] == '2.1' for row in api)
                  print(json.dumps({'pass': True, 'version': '7.21', 'completeHistory': len(api), 'paidRequests': 0}))
                  break
              except Exception as error:
                  print('Waiting for published 7.21:', type(error).__name__, flush=True)
                  time.sleep(20)
          else:
              raise SystemExit('Web/PWA 7.21 was not verified within the publication window')
          PY
