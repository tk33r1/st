name: Daily Retail Tech Brief

on:
  schedule:
    # 毎朝 01:55 JST（前日 16:55 UTC）に実行（nitori-daily との競合防止）
    - cron: '55 16 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target issue date (YYYYMMDD). Leave empty for today JST.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: retail-tech-daily
  cancel-in-progress: false

jobs:
  generate-news:
    uses: ./.github/workflows/daily-brief-reusable.yml
    with:
      media: retailtechdaily
      target-date: ${{ github.event.inputs.date || '' }}
    secrets: inherit
