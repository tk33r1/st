  <script>
    /* =========================================
       Data Definitions
       ========================================= */
    const themes = {
      love: {
        title: "愛とは",
        body: "誰かからの見返りを期待したり、何かと交換したりするものではない。かといって、自己犠牲でもない。愛とは、自立した人間同士が、配慮と尊重、転じて責任を持って相対し、互いの核心を知ろうとする中で、自発的にただ、与えるもののように思う。",
        lastUpdated: "2026.03.12",
        reference: `エーリッヒ・フロム（2020）『<a href="https://a.r10.to/hkGD1f" target="_blank" rel="noopener noreferrer" class="reference-link">愛するということ</a>』鈴木晶訳, 紀伊國屋書店.`
      },
      happiness: {
        title: "幸せとは",
        body: "絶え間なく幸せであり続けることは、人間である限り不可能。であれば、自分がコントロールできる範囲の苦しみを取り除く努力をし、それ以外は前向きに手放していく。その静かな諦念が、結果として幸せだと感じる時間を長くするのだろう。",
        lastUpdated: "2026.03.16",
        reference: `今枝由郎訳（2001）『<a href="https://a.r10.to/h5DyaJ" target="_blank" rel="noopener noreferrer" class="reference-link">スッタニパータ ブッダの言葉</a>』光文社.`
      },
      failure: {
        title: "失敗とは",
        body: "失敗の反対は成功だと思いがち。実際には何もしないこと。失敗は新たな学びを伴うが、何もしなければ何も得られない。早く失敗することが成功への近道。それに誰しも気づきながら、怠惰でありたいと願う無意識に、成功の反対に失敗があることを、私たちは常に語りかけられる。",
        lastUpdated: "2025.12.28",
        reference: `エリック・リース（2012）『<a href="https://a.r10.to/hRO0hL" target="_blank" rel="noopener noreferrer" class="reference-link">リーン・スタートアップ</a>』井口耕二訳, 日経BP.`
      },
      self: { title: "自我とは", body: "自分らしさを求めながら、その自分さえも移ろいゆく。今の自分は、昨日の自分ではなく、明日も変わり続ける。自我とは、固定されたものではなく、絶え間なく変化する流れの中でのみ存在するのかもしれない。", lastUpdated: "2026.03.27", reference: "カール・グスタフ・ユング（1990）『自我と無意識』高橋義孝訳, 第三文明社." },
      madness: { title: "狂気とは", body: "常識の外にある輝き。創造の狂気と破壊の狂気、二つの道がある。もしかして、狂気とは正気との境界線を引いた私たちの側の都合なのではないだろうか。時に狂気こそが、世界を変える力になる。", lastUpdated: "2026.03.26", reference: "ミシェル・フーコー（1975）『狂気の歴史』田村俶訳, 新潮社." },
      death: { title: "死とは", body: "すべてのはじまりの終わり。死を前にすると、本当に大切なものが見える。失うから、今この瞬間が輝く。死は、生の意味を問う、最後の問い。そしてそれは、実は最初から私たちの中にあったのだ。", lastUpdated: "2026.03.25", reference: "マルティン・ハイデガー（1994）『存在と時間』細谷貞夫訳, ちくま学芸文庫." },
      freedom: { title: "自由とは", body: "選択することの責任を引き受けることではないだろうか。完全な自由は存在しない。むしろ、制限の中でも自分らしく在ることが、本当の自由なのかもしれない。自由とは、与えられるものではなく、自分たちで創り出すものなのだ。", lastUpdated: "2026.03.24", reference: "ジャン＝ポール・サルトル（2007）『存在と無』松浪信三郎訳, ちくま学芸文庫." },
      society: { title: "社会とは", body: "個人の集合であり、同時に個人を超えた何か。誰もが社会の一部であり、社会は誰もが作っている。共存とは、完全には理解できない他者と、それでも歩み続けることなのだろうか。", lastUpdated: "2026.03.23", reference: "ジャン＝ジャック・ルソー（1954）『社会契約論』桑原武夫訳, 岩波文庫." },
      universe: { title: "時空とは", body: "すべての存在の舞台。時間と空間は分かちがたく結びつき、宇宙全体を包む。人間はその中でもなお小さく、しかし時空の一部でもある。星々の光は過去からの手紙。時空を見つめることは、存在の深さを感じることかもしれない。", lastUpdated: "2026.03.22", reference: "スティーヴン・ホーキング（1989）『ホーキング、宇宙を語る』林一訳, 早川書房." }
    };

    const defaultConfig = {
      main_title: "思索の余白", subtitle_text: "Space for Contemplation",
      body_text: "交通事故により、一時的に理性や記憶が制限される中、自分を取り戻そうともがきながら見えた本心と、その後の学びから得た人生のテーマ。ここは、それらを最新化し、ともに思索するための場所です。",
      last_updated_text: "2025.10.12", reference_text: "", 
      footer_text: "余白は、あなたの思考を置くスペース。"
    };

    const SITE_URL = "https://tk.st/thought/";
    const UTM_PARAMS = "?utm_source=tk.st&utm_medium=referral&utm_campaign=thought_space";
    const AVAILABLE_THEMES = ['love', 'happiness', 'failure'];
    const STORAGE_KEYS = { dark: 'thought-dark-mode', zen: 'thought-zen-mode' };

    /* =========================================
       DOM Elements & State
       ========================================= */
    const els = {
      app: document.getElementById('app'),
      contentStage: document.getElementById('contentStage'),
      headerTitleArea: document.getElementById('headerTitleArea'),
      title: document.getElementById('title'),
      subtitle: document.getElementById('subtitle'),
      body: document.getElementById('body'),
      footerText: document.getElementById('footerText'),
      topMark: document.getElementById('topMark'),
      vLine: document.getElementById('vLine'),
      hLine: document.getElementById('hLine'),
      metaInfo: document.getElementById('metaInfo'),
      metaContent: document.getElementById('metaContent'),
      lastUpdated: document.getElementById('lastUpdated'),
      reference: document.getElementById('reference'),
      footerBottom: document.getElementById('footerBottom'),
      copyright: document.getElementById('copyright'),
      disclosureBtn: document.getElementById('disclosureBtn'),
      disclosureText: document.getElementById('disclosureText'),
      disclosureModal: document.getElementById('disclosureModal'),
      closeModalBtn: document.getElementById('closeModalBtn'),
      themeToggleBtn: document.getElementById('themeToggleBtn'),
      themeToggleHandle: document.getElementById('themeToggleHandle'),
      zenToggleBtn: document.getElementById('zenToggleBtn'),
      zenEnterIcon: document.getElementById('zenEnterIcon'),
      zenExitIcon: document.getElementById('zenExitIcon'),
      copyContentBtn: document.getElementById('copyContentBtn'),
      copyContentLabel: document.getElementById('copyContentLabel'),
      openShareModalBtn: document.getElementById('openShareModalBtn'),
      shareModal: document.getElementById('shareModal'),
      closeShareModalBtn: document.getElementById('closeShareModalBtn'),
      shareX: document.getElementById('shareX'),
      shareLine: document.getElementById('shareLine'),
      shareNotion: document.getElementById('shareNotion'),
      shareCopy: document.getElementById('shareCopy'),
      shareCopyLabel: document.getElementById('shareCopyLabel'),
      buttonScroller: document.getElementById('buttonScroller'),
      themeBtns: document.querySelectorAll('.theme-btn'),
      contentElements: document.querySelectorAll('.content-element'),
      prevThemeBtn: document.getElementById('prevThemeBtn'),
      nextThemeBtn: document.getElementById('nextThemeBtn')
    };
    
    const readStoredBoolean = (key) => {
      try {
        const value = localStorage.getItem(key);
        return value === null ? null : value === 'true';
      } catch (_) {
        return null;
      }
    };

    const getThemeFromHash = () => {
      try {
        const themeName = decodeURIComponent(location.hash.slice(1));
        return AVAILABLE_THEMES.includes(themeName) ? themeName : null;
      } catch (_) {
        return null;
      }
    };

    const storedDarkMode = readStoredBoolean(STORAGE_KEYS.dark);
    let isDarkMode = storedDarkMode ?? window.matchMedia('(prefers-color-scheme: dark)').matches;
    let isZenMode = readStoredBoolean(STORAGE_KEYS.zen) ?? false;
    let currentTheme = getThemeFromHash();
    let transitionToken = 0;
    let activeModal = null;
    let modalTrigger = null;

    const getBadgeHtml = (text) => {
      return `<span class="meta-badge">${text}</span>`;
    };

    /* =========================================
       Core Logic
       ========================================= */
       
    function updateContentData(themeName) {
      const theme = (themeName && themeName !== 'reset') ? themes[themeName] : defaultConfig;
      els.title.textContent = theme.title || theme.main_title;
      els.body.textContent = theme.body || theme.body_text;
      const updated = theme.lastUpdated || (themeName === 'reset' ? defaultConfig.last_updated_text : '');
      const ref = theme.reference || (themeName === 'reset' ? defaultConfig.reference_text : '');
      let hasMeta = false;
      if (updated) {
        const datetime = updated.replace(/\./g, '-');
        els.lastUpdated.innerHTML = `${getBadgeHtml('最終更新日')}<time datetime="${datetime}">${updated}</time>`;
        els.lastUpdated.hidden = false;
        hasMeta = true;
      } else { els.lastUpdated.hidden = true; }
      if (ref) {
        els.reference.innerHTML = `${getBadgeHtml('参考文献')}<span>${ref}</span>`;
        els.reference.hidden = false;
        hasMeta = true;
      } else { els.reference.hidden = true; }
      els.metaContent.hidden = !hasMeta;
      document.title = currentTheme ? `${theme.title} | 思索の余白` : '思索の余白';
    }

    function setThemeUrl(themeName, replace = false) {
      const url = new URL(location.href);
      url.hash = themeName ? encodeURIComponent(themeName) : '';
      history[replace ? 'replaceState' : 'pushState']({}, '', url.href);
    }

    function switchTheme(themeName, { updateUrl = true, animate = true } = {}) {
      const nextTheme = themeName === 'reset' ? null : themeName;
      const normalizedTheme = AVAILABLE_THEMES.includes(nextTheme) ? nextTheme : null;
      if (currentTheme === normalizedTheme) return;

      currentTheme = normalizedTheme;
      const token = ++transitionToken;
      const shouldAnimate = animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (shouldAnimate) {
        els.contentElements.forEach(el => {
          el.classList.remove('play-fade-up', 'play-fade-in', 'delay-200', 'delay-400', 'delay-600', 'delay-800');
          el.classList.add('play-fade-out');
        });
      }

      if (updateUrl) setThemeUrl(currentTheme);
      updateButtonsHighlight();
      updateArrows();

      window.setTimeout(() => {
        if (token !== transitionToken) return;
        updateContentData(currentTheme);
        els.contentElements.forEach(el => {
          el.classList.remove('play-fade-out');
          if (!shouldAnimate) return;
          void el.offsetWidth;
          if (el.id === 'title') el.classList.add('play-fade-up');
          else if (el.id === 'body') el.classList.add('play-fade-up', 'delay-200');
          else if (el.id === 'metaInfo') el.classList.add('play-fade-up', 'delay-400');
          else el.classList.add('play-fade-in', 'delay-400');
        });
      }, shouldAnimate ? 180 : 0);
    }

    function updateArrows() {
      const currentIndex = currentTheme ? AVAILABLE_THEMES.indexOf(currentTheme) : -1;
      const showPrevious = currentIndex >= 0;
      const showNext = currentIndex < AVAILABLE_THEMES.length - 1;
      setArrowState(els.prevThemeBtn, showPrevious);
      setArrowState(els.nextThemeBtn, showNext);
    }

    function setArrowState(button, visible) {
      button.classList.toggle('is-visible', visible);
      button.disabled = !visible;
      button.setAttribute('aria-hidden', String(!visible));
    }

    function applyDisplayModes({ persist = false } = {}) {
      document.body.classList.toggle('dark-mode', isDarkMode);
      document.body.classList.toggle('zen-mode', isZenMode);
      els.themeToggleBtn.setAttribute('aria-pressed', String(isDarkMode));
      els.themeToggleBtn.setAttribute('aria-label', isDarkMode ? 'ライトモードにする' : 'ダークモードにする');
      els.themeToggleBtn.title = isDarkMode ? '昼の余白へ' : '夜の余白へ';
      els.zenToggleBtn.setAttribute('aria-pressed', String(isZenMode));
      els.zenToggleBtn.setAttribute('aria-label', isZenMode ? '集中モードを終了する' : '集中モードにする');
      els.zenToggleBtn.title = isZenMode ? '集中モードを終了' : '集中モードにする';
      els.zenEnterIcon.hidden = isZenMode;
      els.zenExitIcon.hidden = !isZenMode;

      if (persist) {
        try {
          localStorage.setItem(STORAGE_KEYS.dark, String(isDarkMode));
          localStorage.setItem(STORAGE_KEYS.zen, String(isZenMode));
        } catch (_) {}
      }
    }

    function updateButtonsHighlight() {
      els.themeBtns.forEach(btn => {
        btn.setAttribute('aria-pressed', String(btn.dataset.theme === currentTheme));
      });
    }

    /* =========================================
       Event Listeners
       ========================================= */
    
    function moveTheme(direction) {
      let targetTheme = null;

      if (direction === 'next') {
        if (!currentTheme) {
          targetTheme = AVAILABLE_THEMES[0];
        } else {
          const currentIndex = AVAILABLE_THEMES.indexOf(currentTheme);
          if (currentIndex !== -1 && currentIndex < AVAILABLE_THEMES.length - 1) {
            targetTheme = AVAILABLE_THEMES[currentIndex + 1];
          }
        }
      } else if (direction === 'prev') {
        if (currentTheme) {
          const currentIndex = AVAILABLE_THEMES.indexOf(currentTheme);
          if (currentIndex > 0) {
            targetTheme = AVAILABLE_THEMES[currentIndex - 1];
          } else if (currentIndex === 0) {
            targetTheme = 'reset';
          }
        }
      }

      if (targetTheme !== null) {
        switchTheme(targetTheme);
        if (targetTheme !== 'reset') {
          const btn = document.querySelector(`button[data-theme="${targetTheme}"]`);
          if (btn) {
            const behavior = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
            btn.scrollIntoView({ behavior, block: 'nearest', inline: 'center' });
          }
        } else {
          els.buttonScroller.scrollTo({ left: 0 });
        }
      }
    }

    els.prevThemeBtn.addEventListener('click', () => moveTheme('prev'));
    els.nextThemeBtn.addEventListener('click', () => moveTheme('next'));

    let touchStart = null;

    els.contentStage.addEventListener('touchstart', (e) => {
      if (e.target.closest('button, a, input, textarea, select')) {
        touchStart = null;
        return;
      }
      touchStart = {
        x: e.changedTouches[0].screenX,
        y: e.changedTouches[0].screenY
      };
    }, { passive: true });

    els.contentStage.addEventListener('touchend', (e) => {
      if (!touchStart) return;
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const xDiff = touchStart.x - touchEndX;
      const yDiff = touchStart.y - touchEndY;
      touchStart = null;

      if (Math.abs(xDiff) > 60 && Math.abs(xDiff) > Math.abs(yDiff) * 1.25) {
        if (xDiff > 0) moveTheme('next');
        else moveTheme('prev');
      }
    }, { passive: true });

    els.themeBtns.forEach(btn => btn.addEventListener('click', () => switchTheme(btn.dataset.theme)));
    els.subtitle.addEventListener('click', () => switchTheme('reset'));

    els.themeToggleBtn.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      applyDisplayModes({ persist: true });
    });

    els.zenToggleBtn.addEventListener('click', () => {
      isZenMode = !isZenMode;
      applyDisplayModes({ persist: true });
    });

    const copyToClipboard = async (text) => {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textArea = document.createElement('textarea');
      try {
        textArea.value = text;
        textArea.setAttribute('readonly', '');
        textArea.style.position = 'fixed';
        textArea.style.opacity = '0';
        document.body.appendChild(textArea);
        textArea.select();
        if (!document.execCommand('copy')) throw new Error('Copy command failed');
      } finally {
        textArea.remove();
      }
    };

    const getCanonicalThemeUrl = () => `${SITE_URL}${currentTheme ? `#${currentTheme}` : ''}`;

    const getFormattedContent = () => {
      const title = els.title.textContent;
      const bodyText = els.body.textContent.trim();
      return `【${title}】\n${bodyText}\n\n― 思索の余白\n${getCanonicalThemeUrl()}`;
    };

    const showTemporaryLabel = (element, message, original, duration = 2500) => {
      element.textContent = message;
      window.setTimeout(() => { element.textContent = original; }, duration);
    };

    els.copyContentBtn.addEventListener('click', async () => {
      try {
        await copyToClipboard(getFormattedContent());
        showTemporaryLabel(els.copyContentLabel, '書き留めました', '書き留める', 3000);
      } catch (error) {
        console.error('Copy failed', error);
        showTemporaryLabel(els.copyContentLabel, 'コピーできませんでした', '書き留める', 3000);
      }
    });

    const getFocusableElements = (modal) => Array.from(modal.querySelectorAll('button:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'));

    const openModal = (modal, trigger) => {
      activeModal = modal;
      modalTrigger = trigger;
      modal.hidden = false;
      els.app.inert = true;
      requestAnimationFrame(() => getFocusableElements(modal)[0]?.focus());
    };

    const closeModal = (modal) => {
      modal.hidden = true;
      els.app.inert = false;
      activeModal = null;
      const trigger = modalTrigger;
      modalTrigger = null;
      trigger?.focus();
    };

    els.openShareModalBtn.addEventListener('click', () => openModal(els.shareModal, els.openShareModalBtn));
    els.closeShareModalBtn.addEventListener('click', () => closeModal(els.shareModal));

    const getShareInfo = () => {
      const title = els.title.textContent;
      const shareUrl = `${SITE_URL}${UTM_PARAMS}${currentTheme ? `#${currentTheme}` : ''}`;
      const text = currentTheme ? `思索の余白：${title}` : `思索の余白 ― 人生の本質を思索するための場所`;
      return { text, shareUrl };
    };

    const openExternal = (url) => window.open(url, '_blank', 'noopener,noreferrer');

    els.shareX.addEventListener('click', () => {
      const { text, shareUrl } = getShareInfo();
      openExternal(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(shareUrl)}`);
    });
    els.shareLine.addEventListener('click', () => {
      const { text, shareUrl } = getShareInfo();
      openExternal(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(text)}`);
    });
    els.shareNotion.addEventListener('click', async () => {
      const label = els.shareNotion.querySelector('span:last-child');
      openExternal('https://notion.new');
      try {
        await copyToClipboard(getFormattedContent());
        showTemporaryLabel(label, 'コピー完了', 'Notion');
      } catch (error) {
        console.error('Copy failed', error);
        showTemporaryLabel(label, 'コピー失敗', 'Notion');
      }
    });
    els.shareCopy.addEventListener('click', async () => {
      const { shareUrl } = getShareInfo();
      try {
        await copyToClipboard(shareUrl);
        showTemporaryLabel(els.shareCopyLabel, 'コピー完了', 'URLコピー');
      } catch (error) {
        console.error('Copy failed', error);
        showTemporaryLabel(els.shareCopyLabel, 'コピー失敗', 'URLコピー');
      }
    });

    els.disclosureBtn.addEventListener('click', () => openModal(els.disclosureModal, els.disclosureBtn));
    els.closeModalBtn.addEventListener('click', () => closeModal(els.disclosureModal));
    [els.disclosureModal, els.shareModal].forEach(modal => {
      modal.addEventListener('click', (event) => {
        if (event.target === modal) closeModal(modal);
      });
    });

    document.addEventListener('keydown', (event) => {
      if (activeModal) {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeModal(activeModal);
          return;
        }
        if (event.key === 'Tab') {
          const focusable = getFocusableElements(activeModal);
          if (!focusable.length) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
        return;
      }

      if (event.target.closest('input, textarea, select, button, a')) return;
      if (event.key === 'ArrowLeft') moveTheme('prev');
      if (event.key === 'ArrowRight') moveTheme('next');
    });

    const syncThemeFromUrl = () => {
      switchTheme(getThemeFromHash() || 'reset', { updateUrl: false });
    };
    window.addEventListener('popstate', syncThemeFromUrl);
    window.addEventListener('hashchange', syncThemeFromUrl);

    if (location.hash && !currentTheme) setThemeUrl(null, true);
    applyDisplayModes();
    updateContentData(currentTheme);
    updateButtonsHighlight();
    updateArrows();

    document.getElementById('copyright-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
